en:`<table><tr><th>Word</th><th>Time</th><th>Place</th></tr><tr><td><b>at</b></td><td>exact time: at 9 a.m., at night</td><td>a point: at the bus stop, at the airport</td></tr><tr><td><b>on</b></td><td>days/dates: on Monday, on 5 May</td><td>surface: on the table</td></tr><tr><td><b>in</b></td><td>months/years/seasons: in March, in 2005</td><td>enclosed/large area: in Johor Bahru, in the box</td></tr></table><p><b>Others:</b> <i>by bus</i> (transport), <i>between</i> (two things), <i>under</i>, <i>across</i>, <i>since</i> + starting point (since 2020), <i>for</i> + duration (for 3 years). Fixed pairs: good <b>at</b>, afraid <b>of</b>.</p><div class="eg">See you <b>on</b> Monday <b>at</b> 9 a.m. · I live <b>in</b> Johor.</div>`,

{t:["Present Continuous","Kala Kini Berterusan"],
en:`<h4>1. Form</h4><p><b>am / is / are + verb-ing.</b> Negative: <i>am/is/are + not + verb-ing</i>. Question: <i>Am/Is/Are + subject + verb-ing?</i></p><table><tr><th>Subject</th><th>Positive</th><th>Negative</th><th>Question</th></tr><tr><td>I</td><td>I am eating</td><td>I am not eating</td><td>Am I eating?</td></tr><tr><td>He / She / It</td><td>She is eating</td><td>She isn't eating</td><td>Is she eating?</td></tr><tr><td>You / We / They</td><td>They are eating</td><td>They aren't eating</td><td>Are they eating?</td></tr></table><h4>2. Uses</h4><p><b>(a)</b> Actions happening <u>now</u>: <i>I am writing a letter now.</i><br><b>(b)</b> Temporary situations around now: <i>He is staying with his uncle this week.</i><br><b>(c)</b> Fixed plans in the near future: <i>We are going to Melaka tomorrow.</i><br><b>(d)</b> Changing or developing situations: <i>Prices are rising.</i></p><p><b>Signal words:</b> now, at the moment, today, currently, look!, listen!</p><h4>3. Spelling of -ing</h4><table><tr><th>Rule</th><th>Example</th></tr><tr><td>Normal: add -ing</td><td>play → playing</td></tr><tr><td>Ends with silent -e: drop e</td><td>make → making</td></tr><tr><td>One vowel + one consonant: double consonant</td><td>run → running, sit → sitting</td></tr><tr><td>Ends with -ie: change to -y</td><td>lie → lying, die → dying</td></tr></table><h4>4. Stative verbs (no -ing)</h4><p>Verbs of state, feeling and thinking are normally <b>not</b> used in continuous form: know, understand, believe, like, love, hate, want, need, belong, own.</p><div class="eg">✘ I am knowing the answer. ✔ I know the answer.</div><h4>5. Common mistakes</h4><p>✘ She is cook. → ✔ She is cooking. · ✘ They playing. → ✔ They are playing. (do not forget <i>am/is/are</i>)</p>`,
bm:`<h4>1. Bentuk</h4><p><b>am / is / are + kata kerja-ing.</b> Negatif: <i>am/is/are + not + kata kerja-ing</i>. Soalan: <i>Am/Is/Are + subjek + kata kerja-ing?</i> Jadual di atas menunjukkan susunan bagi setiap subjek (I → am; he/she/it → is; you/we/they → are).</p><h4>2. Kegunaan</h4><p><b>(a)</b> Perbuatan yang sedang berlaku <u>sekarang</u>: <i>Saya sedang menulis surat.</i><br><b>(b)</b> Keadaan sementara sekitar masa kini: <i>Dia menumpang di rumah bapa saudaranya minggu ini.</i><br><b>(c)</b> Rancangan tetap yang hampir: <i>Kami akan ke Melaka esok.</i><br><b>(d)</b> Keadaan yang sedang berubah: <i>Harga sedang meningkat.</i></p><p><b>Kata petunjuk:</b> now (sekarang), at the moment (buat masa ini), today, currently (kini), look! (lihat!), listen! (dengar!)</p><h4>3. Ejaan -ing</h4><p>Biasa: tambah -ing (play → playing). Berakhir -e senyap: buang e (make → making). Satu vokal + satu konsonan: gandakan konsonan (run → running, sit → sitting). Berakhir -ie: tukar kepada -y (lie → lying).</p><h4>4. Kata kerja keadaan (tiada -ing)</h4><p>Kata kerja yang menunjukkan keadaan, perasaan dan pemikiran biasanya <b>tidak</b> digunakan dalam bentuk berterusan: know (tahu), understand (faham), believe (percaya), like (suka), love (sayang), hate (benci), want (mahu), need (perlu), belong (milik), own (memiliki).</p><div class="eg">✘ I am knowing the answer. ✔ I know the answer. (Saya tahu jawapannya.)</div><h4>5. Kesilapan lazim</h4><p>✘ She is cook. → ✔ She is cooking. · ✘ They playing. → ✔ They are playing. (jangan lupa <i>am/is/are</i>)</p>`,
q:[["She ___ TV now.",["watch","watches","is watching","watched"],2],["They ___ football at the moment.",["are playing","plays","play","is playing"],0],["I ___ a letter now.",["am writing","is writing","are writing","write"],0],["___ he sleeping?",["Do","Does","Is","Are"],2],["We ___ not studying.",["is","am","are","do"],2],["The -ing form of 'run' is:",["runing","running","runeing","runninging"],1],["The -ing form of 'make' is:",["makeing","making","maked","makking"],1],["Which is correct?",["I am knowing the answer.","I know the answer.","I am know the answer.","I knowing the answer."],1],["Look! It ___.",["rains","is raining","rain","raining"],1],["My parents ___ to Melaka tomorrow. (plan)",["is going","are going","went","gone"],1],["What ___ you doing?",["do","is","are","does"],2],["He ___ not listening to me.",["are","is","do","does"],1],["The -ing form of 'lie' is:",["lieing","lying","liing","lyeing"],1],["Which is correct?",["She is cook dinner.","She is cooking dinner.","She cooking dinner.","She cooks now dinner."],1],["The baby ___ now.",["cry","cries","is crying","are crying"],2]]},
{t:["Modal Verbs","Kata Kerja Modal"],
en:`<h4>1. What are modals?</h4><p>Modal verbs (can, could, may, might, must, should, will, would, shall) are helping verbs that show ability, permission, possibility, obligation, advice or offers.</p><h4>2. Three golden rules</h4><p><b>(a)</b> Modal + <b>base verb</b> (no -s, no -ing, no <i>to</i>): ✔ She can swim. ✘ She can swims / can to swim.<br><b>(b)</b> No <i>do/does/did</i>: negative = modal + not (can't, mustn't); question = modal + subject. ✔ Can she drive? ✘ Does she can drive?<br><b>(c)</b> The form is the same for all subjects (I can, he can, they can).</p><h4>3. Meanings</h4><table><tr><th>Modal</th><th>Use</th><th>Example</th></tr><tr><td>can / could</td><td>ability; polite request (could)</td><td>He could speak Japanese at five. Could you help me?</td></tr><tr><td>may / can</td><td>permission</td><td>May I borrow your pen?</td></tr><tr><td>may / might</td><td>possibility</td><td>It might rain later.</td></tr><tr><td>must</td><td>strong obligation; logical deduction</td><td>You must wear a helmet. He must be home; his car is outside.</td></tr><tr><td>mustn't</td><td>prohibition (not allowed)</td><td>You mustn't smoke here.</td></tr><tr><td>don't have to</td><td>no obligation (optional)</td><td>You don't have to wear a uniform on Saturday.</td></tr><tr><td>should / ought to</td><td>advice</td><td>You should see a doctor.</td></tr><tr><td>shall</td><td>offer or suggestion</td><td>Shall we go to the cinema?</td></tr><tr><td>would</td><td>polite wish; habits in the past</td><td>I would like a cup of tea.</td></tr></table><h4>4. Important difference</h4><p><b>mustn't</b> = forbidden. <b>don't have to</b> = not necessary. They are NOT the same.</p>`,
bm:`<h4>1. Apakah kata kerja modal?</h4><p>Kata kerja modal (can, could, may, might, must, should, will, would, shall) ialah kata kerja bantu yang menunjukkan keupayaan, kebenaran, kemungkinan, kewajipan, nasihat atau tawaran.</p><h4>2. Tiga peraturan penting</h4><p><b>(a)</b> Modal + <b>kata kerja asas</b> (tiada -s, tiada -ing, tiada <i>to</i>): ✔ She can swim. ✘ She can swims / can to swim.<br><b>(b)</b> Tiada <i>do/does/did</i>: negatif = modal + not (can't, mustn't); soalan = modal + subjek. ✔ Can she drive? ✘ Does she can drive?<br><b>(c)</b> Bentuk sama untuk semua subjek (I can, he can, they can).</p><h4>3. Maksud</h4><p><b>can</b> = boleh/mampu (keupayaan). <b>could</b> = dapat (masa lampau) atau permintaan sopan. <b>may</b> = dibenarkan / mungkin. <b>might</b> = mungkin (kemungkinan kecil). <b>must</b> = mesti (kewajipan kuat) atau pasti (kesimpulan logik): <i>He must be home; his car is outside</i> (Dia pasti di rumah; keretanya ada di luar). <b>mustn't</b> = dilarang. <b>don't have to</b> = tidak perlu (pilihan). <b>should</b> = sepatutnya (nasihat): <i>You should see a doctor</i> (Anda patut berjumpa doktor). <b>shall</b> = tawaran/cadangan: <i>Shall we go?</i> (Jom kita pergi?). <b>would</b> = hasrat sopan: <i>I would like a cup of tea</i> (Saya mahu secawan teh).</p><h4>4. Perbezaan penting</h4><p><b>mustn't</b> = dilarang. <b>don't have to</b> = tidak perlu. Maksudnya <b>tidak sama</b>.</p>`,
q:[["She can ___ English.",["speaks","speak","to speak","speaking"],1],["You ___ wear a helmet on a motorcycle. (law)",["can","must","might","would"],1],["___ I borrow your pen? (polite permission)",["May","Must","Will","Shall"],0],["You look sick. You ___ see a doctor. (advice)",["should","must not","can't","would"],0],["He ___ speak Japanese when he was five.",["can","could","must","should"],1],["Which is correct?",["She cans swim.","She can swims.","She can swim.","She can to swim."],2],["It ___ rain later, so take an umbrella. (possibility)",["might","must","shall","need"],0],["You ___ smoke here. It is forbidden.",["don't have to","mustn't","needn't","might"],1],["You ___ wear a uniform on Saturday. It is optional.",["mustn't","don't have to","can't","shouldn't"],1],["___ you help me, please?",["Could","Must","Might","Should"],0],["___ we go to the cinema tonight? (suggestion)",["Shall","Would","Might","Does"],0],["His car is outside. He ___ be at home. (deduction)",["must","should","shall","would"],0],["Which is correct?",["Does she can drive?","Can she drive?","Can she drives?","Is she can drive?"],1],["I ___ like a cup of tea.",["will","would","can","must"],1],["Which means 'not allowed'?",["mustn't","needn't","don't have to","might not"],0]]},
{t:["Comparison of Adjectives","Perbandingan Kata Adjektif"],
en:`<h4>1. Three degrees</h4><p><b>Positive</b> (tall) describes one thing. <b>Comparative</b> (taller) compares two things, with <i>than</i>. <b>Superlative</b> (the tallest) compares three or more things, with <i>the</i>.</p><h4>2. Rules</h4><table><tr><th>Type</th><th>Comparative</th><th>Superlative</th></tr><tr><td>1 syllable: add -er / -est</td><td>tall → taller</td><td>the tallest</td></tr><tr><td>Ends in -e: add -r / -st</td><td>nice → nicer</td><td>the nicest</td></tr><tr><td>Consonant-vowel-consonant: double the last letter</td><td>big → bigger, hot → hotter</td><td>the biggest, the hottest</td></tr><tr><td>Ends in consonant + y: y → i</td><td>happy → happier</td><td>the happiest</td></tr><tr><td>2+ syllables: more / most</td><td>beautiful → more beautiful</td><td>the most beautiful</td></tr></table><h4>3. Irregular adjectives</h4><table><tr><th>Positive</th><th>Comparative</th><th>Superlative</th></tr><tr><td>good / well</td><td>better</td><td>the best</td></tr><tr><td>bad</td><td>worse</td><td>the worst</td></tr><tr><td>far</td><td>farther / further</td><td>the farthest / furthest</td></tr><tr><td>little</td><td>less</td><td>the least</td></tr><tr><td>many / much</td><td>more</td><td>the most</td></tr></table><h4>4. Equality</h4><p>Use <b>as + adjective + as</b>: <i>He runs as fast as his brother.</i> Negative: <i>not as … as</i>.</p><h4>5. Common mistakes</h4><p>✘ more better → ✔ better · ✘ gooder → ✔ better · ✘ most beautifulest → ✔ the most beautiful. Never use <i>more</i> and <i>-er</i> together.</p>`,
bm:`<h4>1. Tiga darjah</h4><p><b>Positif</b> (tall) menerangkan satu benda. <b>Komparatif</b> (taller) membandingkan dua benda, dengan <i>than</i> (daripada). <b>Superlatif</b> (the tallest) membandingkan tiga atau lebih, dengan <i>the</i> (paling).</p><h4>2. Peraturan</h4><p><b>Satu suku kata:</b> tambah -er / -est (tall → taller → the tallest). <b>Berakhir -e:</b> tambah -r / -st (nice → nicer → the nicest). <b>Konsonan-vokal-konsonan:</b> gandakan huruf akhir (big → bigger → the biggest). <b>Konsonan + y:</b> tukar y kepada i (happy → happier → the happiest). <b>Dua suku kata atau lebih:</b> guna more / most (beautiful → more beautiful → the most beautiful).</p><h4>3. Adjektif tidak sekata</h4><p>good → better → the best (baik). bad → worse → the worst (buruk). far → farther/further → the farthest/furthest (jauh). little → less → the least (sedikit). many/much → more → the most (banyak).</p><h4>4. Kesamaan</h4><p>Guna <b>as + adjektif + as</b> (sama … seperti): <i>He runs as fast as his brother</i> (Dia berlari sepantas abangnya). Negatif: <i>not as … as</i>.</p><h4>5. Kesilapan lazim</h4><p>✘ more better → ✔ better · ✘ gooder → ✔ better · ✘ most beautifulest → ✔ the most beautiful. Jangan gunakan <i>more</i> dan <i>-er</i> serentak.</p>`,
q:[["Ali is ___ than Ahmad.",["tall","taller","tallest","more tall"],1],["She is the ___ student in class.",["smart","smarter","smartest","most smart"],2],["This bag is ___ than that one.",["more expensive","expensiver","most expensive","expensivest"],0],["The comparative of 'good' is:",["gooder","better","best","more good"],1],["The superlative of 'bad' is:",["baddest","worse","worst","most bad"],2],["The comparative of 'big' is:",["biger","bigger","more big","bigest"],1],["The comparative of 'happy' is:",["happyer","more happy","happier","happiest"],2],["KL is ___ city in Malaysia.",["larger","the largest","more large","most largest"],1],["He runs as ___ as his brother.",["fast","faster","fastest","more fast"],0],["Which is correct?",["This is more better.","This is better.","This is gooder.","This is more good."],1],["Mount Kinabalu is ___ than Bukit Timah.",["high","higher","highest","the highest"],1],["Which is correct?",["She is the most beautiful girl.","She is the beautifulest girl.","She is most beautiful girl.","She is the more beautiful girl."],0],["The comparative of 'far' (distance) is:",["farer","farther","farest","most far"],1],["Today is ___ than yesterday. (hot)",["hoter","more hot","hotter","hottest"],2],["My house is ___ to school than yours. (near)",["nearer","nearest","more near","most near"],0]]},
{t:["Present Simple: 'to be'","Kala Kini: 'to be' (am, is, are)"],
en:`<h4>1. Forms</h4><table><tr><th>Subject</th><th>Positive</th><th>Negative</th><th>Question</th></tr><tr><td>I</td><td>I am (I'm)</td><td>I am not (I'm not)</td><td>Am I?</td></tr><tr><td>He / She / It</td><td>is ('s)</td><td>is not (isn't)</td><td>Is she?</td></tr><tr><td>You / We / They</td><td>are ('re)</td><td>are not (aren't)</td><td>Are they?</td></tr></table><h4>2. Uses</h4><p>Name, age, nationality, job, feelings, description, place: <i>I am 12. She is a nurse. They are from Johor. We are tired. It is hot. He is at home.</i></p><h4>3. Questions and short answers</h4><p>Put <i>am/is/are</i> before the subject: <i>Are you Malaysian?</i> Short answers: <i>Yes, I am. / No, I'm not. / Yes, he is. / No, they aren't.</i> Do not shorten a positive short answer (✘ Yes, I'm).</p><h4>4. Wh- questions</h4><p><i>Where are you from? What is your name? How old is he? Who are they?</i></p><h4>5. Common mistakes</h4><p>✘ She is agree → ✔ She agrees. · ✘ He are hungry → ✔ He is hungry. · ✘ I have 12 years old → ✔ I am 12 years old. · <i>to be</i> is NOT used with another main verb in simple present (✘ He is go).</p>`,
bm:`<h4>1. Bentuk</h4><p>I → <b>am</b>; he/she/it → <b>is</b>; you/we/they → <b>are</b>. Negatif: tambah <i>not</i> (isn't, aren't, I'm not). Soalan: letakkan <i>am/is/are</i> sebelum subjek (Are you…? Is she…?).</p><h4>2. Kegunaan</h4><p>Nama, umur, kewarganegaraan, pekerjaan, perasaan, penerangan dan tempat: <i>I am 12 (Saya 12 tahun). She is a nurse (Dia seorang jururawat). They are from Johor (Mereka dari Johor). We are tired (Kami penat). It is hot (Cuaca panas). He is at home (Dia di rumah).</i></p><h4>3. Soalan dan jawapan pendek</h4><p><i>Are you Malaysian?</i> → <i>Yes, I am. / No, I'm not. / Yes, he is. / No, they aren't.</i> Jangan pendekkan jawapan positif (✘ Yes, I'm).</p><h4>4. Soalan Wh-</h4><p><i>Where are you from? (Anda dari mana?) What is your name? (Siapa nama anda?) How old is he? (Berapa umurnya?)</i></p><h4>5. Kesilapan lazim</h4><p>✘ She is agree → ✔ She agrees. · ✘ He are hungry → ✔ He is hungry. · ✘ I have 12 years old → ✔ I am 12 years old. · <i>to be</i> tidak digunakan bersama kata kerja utama lain dalam kala kini mudah (✘ He is go).</p>`,

{t:["Nouns: Countable & Uncountable","Kata Nama Terbilang & Tak Terbilang"],
en:`<h4>1. Countable nouns</h4><p>You can count them (one book, two books). They have singular and plural forms and can take <b>a/an</b>. Use <b>many, a few, few, several, (how) many</b>: <i>How many eggs are there? There are a few eggs.</i></p><h4>2. Uncountable nouns</h4><p>You cannot count them directly. No plural, no <i>a/an</i>, and they take a <b>singular</b> verb. Use <b>much, a little, little, a bit of, (how) much</b>: <i>How much rice do you want? I need a little water.</i></p><table><tr><th>Type</th><th>Examples</th></tr><tr><td>Countable</td><td>apple, chair, student, egg, sandwich, car</td></tr><tr><td>Uncountable</td><td>water, rice, milk, money, bread, information, advice, furniture, homework, news, traffic, luggage</td></tr></table><h4>3. Making uncountable nouns countable</h4><p>Use a unit: <i>a glass of water, a slice of bread, a piece of advice, a bottle of milk, a bowl of rice, a piece of paper.</i></p><h4>4. some / any / a lot of</h4><p><b>some</b> in positive sentences, <b>any</b> in negatives and questions, <b>a lot of</b> with both types: <i>I have some money. We don't have any milk. Is there any sugar?</i></p><h4>5. Common mistakes</h4><p>✘ informations, advices, furnitures, homeworks → ✔ information, advice, furniture, homework. ✘ The news are good → ✔ The news is good.</p>`,
bm:`<h4>1. Kata nama terbilang</h4><p>Boleh dikira (satu buku, dua buku). Ada bentuk tunggal dan jamak serta boleh menggunakan <b>a/an</b>. Gunakan <b>many, a few, few, several, (how) many</b>: <i>How many eggs are there? (Berapa biji telur ada?) There are a few eggs. (Ada beberapa biji telur.)</i></p><h4>2. Kata nama tak terbilang</h4><p>Tidak boleh dikira terus. Tiada bentuk jamak, tiada <i>a/an</i>, dan menggunakan kata kerja <b>tunggal</b>. Gunakan <b>much, a little, little, a bit of, (how) much</b>: <i>How much rice do you want? (Berapa banyak nasi anda mahu?) I need a little water. (Saya perlu sedikit air.)</i></p><p><b>Terbilang:</b> apple, chair, student, egg, sandwich, car. <b>Tak terbilang:</b> water, rice, milk, money, bread, information (maklumat), advice (nasihat), furniture (perabot), homework (kerja rumah), news (berita), traffic (lalu lintas), luggage (bagasi).</p><h4>3. Menjadikan kata nama tak terbilang boleh dikira</h4><p>Guna unit: <i>a glass of water (segelas air), a slice of bread (sekeping roti), a piece of advice (satu nasihat), a bottle of milk (sebotol susu), a bowl of rice (semangkuk nasi), a piece of paper (sehelai kertas).</i></p><h4>4. some / any / a lot of</h4><p><b>some</b> dalam ayat positif, <b>any</b> dalam ayat negatif dan soalan, <b>a lot of</b> (banyak) dengan kedua-dua jenis: <i>I have some money. We don't have any milk. Is there any sugar?</i></p><h4>5. Kesilapan lazim</h4><p>✘ informations, advices, furnitures, homeworks → ✔ information, advice, furniture, homework. ✘ The news are good → ✔ The news is good.</p>`,
q:[["Which is countable?",["rice","water","apple","money"],2],["Which is uncountable?",["chair","advice","book","egg"],1],["How ___ rice do you want?",["many","much","few","a"],1],["How ___ eggs are there?",["much","many","little","a bit"],1],["Which is correct?",["I need some informations.","I need some information.","I need an information.","I need many informations."],1],["There isn't ___ milk left.",["some","any","many","a"],1],["I'd like ___ water, please.",["a","an","some","many"],2],["She gave me a good piece of ___.",["advices","advice","advise","advicees"],1],["We don't have ___ chairs.",["much","many","a bit of","little"],1],["'Furniture' is:",["countable","uncountable","plural only","a verb"],1],["A ___ of paper.",["piece","glass","bottle","cup"],0],["Which is correct?",["The news are good.","The news is good.","The newses are good.","A news is good."],1],["I have a lot of ___.",["homeworks","homework","a homework","homeworks are"],1],["Is there ___ traffic?",["many","much","a few","several"],1],["Which can take 'a/an'?",["money","bread","sandwich","rice"],2]]},
{t:["There is / There are","There is / There are (Ada)"],
en:`<h4>1. Meaning</h4><p><i>There is / There are</i> says that something exists or is present in a place. It is often used to introduce something new.</p><h4>2. Forms</h4><table><tr><th>Type</th><th>Singular / uncountable</th><th>Plural</th></tr><tr><td>Positive</td><td>There is a book. There's some water.</td><td>There are three books.</td></tr><tr><td>Negative</td><td>There isn't a book. There isn't any milk.</td><td>There aren't any books.</td></tr><tr><td>Question</td><td>Is there a bank near here?</td><td>Are there any eggs?</td></tr><tr><td>Short answer</td><td>Yes, there is. / No, there isn't.</td><td>Yes, there are. / No, there aren't.</td></tr><tr><td>Past</td><td>There was a problem.</td><td>There were two cars.</td></tr></table><h4>3. Rules</h4><p>The verb agrees with the noun after it. Use <b>a/an</b> with singular, <b>some/any</b> with plural or uncountable, <b>no</b> = not any (<i>There is no sugar</i>). With a list, agree with the first noun (<i>There is a pen and two books</i>). Ask quantity: <i>How many students are there?</i></p><h4>4. There vs It</h4><p><i>There is a park near my house</i> (something exists). <i>It is a big park</i> (describes a known thing).</p><h4>5. Common mistakes</h4><p>✘ There have a mosque. → ✔ There is a mosque. · ✘ It has a book on the table. → ✔ There is a book on the table. · ✘ There are a park. → ✔ There is a park.</p>`,
bm:`<h4>1. Maksud</h4><p><i>There is / There are</i> bermaksud sesuatu wujud atau <b>ada</b> di sesuatu tempat. Sering digunakan untuk memperkenalkan sesuatu yang baharu.</p><h4>2. Bentuk</h4><p><b>Positif:</b> There is a book (Ada sebuah buku). There's some water. There are three books (Ada tiga buah buku). <b>Negatif:</b> There isn't a book. There isn't any milk. There aren't any books (Tiada buku). <b>Soalan:</b> Is there a bank near here? (Adakah bank berhampiran?) Are there any eggs? <b>Jawapan pendek:</b> Yes, there is. / No, there isn't. / Yes, there are. / No, there aren't. <b>Lampau:</b> There was a problem. There were two cars.</p><h4>3. Peraturan</h4><p>Kata kerja mengikut kata nama selepasnya. Guna <b>a/an</b> dengan tunggal, <b>some/any</b> dengan jamak atau tak terbilang, <b>no</b> = tiada (<i>There is no sugar</i>). Dengan senarai, ikut kata nama pertama (<i>There is a pen and two books</i>). Tanya kuantiti: <i>How many students are there?</i> (Berapa orang pelajar ada?)</p><h4>4. There berbanding It</h4><p><i>There is a park near my house</i> (ada sebuah taman, wujud). <i>It is a big park</i> (menerangkan sesuatu yang sudah diketahui).</p><h4>5. Kesilapan lazim</h4><p>Dalam Bahasa Melayu "ada" boleh diterjemah terus kepada <i>have</i>, tetapi ini salah: ✘ There have a mosque. → ✔ There is a mosque. · ✘ It has a book on the table. → ✔ There is a book on the table. · ✘ There are a park. → ✔ There is a park.</p>`,
q:[["___ a book on the table.",["There is","There are","It is","They are"],0],["___ three students in the class.",["There is","There are","There have","Has"],1],["___ any milk in the fridge?",["Are there","Is there","There is","Have there"],1],["There ___ not any chairs.",["is","are","have","do"],1],["'Is there a bank near here?' Yes, ___.",["there is","it is","there are","there has"],0],["'Are there any eggs?' No, ___.",["there isn't","there aren't","it isn't","there not"],1],["There ___ some water in the glass.",["are","is","have","be"],1],["Which is correct?",["There have a mosque here.","There is a mosque here.","It has a mosque here.","Here is have a mosque."],1],["There ___ a lot of people at the market.",["is","are","has","have"],1],["The short form of 'there is' is:",["there's","there're is","theyre","there'is"],0],["___ there a problem yesterday?",["Is","Are","Was","Were"],2],["There ___ no sugar left.",["are","is","were","have"],1],["How many students ___ there in your class?",["is","are","has","have"],1],["There ___ some children in the park.",["is","are","has","have"],1],["Which is correct?",["There are a park near my house.","There is a park near my house.","It is a park near my house.","There has a park near my house."],1]]},
{t:["Past Continuous & Past Simple","Lampau Berterusan & Lampau Mudah"],
en:`<h4>1. Form</h4><p><b>Past continuous: was / were + verb-ing.</b> (I/he/she/it <b>was</b>; you/we/they <b>were</b>.) Negative: <i>wasn't / weren't + verb-ing</i>. Question: <i>Was he working? Were they sleeping?</i></p><h4>2. Uses</h4><p><b>(a)</b> An action in progress at a moment in the past: <i>At 8 p.m. last night, I was watching TV.</i><br><b>(b)</b> Background action interrupted by a shorter action: <i>I was walking home when I saw an accident.</i> (long action = past continuous, short action = past simple)<br><b>(c)</b> Two actions happening at the same time: <i>While I was cooking, my brother was playing a game.</i><br><b>(d)</b> Setting the scene in a story: <i>It was raining and people were running.</i></p><h4>3. when and while</h4><p><b>while</b> + past continuous (the long action). <b>when</b> + past simple (the short action): <i>While she was walking, it started to rain. / When the phone rang, I was watching TV.</i></p><h4>4. Past simple vs past continuous</h4><table><tr><th>Past simple</th><th>Past continuous</th></tr><tr><td>finished, complete action</td><td>action in progress, not necessarily finished</td></tr><tr><td>She wrote a letter. (finished)</td><td>She was writing a letter. (in progress)</td></tr></table><h4>5. Common mistakes</h4><p>✘ I was knowing the answer → ✔ I knew the answer (stative verbs are not continuous). ✘ I was see an accident → ✔ I saw an accident. ✘ They was playing → ✔ They were playing.</p>`,
bm:`<h4>1. Bentuk</h4><p><b>Lampau berterusan: was / were + kata kerja-ing.</b> (I/he/she/it <b>was</b>; you/we/they <b>were</b>.) Negatif: <i>wasn't / weren't + kata kerja-ing</i>. Soalan: <i>Was he working? Were they sleeping?</i></p><h4>2. Kegunaan</h4><p><b>(a)</b> Perbuatan yang <u>sedang berlaku</u> pada satu masa dahulu: <i>At 8 p.m. last night, I was watching TV</i> (Pada pukul 8 malam tadi, saya sedang menonton TV).<br><b>(b)</b> Perbuatan latar belakang yang dipotong oleh perbuatan yang lebih singkat: <i>I was walking home when I saw an accident</i> (Saya sedang berjalan pulang apabila ternampak kemalangan). Perbuatan panjang = lampau berterusan, perbuatan singkat = lampau mudah.<br><b>(c)</b> Dua perbuatan berlaku serentak: <i>While I was cooking, my brother was playing a game</i> (Semasa saya memasak, abang saya bermain permainan video).<br><b>(d)</b> Menggambarkan latar cerita: <i>It was raining and people were running.</i></p><h4>3. when dan while</h4><p><b>while</b> (semasa) + lampau berterusan (perbuatan panjang). <b>when</b> (apabila) + lampau mudah (perbuatan singkat): <i>While she was walking, it started to rain. / When the phone rang, I was watching TV.</i></p><h4>4. Lampau mudah berbanding lampau berterusan</h4><p><i>She wrote a letter</i> = dia menulis surat dan sudah siap. <i>She was writing a letter</i> = dia sedang menulis surat (belum tentu siap).</p><h4>5. Kesilapan lazim</h4><p>✘ I was knowing the answer → ✔ I knew the answer (kata kerja keadaan tidak berterusan). ✘ I was see an accident → ✔ I saw an accident. ✘ They was playing → ✔ They were playing.</p>`,
q:[["I ___ TV when the phone rang.",["watch","watched","was watching","were watching"],2],["They ___ football at 5 p.m. yesterday.",["played","were playing","was playing","play"],1],["While she ___, it started to rain.",["walked","was walking","were walking","walks"],1],["He ___ dinner when I arrived.",["cooked","was cooking","were cooking","cooks"],1],["What ___ you doing at 8 last night?",["was","were","did","do"],1],["We ___ not sleeping when you called.",["was","were","did","are"],1],["I ___ my keys while I was running.",["lose","lost","was losing","were losing"],1],["___ it raining when you left?",["Did","Was","Were","Do"],1],["When the teacher came in, the students ___.",["talked","were talking","was talking","talk"],1],["Which is correct?",["I was knowing the answer.","I knew the answer.","I was know the answer.","I were knowing the answer."],1],["She ___ a shower when the lights went out.",["took","was taking","were taking","takes"],1],["While I ___ dinner, my brother ___ a video game.",["cooked / played","was cooking / was playing","was cook / was play","cook / played"],1],["He fell while he ___.",["ran","was running","were running","runs"],1],["Which is correct?",["When I was walking home, I saw an accident.","When I walked home, I was seeing an accident.","When I was walking home, I was seeing an accident.","When I walk home, I seen an accident."],0],["They ___ not listening, so they missed the instructions.",["was","were","did","are"],1]]},
{t:["Possessive 's","Kepunyaan 's (Possessive)"],
en:`<h4>1. Meaning</h4><p>The possessive <b>'s</b> shows that something belongs to a person, animal or group, or shows a relationship: <i>Ali's book, my mother's car, the cat's tail.</i></p><h4>2. Rules</h4><table><tr><th>Noun</th><th>Rule</th><th>Example</th></tr><tr><td>Singular</td><td>add <b>'s</b></td><td>the teacher's desk, Ali's bag</td></tr><tr><td>Plural ending in -s</td><td>add only <b>'</b></td><td>the students' room, my parents' house</td></tr><tr><td>Irregular plural</td><td>add <b>'s</b></td><td>children's toys, women's room, men's shoes</td></tr><tr><td>Name ending in -s</td><td>'s or ' (both accepted)</td><td>James's car / James' car</td></tr><tr><td>Two owners together</td><td>'s after the last name</td><td>Ali and Siti's house (one house)</td></tr></table><h4>3. 's or of?</h4><p>Use <b>'s</b> for people, animals and time (<i>today's news, yesterday's match</i>). Use <b>of</b> for things: <i>the door of the room, the end of the road.</i></p><h4>4. Careful</h4><p><b>'s</b> can also mean <i>is</i> or <i>has</i>: <i>Ali's ill</i> (= Ali is ill), <i>She's got a car</i> (= She has got). <b>its</b> (possessive, no apostrophe) ≠ <b>it's</b> (= it is / it has). <b>Whose</b> asks about owner: <i>Whose bag is this?</i> (<b>who's</b> = who is).</p><h4>5. Common mistakes</h4><p>✘ two book's → ✔ two books (plural uses no apostrophe). ✘ childrens' → ✔ children's. ✘ the womens room → ✔ the women's room.</p>`,
bm:`<h4>1. Maksud</h4><p><b>'s</b> menunjukkan sesuatu milik orang, haiwan atau kumpulan, atau hubungan: <i>Ali's book (buku Ali), my mother's car (kereta ibu saya), the cat's tail (ekor kucing itu).</i></p><h4>2. Peraturan</h4><p><b>Tunggal:</b> tambah <b>'s</b> (the teacher's desk). <b>Jamak berakhir -s:</b> tambah <b>'</b> sahaja (the students' room = bilik para pelajar; my parents' house). <b>Jamak tak sekata:</b> tambah <b>'s</b> (children's toys, women's room, men's shoes). <b>Nama berakhir -s:</b> 's atau ' (James's car / James' car). <b>Dua pemilik bersama:</b> 's selepas nama terakhir (Ali and Siti's house = satu rumah milik mereka berdua).</p><h4>3. 's atau of?</h4><p>Guna <b>'s</b> untuk orang, haiwan dan masa (<i>today's news = berita hari ini</i>). Guna <b>of</b> untuk benda: <i>the door of the room (pintu bilik itu), the end of the road.</i></p><h4>4. Berhati-hati</h4><p><b>'s</b> juga boleh bermaksud <i>is</i> atau <i>has</i>: <i>Ali's ill</i> (= Ali is ill), <i>She's got a car</i> (= She has got). <b>its</b> (milik, tanpa apostrof) ≠ <b>it's</b> (= it is / it has). <b>Whose</b> bertanya tentang pemilik: <i>Whose bag is this?</i> (Beg siapa ini?) (<b>who's</b> = who is).</p><h4>5. Kesilapan lazim</h4><p>✘ two book's → ✔ two books (jamak tidak guna apostrof). ✘ childrens' → ✔ children's. ✘ the womens room → ✔ the women's room.</p>`,
q:[["This is ___ book.",["Ali","Ali's","Alis'","Alis"],1],["The ___ room is big. (many students)",["student's","students'","students's","studentes"],1],["The ___ toys are here.",["childrens'","children's","childs'","childrens"],1],["My ___ car is new. (my father)",["father's","fathers","fathers'","father"],0],["Which is correct?",["I have two book's.","I have two books.","I have two books'.","I have two bookes."],1],["The cat is licking ___ paw.",["it's","its","its'","it"],1],["___ bag is this?",["Who","Whose","Who's","Whom"],1],["The door ___ the room is open.",["of","'s","at","in"],0],["'Siti and Aminah's house' means:",["two houses","one house owned by both","Siti's house only","Aminah's house only"],1],["In 'today's news', the 's is used for:",["a person","time","a place","a plural"],1],["These are my ___ shoes. (my two sisters)",["sister's","sisters'","sisters's","sisters"],1],["Where is ___ office? (the manager)",["the manager's","the managers","the manager","the managers's"],0],["In 'Ali's ill', the 's means:",["possessive","is","has","us"],1],["Which is correct?",["The womens' room","The women's room","The womans room","The womens room"],1],["The ___ tail is long. (one dog)",["dogs","dog's","dogs'","dog"],1]]},
{t:["Present Simple: 'have got'","Kala Kini: 'have got' (Mempunyai)"],
en:`<h4>1. Meaning</h4><p><b>have got / has got</b> means <i>possess</i> (mostly British English) and is used for possessions, family, illness and description: <i>I've got a bike. She's got two brothers. He's got a headache. It has got a balcony.</i></p><h4>2. Forms</h4><table><tr><th>Subject</th><th>Positive</th><th>Negative</th><th>Question</th></tr><tr><td>I / You / We / They</td><td>have got ('ve got)</td><td>haven't got</td><td>Have you got…?</td></tr><tr><td>He / She / It</td><td>has got ('s got)</td><td>hasn't got</td><td>Has she got…?</td></tr></table><p>Short answers: <i>Yes, I have. / No, I haven't. / Yes, she has. / No, she hasn't.</i> (Do not repeat <i>got</i>.)</p><h4>3. have vs have got</h4><p>For possession both are correct: <i>I have a car = I've got a car.</i> With <b>do/does</b> use <i>have</i> (<i>Do you have a pen?</i>). For <b>actions</b> only <b>have</b> is possible: <i>have breakfast, have a shower, have a good time.</i> (✘ I've got breakfast every day.)</p><h4>4. Common mistakes</h4><p>✘ He have got → ✔ He has got. ✘ Do you have got a pen? → ✔ Have you got a pen? / Do you have a pen? ✘ She doesn't got → ✔ She hasn't got. ✘ I has got → ✔ I have got.</p>`,
bm:`<h4>1. Maksud</h4><p><b>have got / has got</b> bermaksud <i>mempunyai</i> (kebanyakannya dalam Inggeris British) dan digunakan untuk milikan, keluarga, penyakit dan penerangan: <i>I've got a bike (Saya ada basikal). She's got two brothers (Dia ada dua orang abang/adik lelaki). He's got a headache (Dia sakit kepala). It has got a balcony (Ia ada balkoni).</i></p><h4>2. Bentuk</h4><p><b>I / You / We / They:</b> have got ('ve got); negatif haven't got; soalan Have you got…? <b>He / She / It:</b> has got ('s got); negatif hasn't got; soalan Has she got…? Jawapan pendek: <i>Yes, I have. / No, I haven't. / Yes, she has. / No, she hasn't.</i> (Jangan ulang <i>got</i>.)</p><h4>3. have berbanding have got</h4><p>Untuk milikan kedua-duanya betul: <i>I have a car = I've got a car.</i> Dengan <b>do/does</b> guna <i>have</i> (<i>Do you have a pen?</i>). Untuk <b>perbuatan</b> hanya <b>have</b> boleh digunakan: <i>have breakfast (bersarapan), have a shower (mandi), have a good time (berseronok).</i> (✘ I've got breakfast every day.)</p><h4>4. Kesilapan lazim</h4><p>✘ He have got → ✔ He has got. ✘ Do you have got a pen? → ✔ Have you got a pen? / Do you have a pen? ✘ She doesn't got → ✔ She hasn't got. ✘ I has got → ✔ I have got.</p>`,
q:[["I ___ got a bike.",["has","have","am","do"],1],["She ___ got two brothers.",["have","has","is","does"],1],["They ___ not got a car.",["has","have","do","are"],1],["___ you got a pen?",["Do","Have","Has","Are"],1],["___ he got a sister?",["Have","Has","Does","Is"],1],["'Have you got time?' No, ___.",["I haven't","I hasn't","I don't got","I not"],0],["Which is correct?",["He have got a cat.","He has got a cat.","He has a got cat.","He got has a cat."],1],["Which is correct?",["Do you have got a pen?","Have you got a pen?","Has you got a pen?","You has got a pen?"],1],["In 'She's got a new phone', the 's means:",["is","has","us","was"],1],["We ___ lunch at noon every day. (action)",["have","have got","has got","are got"],0],["The flat ___ got a balcony.",["have","has","is","do"],1],["We ___ got any eggs. (negative)",["hasn't","haven't","don't","aren't"],1],["'Has she got a car?' Yes, ___.",["she has","she have","she is","she does"],0],["I ___ got a headache.",["has","have","am","do"],1],["Which is correct?",["She haven't got a key.","She hasn't got a key.","She doesn't got a key.","She not has got a key."],1]]},
{t:["Infinitive of Purpose","Infinitif Tujuan (to + verb)"],
en:`<h4>1. Meaning</h4><p>We use <b>to + base verb</b> to explain the <u>purpose</u> (the reason) of an action. It answers the question <i>Why?</i>: <i>Why did you go to the market? — To buy fish.</i></p><h4>2. Form</h4><p><b>action + to + base verb</b>: <i>I went to the market <b>to buy</b> fish. She called me <b>to say</b> thank you. He studies hard <b>to pass</b> the exam.</i></p><h4>3. for + noun, but not for + verb</h4><table><tr><th>✘ Wrong</th><th>✔ Correct</th></tr><tr><td>I went to the shop for buy bread.</td><td>I went to the shop <b>to buy</b> bread.</td></tr><tr><td>I went to the shop for buying bread.</td><td>I went to the shop <b>for</b> bread. (for + noun)</td></tr><tr><td>I came here for to learn English.</td><td>I came here <b>to learn</b> English.</td></tr></table><h4>4. for + verb-ing: the use of a thing</h4><p>To describe what something is used for: <i>A knife is for cutting. A phone is for calling.</i></p><h4>5. Formal forms and negatives</h4><p><b>in order to</b> and <b>so as to</b> mean the same as <i>to</i> but are more formal: <i>He saved money in order to buy a house.</i> For a negative purpose use <b>in order not to / so as not to</b> (✘ to not): <i>He whispered in order not to wake the baby.</i></p>`,
bm:`<h4>1. Maksud</h4><p>Kita guna <b>to + kata kerja asas</b> untuk menerangkan <u>tujuan</u> sesuatu perbuatan. Ia menjawab soalan <i>Why?</i> (Mengapa?): <i>Why did you go to the market? — To buy fish</i> (Untuk membeli ikan).</p><h4>2. Bentuk</h4><p><b>perbuatan + to + kata kerja asas</b>: <i>I went to the market <b>to buy</b> fish (Saya pergi ke pasar untuk membeli ikan). She called me <b>to say</b> thank you (Dia menelefon saya untuk mengucapkan terima kasih). He studies hard <b>to pass</b> the exam (Dia belajar bersungguh-sungguh untuk lulus peperiksaan).</i></p><h4>3. for + kata nama, bukan for + kata kerja</h4><p>Dalam Bahasa Melayu "untuk" digunakan di mana-mana, tetapi dalam Bahasa Inggeris: ✘ I went to the shop for buy bread → ✔ I went to the shop <b>to buy</b> bread. ✘ for buying bread → ✔ <b>for</b> bread (for + kata nama). ✘ I came here for to learn English → ✔ I came here <b>to learn</b> English.</p><h4>4. for + kata kerja-ing: kegunaan sesuatu benda</h4><p>Untuk menerangkan fungsi sesuatu benda: <i>A knife is for cutting (Pisau untuk memotong). A phone is for calling.</i></p><h4>5. Bentuk formal dan negatif</h4><p><b>in order to</b> dan <b>so as to</b> bermaksud sama seperti <i>to</i> tetapi lebih formal: <i>He saved money in order to buy a house.</i> Untuk tujuan negatif guna <b>in order not to / so as not to</b> (✘ to not): <i>He whispered in order not to wake the baby</i> (Dia berbisik supaya tidak mengejutkan bayi).</p>`,
q:[["I went to the market ___ fish.",["buy","to buy","for buy","for buying"],1],["She called me ___ say thank you.",["for","to","at","in"],1],["Which is correct?",["He went to the bank for get money.","He went to the bank to get money.","He went to the bank for getting money.","He went to the bank for to get money."],1],["A knife is ___ cutting.",["to","for","in","at"],1],["We use a dictionary ___ words.",["to find","for find","find","for to find"],0],["I'm saving money ___ a new phone.",["to buy","for buy","for buying","to buying"],0],["The formal equivalent of 'to' (purpose) is:",["in order to","in order for","for to","so that to"],0],["He went to the shop ___ bread.",["for","to","at","in"],0],["She studies hard ___ pass the exam.",["for","to","at","by"],1],["Which is correct?",["I came here for to learn English.","I came here to learn English.","I came here for learn English.","I came here to learning English."],1],["He whispered ___ wake the baby.",["to not","in order not to","for not","not for"],1],["They went to Penang ___ a holiday.",["for","to","at","by"],0],["'Why did you call?' '___ ask about homework.'",["For","To","At","So"],1],["A phone is for ___.",["call","calling","to call","called"],1],["I opened the window ___ some fresh air.",["to get","for get","for getting","getting"],0]]},
{t:["Quantifiers: few, a few, little, a bit of","Penkuantiti: few, a few, little, a bit of"],
en:`<h4>1. The four words</h4><table><tr><th>Word</th><th>Used with</th><th>Meaning</th><th>Example</th></tr><tr><td><b>a few</b></td><td>countable plural</td><td>some, a small number (positive)</td><td>I have a few friends here.</td></tr><tr><td><b>few</b></td><td>countable plural</td><td>almost none (negative)</td><td>Few people came.</td></tr><tr><td><b>a little</b></td><td>uncountable</td><td>some, a small amount (positive)</td><td>Add a little sugar.</td></tr><tr><td><b>little</b></td><td>uncountable</td><td>almost none (negative)</td><td>We have little time.</td></tr><tr><td><b>a bit of</b></td><td>uncountable (informal)</td><td>a small amount</td><td>Can I have a bit of milk?</td></tr></table><h4>2. The difference: with or without "a"</h4><p><b>With a</b> = positive, enough: <i>I've got a few eggs, so I can make an omelette.</i> <b>Without a</b> = negative, not enough: <i>I've got few eggs, so I can't make an omelette.</i> Both few and little sound rather formal; in everyday speech people usually say <i>not many / not much</i>.</p><h4>3. Related expressions</h4><p><b>quite a few</b> = a fairly large number. <b>only a few</b> = emphasises a small number. <b>a lot of / lots of</b> = many or much. <b>many</b> (countable) and <b>much</b> (uncountable) are mostly used in questions and negatives.</p><h4>4. Common mistakes</h4><p>✘ a few money → ✔ a little money. ✘ a little friends → ✔ a few friends. ✘ a bit of books → ✔ a bit of rice (uncountable only).</p>`,
bm:`<h4>1. Empat perkataan</h4><p><b>a few</b> = beberapa (kata nama terbilang jamak, maksud positif): <i>I have a few friends here.</i> <b>few</b> = hampir tiada (terbilang jamak, maksud negatif): <i>Few people came.</i> <b>a little</b> = sedikit (tak terbilang, positif): <i>Add a little sugar.</i> <b>little</b> = hampir tiada (tak terbilang, negatif): <i>We have little time.</i> <b>a bit of</b> = sedikit (tak terbilang, tidak formal): <i>Can I have a bit of milk?</i></p><h4>2. Perbezaan: dengan atau tanpa "a"</h4><p><b>Dengan a</b> = positif, mencukupi: <i>I've got a few eggs, so I can make an omelette</i> (Saya ada beberapa biji telur, jadi saya boleh membuat telur dadar). <b>Tanpa a</b> = negatif, tidak mencukupi: <i>I've got few eggs, so I can't make an omelette</i> (Telur saya hampir habis). Few dan little agak formal; dalam perbualan biasa orang selalu guna <i>not many / not much</i>.</p><h4>3. Ungkapan berkaitan</h4><p><b>quite a few</b> = agak banyak. <b>only a few</b> = menekankan bilangan yang sedikit. <b>a lot of / lots of</b> = banyak. <b>many</b> (terbilang) dan <b>much</b> (tak terbilang) biasanya digunakan dalam soalan dan ayat negatif.</p><h4>4. Kesilapan lazim</h4><p>✘ a few money → ✔ a little money. ✘ a little friends → ✔ a few friends. ✘ a bit of books → ✔ a bit of rice (tak terbilang sahaja).</p>`,
q:[["I have ___ friends here; I feel lonely.",["a few","few","a little","little"],1],["There are ___ eggs in the fridge. We can make an omelette.",["few","a few","little","a bit of"],1],["We have ___ time. Hurry up!",["little","a little","a few","few"],0],["Would you like ___ sugar in your tea?",["a few","a little","few","many"],1],["Which is correct?",["I need a few advice.","I need a little advice.","I need a few advices.","I need a little advices."],1],["'a bit of' is used with:",["plural nouns","uncountable nouns","verbs","adjectives"],1],["'Few people came.' The party was:",["nearly empty","very crowded","noisy","full"],0],["He has ___ patience. He gets angry easily.",["a little","little","a few","few"],1],["There are ___ students in the library now. (some)",["a few","a little","little","much"],0],["Can I have ___ milk? (informal, small amount)",["a bit of","a few","few","many"],0],["Which is used with countable nouns?",["few","little","a bit of","much"],0],["___ cars are on the road late at night. (almost none)",["Few","A little","A bit of","Much"],0],["I speak ___ Japanese, so I can order food.",["little","a little","few","a few"],1],["Only ___ tourists visited because of the rain.",["a little","a few","little of","much"],1],["'There's little hope' means:",["some hope","almost no hope","a lot of hope","hopeful"],1]]},
{t:["Verbs Followed by -ing or Infinitive","Kata Kerja + -ing atau Infinitif"],
en:`<h4>1. Why it matters</h4><p>After some verbs we use the <b>-ing form</b> (gerund); after others the <b>infinitive with to</b>. You must learn which group each verb belongs to.</p><h4>2. Verb + -ing</h4><p><b>enjoy, finish, mind, avoid, suggest, keep, practise, miss, consider, imagine, give up, can't stand</b>: <i>I enjoy playing football. Would you mind closing the window? She avoids going there.</i></p><h4>3. Verb + to + infinitive</h4><p><b>want, need, hope, decide, plan, promise, learn, agree, refuse, afford, manage, choose, would like</b>: <i>She wants to be a doctor. He decided to buy a car. They refused to help.</i></p><h4>4. Both, with little change in meaning</h4><p><b>like, love, hate, prefer, start, begin, continue</b>: <i>It began to rain / It began raining. I like swimming / I like to swim.</i></p><h4>5. Other rules</h4><table><tr><th>Rule</th><th>Example</th></tr><tr><td>After a preposition use -ing</td><td>good at swimming, interested in learning, look forward to seeing you</td></tr><tr><td>After modals use the base verb (no to)</td><td>You must do your homework.</td></tr><tr><td>make / let + object + base verb</td><td>My mother made me clean my room.</td></tr></table><h4>6. Common mistakes</h4><p>✘ She avoids to go → ✔ She avoids going. ✘ I want going → ✔ I want to go. ✘ I'm looking forward to see you → ✔ looking forward to seeing you (here <i>to</i> is a preposition).</p>`,
bm:`<h4>1. Kepentingan</h4><p>Selepas sesetengah kata kerja kita guna <b>bentuk -ing</b> (gerund); selepas yang lain pula <b>infinitif dengan to</b>. Anda perlu hafal kumpulan bagi setiap kata kerja.</p><h4>2. Kata kerja + -ing</h4><p><b>enjoy (menikmati), finish (menghabiskan), mind (keberatan), avoid (mengelak), suggest (mencadangkan), keep (terus), practise (berlatih), miss (terlepas/rindu), consider (mempertimbangkan), imagine (membayangkan), give up (berhenti), can't stand (tidak tahan)</b>: <i>I enjoy playing football. Would you mind closing the window? (Adakah anda keberatan menutup tingkap?) She avoids going there.</i></p><h4>3. Kata kerja + to + infinitif</h4><p><b>want (mahu), need (perlu), hope (harap), decide (memutuskan), plan (merancang), promise (berjanji), learn (belajar), agree (bersetuju), refuse (enggan), afford (mampu), manage (berjaya), choose (memilih), would like (ingin)</b>: <i>She wants to be a doctor. He decided to buy a car. They refused to help.</i></p><h4>4. Kedua-duanya, maksud hampir sama</h4><p><b>like, love, hate, prefer, start, begin, continue</b>: <i>It began to rain / It began raining. I like swimming / I like to swim.</i></p><h4>5. Peraturan lain</h4><p>Selepas <b>kata sendi</b> guna -ing: good at swimming, interested in learning, look forward to seeing you. Selepas <b>modal</b> guna kata kerja asas (tanpa to): <i>You must do your homework.</i> <b>make / let + objek + kata kerja asas</b>: <i>My mother made me clean my room</i> (Ibu menyuruh saya mengemas bilik).</p><h4>6. Kesilapan lazim</h4><p>✘ She avoids to go → ✔ She avoids going. ✘ I want going → ✔ I want to go. ✘ I'm looking forward to see you → ✔ looking forward to seeing you (di sini <i>to</i> ialah kata sendi).</p>`,
q:[["I enjoy ___ football.",["play","to play","playing","played"],2],["She wants ___ a doctor.",["be","to be","being","is"],1],["He decided ___ a new car.",["buying","to buy","buy","bought"],1],["They finished ___ the homework.",["do","to do","doing","did"],2],["I hope ___ you again soon.",["seeing","to see","see","saw"],1],["Would you mind ___ the window?",["close","to close","closing","closed"],2],["Which is correct?",["She avoids to go there.","She avoids going there.","She avoids go there.","She avoids went there."],1],["We need ___ early tomorrow.",["leaving","to leave","leave","left"],1],["'It began ___ at noon.' Which is possible?",["raining only","to rain or raining","to rain only","rain"],1],["He is good at ___.",["swim","to swim","swimming","swam"],2],["She refused ___ me.",["helping","to help","help","helped"],1],["You must ___ your homework.",["do","to do","doing","done"],0],["I'm looking forward to ___ you.",["see","to see","seeing","saw"],2],["He promised ___ on time.",["being","to be","be","been"],1],["My mother made me ___ my room.",["clean","to clean","cleaning","cleaned"],0]]},
{t:["Adjectives: Gradable & Non-gradable","Adjektif: Berdarjah & Tidak Berdarjah"],
en:`<h4>1. Gradable adjectives</h4><p>These describe qualities that can be <b>more or less</b>: hot, cold, big, tired, good, happy, difficult. We can use them with modifiers of degree: <b>very, quite, fairly, rather, a bit, extremely, too</b>. <i>It's very cold. She is a bit tired.</i></p><h4>2. Non-gradable adjectives</h4><p>These are <b>extreme</b> or <b>absolute</b> (they already contain the idea of "very"): freezing, enormous, exhausted, terrible, fantastic, perfect, impossible, unique, dead. We use them with <b>absolutely, completely, totally, utterly</b> (and <b>really</b>), but NOT with <i>very</i>: <i>It's absolutely freezing. The film was absolutely fantastic.</i></p><h4>3. Common pairs</h4><table><tr><th>Gradable</th><th>Extreme</th><th>Gradable</th><th>Extreme</th></tr><tr><td>cold</td><td>freezing</td><td>tired</td><td>exhausted</td></tr><tr><td>big</td><td>enormous</td><td>hungry</td><td>starving</td></tr><tr><td>good</td><td>fantastic / excellent</td><td>funny</td><td>hilarious</td></tr><tr><td>bad</td><td>terrible / awful</td><td>scared</td><td>terrified</td></tr><tr><td>tasty</td><td>delicious</td><td>surprised</td><td>astonished</td></tr></table><h4>4. The word "quite"</h4><p><b>quite + gradable</b> = fairly: <i>She's quite good at tennis</i> (good, but not great). <b>quite + non-gradable</b> = completely: <i>The view is quite perfect.</i> <b>really</b> can be used with both types.</p><h4>5. Common mistakes</h4><p>✘ very exhausted / very delicious / very impossible → ✔ absolutely exhausted / absolutely delicious / completely impossible.</p>`,
bm:`<h4>1. Adjektif berdarjah (gradable)</h4><p>Menerangkan sifat yang boleh <b>lebih atau kurang</b>: hot (panas), cold, big, tired (penat), good, happy, difficult. Boleh digunakan dengan penanda darjah: <b>very (sangat), quite, fairly (agak), rather, a bit (sedikit), extremely (amat), too (terlalu)</b>. <i>It's very cold. She is a bit tired.</i></p><h4>2. Adjektif tidak berdarjah (non-gradable)</h4><p>Ini adjektif <b>melampau</b> atau <b>mutlak</b> (sudah mengandungi maksud "sangat"): freezing (sangat sejuk), enormous (amat besar), exhausted (sangat letih), terrible (teruk), fantastic (hebat), perfect (sempurna), impossible (mustahil), unique (unik). Gunakan <b>absolutely, completely, totally, utterly</b> (dan <b>really</b>), tetapi JANGAN guna <i>very</i>: <i>It's absolutely freezing. The film was absolutely fantastic.</i></p><h4>3. Pasangan lazim</h4><p>cold → freezing · tired → exhausted · big → enormous · hungry → starving (sangat lapar) · good → fantastic / excellent · funny → hilarious (sangat kelakar) · bad → terrible / awful · scared → terrified (sangat takut) · tasty → delicious · surprised → astonished.</p><h4>4. Perkataan "quite"</h4><p><b>quite + gradable</b> = agak: <i>She's quite good at tennis</i> (baik, tetapi tidak hebat). <b>quite + non-gradable</b> = sepenuhnya: <i>The view is quite perfect.</i> <b>really</b> boleh digunakan dengan kedua-dua jenis.</p><h4>5. Kesilapan lazim</h4><p>✘ very exhausted / very delicious / very impossible → ✔ absolutely exhausted / absolutely delicious / completely impossible.</p>`,
q:[["It's ___ cold today.",["absolutely","very","completely","totally"],1],["The film was ___ fantastic.",["very","rather","absolutely","fairly"],2],["Which is gradable?",["perfect","tired","impossible","unique"],1],["Which is non-gradable?",["big","happy","exhausted","hot"],2],["The extreme form of 'tired' is:",["sleepy","exhausted","lazy","weak"],1],["The extreme form of 'hungry' is:",["starving","full","thirsty","ready"],0],["Which is correct?",["The soup is very delicious.","The soup is absolutely delicious.","The soup is a bit delicious.","The soup is fairly delicious."],1],["'Enormous' means:",["a little big","extremely big","not big","quite small"],1],["Which modifier goes with 'good'?",["absolutely","completely","very","totally"],2],["She was ___ terrified.",["very","absolutely","a bit","fairly"],1],["It's ___ impossible to finish today.",["very","rather","completely","a bit"],2],["The extreme form of 'funny' is:",["hilarious","silly","happy","friendly"],0],["'She's quite good at tennis' means she is:",["completely good","fairly good","terrible","perfect"],1],["In 'The view is quite perfect', 'quite' means:",["fairly","completely","a bit","not"],1],["Which pair is correct (gradable → extreme)?",["big → enormous","cold → hot","happy → sad","good → bad"],0]]},
{t:["Capital Letters & Apostrophes","Huruf Besar & Apostrof"],
en:`<h4>1. Use capital letters for</h4><table><tr><th>Use</th><th>Example</th></tr><tr><td>First word of a sentence; the pronoun <b>I</b></td><td>We went home. I am tired.</td></tr><tr><td>Names of people and places</td><td>Aminah, Johor Bahru, Malaysia</td></tr><tr><td>Days, months, holidays</td><td>Monday, March, Hari Raya, Christmas</td></tr><tr><td>Nationalities and languages</td><td>Malaysian, Malay, English, Chinese</td></tr><tr><td>Titles before names</td><td>Dr Aminah, Mr Lim, Prof Tan</td></tr><tr><td>Organisations, religions, main words in titles</td><td>Islam, Petronas, The Lion King</td></tr></table><p>Do <b>not</b> use capitals for seasons (summer), general directions (go north) or school subjects (maths, science) – but languages always have capitals.</p><h4>2. Apostrophes for contractions</h4><p>The apostrophe replaces missing letters: <i>don't (do not), it's (it is / it has), I'm, they're, she's.</i></p><h4>3. Apostrophes for possession</h4><p>See <i>Possessive 's</i>: <i>Ali's bag, the girls' books, children's toys.</i></p><h4>4. Do not use apostrophes for plurals</h4><p>✘ three CD's → ✔ three CDs. ✘ in the 1990's → ✔ in the 1990s.</p><h4>5. Confusing pairs</h4><table><tr><th>Pair</th><th>Meaning</th></tr><tr><td>its / it's</td><td>belonging to it / it is</td></tr><tr><td>your / you're</td><td>belonging to you / you are</td></tr><tr><td>their / there / they're</td><td>belonging to them / place / they are</td></tr><tr><td>whose / who's</td><td>belonging to whom / who is</td></tr></table>`,
bm:`<h4>1. Gunakan huruf besar untuk</h4><p><b>Perkataan pertama ayat dan kata ganti <i>I</i></b> (We went home. I am tired). <b>Nama orang dan tempat</b> (Aminah, Johor Bahru, Malaysia). <b>Hari, bulan, hari perayaan</b> (Monday, March, Hari Raya, Christmas). <b>Kewarganegaraan dan bahasa</b> (Malaysian, Malay, English, Chinese). <b>Gelaran sebelum nama</b> (Dr Aminah, Mr Lim, Prof Tan). <b>Organisasi, agama dan perkataan utama dalam tajuk</b> (Islam, Petronas, The Lion King).</p><p><b>Jangan</b> guna huruf besar untuk musim (summer), arah umum (go north) atau mata pelajaran (maths, science) – tetapi nama bahasa sentiasa huruf besar.</p><h4>2. Apostrof untuk singkatan</h4><p>Apostrof menggantikan huruf yang tidak ditulis: <i>don't (do not), it's (it is / it has), I'm, they're, she's.</i></p><h4>3. Apostrof untuk kepunyaan</h4><p>Rujuk topik <i>Possessive 's</i>: <i>Ali's bag (beg Ali), the girls' books (buku budak-budak perempuan), children's toys.</i></p><h4>4. Jangan guna apostrof untuk jamak</h4><p>✘ three CD's → ✔ three CDs. ✘ in the 1990's → ✔ in the 1990s.</p><h4>5. Pasangan yang mengelirukan</h4><p><b>its</b> (kepunyaan benda itu) / <b>it's</b> (it is). <b>your</b> (kepunyaan anda) / <b>you're</b> (you are). <b>their</b> (kepunyaan mereka) / <b>there</b> (di sana) / <b>they're</b> (they are). <b>whose</b> (kepunyaan siapa) / <b>who's</b> (who is).</p>`,
q:[["Which word needs a capital letter?",["monday","table","window","happy"],0],["Which is correct?",["we speak english in class.","We speak English in class.","we speak English in class.","We speak english in class."],1],["Which is correct?",["i like rice.","I like rice.","i Like rice.","I Like rice."],1],["Which is correct?",["She lives in johor bahru.","She lives in Johor Bahru.","she lives in johor bahru.","She lives in johor Bahru."],1],["Which is NOT capitalised?",["Hari Raya","Christmas","summer","Friday"],2],["The apostrophe in 'don't' shows:",["possession","contraction","plural","question"],1],["Which is correct?",["The dog wagged it's tail.","The dog wagged its tail.","The dog wagged its' tail.","The dog wagged it tail."],1],["___ going to be late. (they are)",["Their","They're","There","Theyre"],1],["Is this ___ pen? (belongs to you)",["you're","your","yore","youre"],1],["Which is the correct plural?",["three CD's","three CDs","three CDs'","three CD,s"],1],["In 'It's raining', the 's means:",["is","has","possession","plural"],0],["Which is correct?",["She is a Malaysian teacher.","She is a malaysian teacher.","she is a Malaysian teacher.","She is a malaysian Teacher."],0],["The ___ books. (belonging to several girls)",["girl's","girls'","girls's","girls"],1],["'Dr Aminah' has a capital letter because:",["it is a title before a name","it ends a sentence","it is a verb","it is long"],0],["Which is correct?",["Who's bag is this?","Whose bag is this?","Whos bag is this?","Who'se bag is this?"],1]]},
{t:["Conditionals: Zero, First & Second","Ayat Bersyarat: Zero, Pertama & Kedua"],
en:`<h4>1. Overview</h4><table><tr><th>Type</th><th>Structure</th><th>Use</th><th>Example</th></tr><tr><td>Zero</td><td>if + present simple, present simple</td><td>facts, things always true</td><td>If you heat ice, it melts.</td></tr><tr><td>First</td><td>if + present simple, <b>will</b> + base verb</td><td>real, likely future situations</td><td>If it rains, we will stay at home.</td></tr><tr><td>Second</td><td>if + past simple, <b>would</b> + base verb</td><td>unreal or unlikely present/future</td><td>If I won the lottery, I would travel.</td></tr></table><h4>2. Zero conditional</h4><p>Also for rules and habits. <i>if</i> can be replaced by <i>when</i>: <i>If you mix blue and yellow, you get green.</i></p><h4>3. First conditional</h4><p>Never use <i>will</i> in the <i>if</i> clause (✘ If it will rain). Other modals are possible in the result: <i>If you study, you may / can / should pass.</i> <b>unless</b> = <i>if … not</i>: <i>Unless you hurry, you'll be late.</i></p><h4>4. Second conditional</h4><p>The past simple here does not mean past time; it shows the situation is imaginary. Use <b>were</b> for all persons in formal or advice sentences: <i>If I were you, I would apologise.</i> Never use <i>would</i> in the <i>if</i> clause (✘ If I would have time).</p><h4>5. Punctuation and order</h4><p>If the <i>if</i> clause comes first, use a comma: <i>If I have time, I'll help.</i> With no comma when it comes second: <i>I'll help if I have time.</i></p>`,
bm:`<h4>1. Gambaran keseluruhan</h4><p><b>Zero:</b> if + kala kini mudah, kala kini mudah. Untuk fakta dan perkara yang sentiasa benar: <i>If you heat ice, it melts</i> (Jika ais dipanaskan, ia cair). <b>Pertama:</b> if + kala kini mudah, <b>will</b> + kata kerja asas. Untuk keadaan masa depan yang benar-benar mungkin: <i>If it rains, we will stay at home</i> (Jika hujan, kami akan tinggal di rumah). <b>Kedua:</b> if + kala lampau mudah, <b>would</b> + kata kerja asas. Untuk keadaan yang tidak benar atau kecil kemungkinan: <i>If I won the lottery, I would travel</i> (Jika saya menang loteri, saya akan melancong).</p><h4>2. Zero conditional</h4><p>Juga untuk peraturan dan tabiat. <i>if</i> boleh digantikan dengan <i>when</i>: <i>If you mix blue and yellow, you get green.</i></p><h4>3. First conditional</h4><p>Jangan guna <i>will</i> dalam klausa <i>if</i> (✘ If it will rain). Modal lain boleh digunakan dalam klausa keputusan: <i>If you study, you may / can / should pass.</i> <b>unless</b> = <i>if … not</i> (kecuali/jika tidak): <i>Unless you hurry, you'll be late</i> (Jika anda tidak bergegas, anda akan lewat).</p><h4>4. Second conditional</h4><p>Kala lampau mudah di sini bukan bermaksud masa lampau, tetapi menunjukkan keadaan itu khayalan. Gunakan <b>were</b> untuk semua subjek dalam ayat formal atau nasihat: <i>If I were you, I would apologise</i> (Jika saya menjadi anda, saya akan memohon maaf). Jangan guna <i>would</i> dalam klausa <i>if</i> (✘ If I would have time).</p><h4>5. Tanda baca dan susunan</h4><p>Jika klausa <i>if</i> di depan, gunakan koma: <i>If I have time, I'll help.</i> Tanpa koma apabila di belakang: <i>I'll help if I have time.</i></p>`,
q:[["If you heat ice, it ___.",["melt","melts","will melted","melting"],1],["If it rains tomorrow, we ___ at home.",["stay","will stay","would stay","stayed"],1],["If I ___ rich, I would buy a house.",["am","be","were","will be"],2],["If she ___ hard, she will pass.",["studies","studied","will study","would study"],0],["If I ___ you, I would apologise.",["am","was","were","be"],2],["Which is correct?",["If it will rain, I take an umbrella.","If it rains, I will take an umbrella.","If it rained, I will take an umbrella.","If it rains, I would take an umbrella."],1],["If I had more time, I ___ learn the piano.",["will","would","can","am"],1],["Which conditional is used for general facts?",["zero","first","second","third"],0],["'If I won the lottery, I would travel' expresses:",["a fact","a likely future","an unlikely situation","past regret"],2],["'Unless you hurry, you'll be late' means:",["If you hurry","If you don't hurry","When you hurry","Because you hurry"],1],["If you mix blue and yellow, you ___ green.",["get","will got","would got","getting"],0],["If he ___ harder, he would pass. (unlikely now)",["works","worked","will work","work"],1],["Which is correct?",["If I would have time, I would help.","If I had time, I would help.","If I have had time, I will help.","If I had time, I will help."],1],["What will you do ___ you miss the bus?",["if","unless","although","because"],0],["If water reaches 100°C, it ___.",["boils","will boiled","would boil","boiling"],0]]},
{t:["Conditionals: Third & Mixed","Ayat Bersyarat: Ketiga & Campuran"],
en:`<h4>1. Third conditional</h4><p><b>if + past perfect, would have + past participle.</b> It talks about an <u>unreal past</u>: something that did not happen, and its imagined result. It often expresses regret or criticism: <i>If I had studied harder, I would have passed the exam.</i> (I didn't study, so I failed.)</p><table><tr><th>If clause</th><th>Result clause</th></tr><tr><td>If she had left earlier,</td><td>she would have caught the train.</td></tr><tr><td>If they hadn't been late,</td><td>they wouldn't have missed the start.</td></tr></table><p>In the result clause you can also use <b>could have / might have</b>: <i>If it hadn't rained, we might have gone out.</i></p><h4>2. Mixed conditionals</h4><p>Mixed conditionals join a past and a present time.</p><table><tr><th>Type</th><th>Structure</th><th>Example</th></tr><tr><td>Past cause → present result</td><td>if + past perfect, would + base verb</td><td>If I had taken the job, I would be rich now.</td></tr><tr><td>Present state → past result</td><td>if + past simple, would have + past participle</td><td>If he weren't so shy, he would have asked her.</td></tr></table><h4>3. Rules</h4><p>Never use <i>would</i> in the <i>if</i> clause (✘ If I would have known). Use a comma when the <i>if</i> clause comes first. Contracted: <i>hadn't, wouldn't have.</i></p><h4>4. Common mistakes</h4><p>✘ If I would have known, I would have told you → ✔ If I <b>had known</b>, I would have told you. ✘ If I had known, I would told you → ✔ would <b>have told</b>.</p>`,
bm:`<h4>1. Third conditional</h4><p><b>if + past perfect, would have + past participle.</b> Menceritakan <u>masa lampau yang tidak benar</u>: sesuatu yang tidak berlaku dan keputusannya yang dibayangkan. Sering menyatakan kekesalan atau kritikan: <i>If I had studied harder, I would have passed the exam</i> (Jika saya belajar lebih gigih, saya sudah lulus peperiksaan). Hakikatnya: saya tidak belajar, jadi saya gagal.</p><p><i>If she had left earlier, she would have caught the train</i> (Jika dia bertolak lebih awal, dia sempat menaiki kereta api). <i>If they hadn't been late, they wouldn't have missed the start.</i> Dalam klausa keputusan boleh juga guna <b>could have / might have</b>: <i>If it hadn't rained, we might have gone out.</i></p><h4>2. Mixed conditionals (campuran)</h4><p>Menggabungkan masa lampau dan masa kini. <b>(a) Sebab lampau → kesan kini:</b> if + past perfect, would + kata kerja asas: <i>If I had taken the job, I would be rich now</i> (Jika dahulu saya ambil kerja itu, sekarang saya kaya). <b>(b) Keadaan kini → kesan lampau:</b> if + past simple, would have + past participle: <i>If he weren't so shy, he would have asked her</i> (Jika dia tidak pemalu, dia sudah bertanya kepadanya).</p><h4>3. Peraturan</h4><p>Jangan guna <i>would</i> dalam klausa <i>if</i> (✘ If I would have known). Guna koma apabila klausa <i>if</i> di depan. Singkatan: <i>hadn't, wouldn't have.</i></p><h4>4. Kesilapan lazim</h4><p>✘ If I would have known, I would have told you → ✔ If I <b>had known</b>, I would have told you. ✘ If I had known, I would told you → ✔ would <b>have told</b>.</p>`,
q:[["If I ___ harder, I would have passed.",["studied","had studied","would study","study"],1],["If she had left earlier, she ___ the train.",["would catch","would have caught","will catch","caught"],1],["If they hadn't been late, they ___ the start.",["would see","would have seen","saw","will see"],1],["The third conditional talks about:",["a real future","an unreal past","facts","a likely present"],1],["Which is correct?",["If I would have known, I would have told you.","If I had known, I would have told you.","If I have known, I would have told you.","If I had known, I would told you."],1],["If I had taken the job, I ___ rich now. (mixed)",["would be","would have been","will be","am"],0],["If he ___ so shy, he would have asked her.",["isn't","weren't","hadn't been","won't be"],1],["'I didn't eat breakfast, so I was hungry.' = If I ___ breakfast, I wouldn't have been hungry.",["ate","had eaten","would eat","have eaten"],1],["A mixed conditional (past cause, present result) uses: if + past perfect +",["would have + pp","would + base verb","will + base verb","past simple"],1],["If we had taken a taxi, we ___ late.",["wouldn't be","wouldn't have been","won't be","aren't"],1],["She failed because she didn't study. = If she ___, she would have passed.",["studied","had studied","studies","would study"],1],["If I had been born in Japan, I ___ Japanese now.",["would speak","would have spoken","will speak","speak"],0],["Which sentence shows regret?",["If I had listened, I would have succeeded.","If I listen, I will succeed.","If you heat ice, it melts.","If I won, I would travel."],0],["If it hadn't rained, we ___ gone out.",["might have","might","will have","would be"],0],["Which is correct?",["If I had seen him, I would have said hello.","If I would see him, I would said hello.","If I had seen him, I would said hello.","If I have seen him, I would have said hello."],0]]},
{t:["Contrasting Ideas: although, despite…","Menunjukkan Percanggahan: although, despite…"],
en:`<h4>1. Overview</h4><table><tr><th>Word</th><th>Followed by</th><th>Example</th></tr><tr><td><b>although / though / even though</b></td><td>subject + verb (clause)</td><td>Although it was raining, we played football.</td></tr><tr><td><b>despite / in spite of</b></td><td>noun, -ing, or <i>the fact that</i> + clause</td><td>Despite the rain, we played football. Despite being tired, he went to work.</td></tr><tr><td><b>however / nevertheless</b></td><td>new sentence; comma after</td><td>It was cold. However, we went swimming.</td></tr><tr><td><b>but / yet</b></td><td>joins two clauses</td><td>She is rich, yet she is not happy.</td></tr><tr><td><b>while / whereas</b></td><td>clause; contrasts two things</td><td>Ali is tall, whereas his brother is short.</td></tr></table><h4>2. Rules</h4><p><b>even though</b> is stronger than <i>although</i>. It is <b>in spite of</b> (not <i>in spite</i>). Never write <i>despite of</i>. <b>However</b> starts a new sentence (or follows a semicolon): <i>I like tea; however, my brother prefers coffee.</i></p><h4>3. One conjunction only</h4><p>Do not use <i>although</i> with <i>but</i> in the same sentence: ✘ Although he was tired, but he continued → ✔ Although he was tired, he continued.</p><h4>4. Common mistakes</h4><p>✘ Despite it rained → ✔ Despite the rain / Despite the fact that it rained / Although it rained. ✘ Although the rain → ✔ Despite the rain.</p>`,
bm:`<h4>1. Gambaran keseluruhan</h4><p><b>although / though / even though</b> (walaupun, sungguhpun) + subjek + kata kerja (klausa): <i>Although it was raining, we played football</i> (Walaupun hujan, kami bermain bola sepak). <b>despite / in spite of</b> (walaupun, biarpun) + kata nama, -ing, atau <i>the fact that</i> + klausa: <i>Despite the rain, we played football. Despite being tired, he went to work.</i> <b>however / nevertheless</b> (namun, walau bagaimanapun) memulakan ayat baharu, diikuti koma: <i>It was cold. However, we went swimming.</i> <b>but / yet</b> (tetapi, namun) menghubungkan dua klausa: <i>She is rich, yet she is not happy.</i> <b>while / whereas</b> (manakala) membezakan dua perkara: <i>Ali is tall, whereas his brother is short.</i></p><h4>2. Peraturan</h4><p><b>even though</b> lebih kuat daripada <i>although</i>. Yang betul ialah <b>in spite of</b> (bukan <i>in spite</i>). Jangan tulis <i>despite of</i>. <b>However</b> memulakan ayat baharu (atau selepas koma bertitik): <i>I like tea; however, my brother prefers coffee.</i></p><h4>3. Hanya satu kata hubung</h4><p>Dalam Bahasa Melayu "walaupun … tetapi" boleh digunakan bersama, tetapi dalam Bahasa Inggeris tidak boleh: ✘ Although he was tired, but he continued → ✔ Although he was tired, he continued.</p><h4>4. Kesilapan lazim</h4><p>✘ Despite it rained → ✔ Despite the rain / Despite the fact that it rained / Although it rained. ✘ Although the rain → ✔ Despite the rain.</p>`,
q:[["___ it was raining, we played football.",["Despite","Although","However","In spite"],1],["___ the rain, we played football.",["Although","Despite","Even though","However"],1],["She passed the exam ___ she didn't study much.",["despite","although","in spite","however"],1],["He went to work ___ being ill.",["although","despite","however","but although"],1],["Which is correct?",["Despite of the rain, we went out.","Despite the rain, we went out.","Despite it rained, we went out.","Although the rain, we went out."],1],["I like tea; ___, my brother prefers coffee.",["although","however","despite","even though"],1],["Ali is tall, ___ his brother is short.",["whereas","despite","unless","because"],0],["Which is correct?",["Although he was tired, but he continued.","Although he was tired, he continued.","Despite he was tired, he continued.","In spite he was tired, he continued."],1],["___ the fact that it was expensive, she bought it.",["Although","Despite","However","While"],1],["___ I studied hard, I failed.",["Even though","In spite of","Despite","Nevertheless"],0],["'Even though' is:",["weaker than although","stronger than although","followed by a noun only","a word meaning because"],1],["It was cold. ___, we went swimming.",["Although","Despite","However","Even though"],2],["In spite ___ the noise, he slept.",["of","at","on","by"],0],["Which is followed by a noun or -ing?",["although","even though","despite","though"],2],["She is rich ___ she is not happy.",["yet","because","so","unless"],0]]},
{t:["Different Uses of 'used to'","Kegunaan 'used to' yang Berbeza"],
en:`<h4>1. used to + base verb: past habits and states</h4><p>Something that was true or happened regularly in the past but <b>not now</b>: <i>I used to play football when I was a child. We used to live in a small village.</i> Negative and questions use <b>use to</b> (because <i>did</i> shows the past): <i>I didn't use to like coffee. Did you use to live in Penang?</i> It cannot describe a single event (✘ I used to go there yesterday).</p><h4>2. be used to + noun / -ing: being accustomed</h4><p>Something is familiar and no longer strange: <i>She is used to getting up early. He isn't used to spicy food.</i> Here <i>to</i> is a preposition, so use <b>-ing</b> or a noun.</p><h4>3. get used to + noun / -ing: becoming accustomed</h4><p>The process of becoming familiar: <i>It took me a year to get used to living here. After a month she got used to the noise.</i></p><table><tr><th>Structure</th><th>Meaning</th><th>Followed by</th></tr><tr><td>used to</td><td>past habit (not now)</td><td>base verb</td></tr><tr><td>be used to</td><td>familiar with</td><td>-ing / noun</td></tr><tr><td>get used to</td><td>become familiar with</td><td>-ing / noun</td></tr></table><h4>4. Common mistakes</h4><p>✘ I'm used to work hard → ✔ I'm used to working hard. ✘ I used to going by bus → ✔ I used to go by bus. ✘ I use to go → ✔ I used to go (positive uses <i>used</i>).</p>`,
bm:`<h4>1. used to + kata kerja asas: tabiat dan keadaan lampau</h4><p>Sesuatu yang benar atau berlaku kerap pada masa lampau tetapi <b>tidak lagi sekarang</b>: <i>I used to play football when I was a child (Dahulu saya bermain bola sepak semasa kecil). We used to live in a small village (Dahulu kami tinggal di kampung kecil).</i> Dalam ayat negatif dan soalan guna <b>use to</b> (kerana <i>did</i> sudah menunjukkan masa lampau): <i>I didn't use to like coffee. Did you use to live in Penang?</i> Ia tidak boleh digunakan untuk satu peristiwa tunggal (✘ I used to go there yesterday).</p><h4>2. be used to + kata nama / -ing: sudah biasa</h4><p>Sesuatu sudah biasa dan tidak lagi asing: <i>She is used to getting up early (Dia sudah biasa bangun awal). He isn't used to spicy food (Dia tidak biasa makan makanan pedas).</i> Di sini <i>to</i> ialah kata sendi, jadi gunakan <b>-ing</b> atau kata nama.</p><h4>3. get used to + kata nama / -ing: menjadi biasa</h4><p>Proses menyesuaikan diri: <i>It took me a year to get used to living here (Saya mengambil masa setahun untuk membiasakan diri tinggal di sini). After a month she got used to the noise.</i></p><p><b>Ringkasan:</b> <i>used to</i> = dahulu (base verb). <i>be used to</i> = sudah biasa (-ing/noun). <i>get used to</i> = menjadi biasa (-ing/noun).</p><h4>4. Kesilapan lazim</h4><p>✘ I'm used to work hard → ✔ I'm used to working hard. ✘ I used to going by bus → ✔ I used to go by bus. ✘ I use to go → ✔ I used to go (ayat positif guna <i>used</i>).</p>`,
q:[["I ___ play football when I was a child.",["use to","used to","am used to","get used to"],1],["She's used ___ early.",["to get","to getting","get","getting"],1],["Did you ___ live in Penang?",["used to","use to","be used to","get used to"],1],["I didn't ___ like coffee, but now I love it.",["used to","use to","am used to","get used to"],1],["It took me a year to ___ living here.",["used to","get used to","use to","be use to"],1],["Which is correct?",["I'm used to work hard.","I'm used to working hard.","I used to working hard.","I'm use to working hard."],1],["'He used to smoke' means:",["he smokes now","he smoked in the past but not now","he is getting accustomed","he will smoke"],1],["She ___ the cold weather now. (she is accustomed)",["used to","is used to","gets used","use to"],1],["'be used to' is followed by:",["base verb","-ing or noun","past participle","to + base verb"],1],["We ___ live in a small village, but we moved to the city.",["used to","are used to","get used to","would be"],0],["It's hard to ___ driving on the left.",["used to","get used to","be use to","use to"],1],["Which is correct?",["I used to going to school by bus.","I used to go to school by bus.","I used to went to school by bus.","I use to going to school by bus."],1],["He isn't ___ spicy food.",["used to","use to","used","get used"],0],["Which CANNOT describe a single past event?",["used to","was","went","bought"],0],["After a month she ___ the noise.",["got used to","used to","was use to","gets use"],0]]},
{t:["Future Continuous & Future Perfect","Kala Depan Berterusan & Sempurna"],
en:`<h4>1. Future continuous: will be + verb-ing</h4><p>An action <u>in progress</u> at a particular time in the future: <i>This time tomorrow I will be flying to Kuala Lumpur. At 9 p.m. tonight they will be playing football.</i> It is also used for events already planned, and for polite questions about someone's plans: <i>Will you be using the car tonight?</i></p><h4>2. Future perfect: will have + past participle</h4><p>An action that will be <u>completed before</u> a certain time in the future: <i>By 2030 she will have finished her degree. By the time you arrive, I will have finished the cooking.</i></p><table><tr><th></th><th>Future continuous</th><th>Future perfect</th></tr><tr><td>Positive</td><td>I will be working</td><td>I will have worked</td></tr><tr><td>Negative</td><td>I won't be working</td><td>I won't have worked</td></tr><tr><td>Question</td><td>Will you be working?</td><td>Will you have worked?</td></tr></table><h4>3. Time expressions</h4><p>Future continuous: <i>this time tomorrow, at 9 p.m., next week.</i> Future perfect: <b>by</b> (by Friday, by 2030), <b>by the time</b>, <b>before</b>. <i>By</i> means "not later than".</p><h4>4. Common mistakes</h4><p>✘ By next year, I will be graduated → ✔ I will have graduated. ✘ I will be knowing the answer → ✔ I will know the answer (stative verbs are not continuous). ✘ I will have finish → ✔ will have finished.</p>`,
