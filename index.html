bm:`<h4>1. Future continuous: will be + kata kerja-ing</h4><p>Perbuatan yang <u>sedang berlaku</u> pada satu masa tertentu di masa depan: <i>This time tomorrow I will be flying to Kuala Lumpur (Pada waktu ini esok saya akan sedang terbang ke Kuala Lumpur). At 9 p.m. tonight they will be playing football.</i> Juga untuk peristiwa yang sudah dirancang, dan soalan sopan tentang rancangan seseorang: <i>Will you be using the car tonight?</i> (Adakah anda akan menggunakan kereta malam ini?)</p><h4>2. Future perfect: will have + past participle</h4><p>Perbuatan yang akan <u>selesai sebelum</u> satu masa tertentu di masa depan: <i>By 2030 she will have finished her degree (Menjelang 2030 dia sudah tamat ijazah). By the time you arrive, I will have finished the cooking (Apabila anda tiba, saya sudah siap memasak).</i></p><p><b>Bentuk:</b> negatif <i>won't be working / won't have worked</i>; soalan <i>Will you be working? / Will you have worked?</i></p><h4>3. Ungkapan masa</h4><p>Future continuous: <i>this time tomorrow, at 9 p.m., next week.</i> Future perfect: <b>by</b> (menjelang, selewat-lewatnya: by Friday, by 2030), <b>by the time</b> (apabila), <b>before</b> (sebelum).</p><h4>4. Kesilapan lazim</h4><p>✘ By next year, I will be graduated → ✔ I will have graduated. ✘ I will be knowing the answer → ✔ I will know the answer (kata kerja keadaan tidak berterusan). ✘ I will have finish → ✔ will have finished.</p>`,
q:[["This time tomorrow, I ___ on a plane.",["will fly","will be flying","will have flown","flew"],1],["By 2030, she ___ her degree.",["will finish","will be finishing","will have finished","finishes"],2],["Don't call at 8. We ___ dinner.",["will eat","will be eating","will have eaten","ate"],1],["By the time you arrive, I ___ the cooking.",["will finish","will be finishing","will have finished","finish"],2],["The future perfect structure is:",["will be + -ing","will have + past participle","will + base verb","be going to + base verb"],1],["The future continuous structure is:",["will be + -ing","will have + past participle","will + past participle","would be + -ing"],0],["'Will you be using the car tonight?' is:",["a polite question about plans","a past habit","a promise","a command"],0],["Which is correct?",["By next year, I will be graduated.","By next year, I will have graduated.","By next year, I will graduating.","By next year, I graduate."],1],["At 9 p.m. tonight, they ___ football.",["will play","will be playing","will have played","played"],1],["She ___ the report by Friday. (completed before Friday)",["will finish","will have finished","will be finishing","finishing"],1],["Which time expression goes with the future perfect?",["by","while","yesterday","ago"],0],["In two years, we ___ here for ten years. (complete period)",["will live","will be living","will have lived","live"],2],["Which is correct?",["I will be knowing the answer.","I will know the answer.","I will be know.","I will knowing."],1],["'This time next week I ___ on the beach.'",["will lie","will be lying","will have lain","lay"],1],["He ___ the money before the trip. (completed)",["will save","will have saved","will be saving","saves"],1]]},
{t:["Future Forms: will, be going to, present continuous","Bentuk Masa Depan: will, be going to, present continuous"],
en:`<h4>1. will + base verb</h4><p>Spontaneous decisions (made at the moment of speaking), offers, promises, and predictions based on opinion: <i>The phone's ringing. I'll answer it. I'll carry that bag for you. I promise I won't tell anyone. I think she will win.</i></p><h4>2. be going to + base verb</h4><p>Plans and intentions already decided before speaking, and predictions based on present evidence: <i>I'm going to study medicine. Look at those clouds! It's going to rain.</i></p><h4>3. Present continuous</h4><p>Fixed arrangements, usually with a time and often with other people (appointments, tickets, meetings): <i>I'm seeing my dentist at 4 p.m. tomorrow. We are meeting them on Saturday.</i></p><h4>4. Present simple for timetables</h4><p>Schedules and fixed events: <i>The train leaves at 9.15 tomorrow. The shop opens at 10.</i></p><table><tr><th>Situation</th><th>Form</th></tr><tr><td>Decision now, offer, promise</td><td>will</td></tr><tr><td>Plan / evidence now</td><td>be going to</td></tr><tr><td>Arrangement</td><td>present continuous</td></tr><tr><td>Timetable</td><td>present simple</td></tr></table><h4>5. Common mistakes</h4><p>✘ He is going buy a phone → ✔ He is going <b>to</b> buy. ✘ I will going to the market → ✔ I'm going to the market. Forms often overlap, so choose by the speaker's attitude: plan, arrangement or decision.</p>`,
bm:`<h4>1. will + kata kerja asas</h4><p>Keputusan spontan (dibuat ketika bercakap), tawaran, janji dan ramalan berdasarkan pendapat: <i>The phone's ringing. I'll answer it (Telefon berdering. Saya jawab). I'll carry that bag for you (Saya tolong bawakan beg itu). I promise I won't tell anyone (Saya janji tidak akan beritahu sesiapa). I think she will win.</i></p><h4>2. be going to + kata kerja asas</h4><p>Rancangan dan niat yang sudah diputuskan sebelum bercakap, serta ramalan berdasarkan bukti sekarang: <i>I'm going to study medicine (Saya akan belajar perubatan). Look at those clouds! It's going to rain (Lihat awan itu! Hujan akan turun).</i></p><h4>3. Present continuous</h4><p>Temu janji atau urusan yang sudah ditetapkan, biasanya dengan masa dan orang lain: <i>I'm seeing my dentist at 4 p.m. tomorrow (Saya akan berjumpa doktor gigi pukul 4 petang esok). We are meeting them on Saturday.</i></p><h4>4. Present simple untuk jadual</h4><p>Jadual dan peristiwa tetap: <i>The train leaves at 9.15 tomorrow (Kereta api bertolak pukul 9.15 esok). The shop opens at 10.</i></p><p><b>Ringkasan:</b> keputusan sekarang / tawaran / janji = <i>will</i>. Rancangan / bukti sekarang = <i>be going to</i>. Temu janji tetap = <i>present continuous</i>. Jadual = <i>present simple</i>.</p><h4>5. Kesilapan lazim</h4><p>✘ He is going buy a phone → ✔ He is going <b>to</b> buy. ✘ I will going to the market → ✔ I'm going to the market. Bentuk-bentuk ini sering bertindih, jadi pilih mengikut sikap penutur: rancangan, temu janji atau keputusan spontan.</p>`,
q:[["The phone's ringing. I ___ answer it.",["am going to","will","am answering","answer"],1],["Look at those clouds! It ___ rain.",["will","is going to","rains","is rained"],1],["I ___ my dentist at 4 p.m. tomorrow. (appointment)",["will see","am seeing","would see","saw"],1],["We've decided: we ___ buy a car next month.",["will","are going to","are","would"],1],["I promise I ___ tell anyone.",["am going to","will","am telling","tell"],1],["'I'll carry that bag for you' is:",["a plan","an offer","a timetable","a past habit"],1],["The train ___ at 9.15 tomorrow. (timetable)",["will leave","is leaving","leaves","is going leave"],2],["Which is correct for an arrangement?",["We meet them on Saturday.","We are meeting them on Saturday.","We will to meet them on Saturday.","We meeting them on Saturday."],1],["She told us she ___ have a baby in June. Choose the best form for a plan/evidence now:",["will","is going to","has","is going"],1],["Which is correct?",["He is going to buy a phone.","He is going buy a phone.","He will going to buy a phone.","He going to buys a phone."],0],["I'm so tired. I think I ___ go to bed early. (decision now)",["am going to","will","am going","go"],1],["'I'm going to study medicine' expresses:",["an intention already decided","a timetable","a spontaneous offer","a past action"],0],["We use the present continuous for the future when:",["the arrangement is fixed","the prediction is general","we offer help","we make a promise"],0],["Which is NOT used to talk about the future?",["will","be going to","present simple (timetable)","past perfect"],3],["'Don't worry, I ___ help you.'",["am going to","will","am helping","help"],1]]},
{t:["Intensifiers: so & such","Penguat: so & such"],
en:`<h4>1. so + adjective / adverb</h4><p><b>so</b> makes an adjective or adverb stronger: <i>She is so tired. He speaks so quickly. The test was so easy.</i></p><h4>2. such + (a/an) + (adjective) + noun</h4><p><b>such</b> is used before a noun (with or without an adjective): <i>It was such a nice day. They are such good friends. It's such beautiful weather. They live in such big houses.</i> Use <b>such a/an</b> with singular countable nouns; no article with plurals and uncountables.</p><table><tr><th>so</th><th>such</th></tr><tr><td>so + adjective: so nice</td><td>such + a + adjective + noun: such a nice day</td></tr><tr><td>so + adverb: so quickly</td><td>such + adjective + plural / uncountable: such good friends, such beautiful weather</td></tr><tr><td>so much / so many + noun: so much fun, so many people</td><td></td></tr></table><h4>3. Result clauses: so … that / such … that</h4><p><i>It was so cold that we stayed home. It was such an interesting book that I read it twice.</i> The word <i>that</i> can be left out in informal speech.</p><h4>4. Common mistakes</h4><p>✘ It's so a beautiful house → ✔ It's <b>such a</b> beautiful house. ✘ such tired → ✔ so tired. ✘ such beautiful house → ✔ such <b>a</b> beautiful house. ✘ so boring film → ✔ such a boring film / so boring a film (rare) / the film was so boring.</p>`,
bm:`<h4>1. so + adjektif / kata keterangan</h4><p><b>so</b> (sangat, begitu) menguatkan adjektif atau kata keterangan: <i>She is so tired (Dia sangat penat). He speaks so quickly (Dia bercakap begitu pantas). The test was so easy.</i></p><h4>2. such + (a/an) + (adjektif) + kata nama</h4><p><b>such</b> (begitu) digunakan sebelum kata nama (dengan atau tanpa adjektif): <i>It was such a nice day (Hari itu begitu indah). They are such good friends. It's such beautiful weather. They live in such big houses.</i> Guna <b>such a/an</b> dengan kata nama tunggal terbilang; tiada kata sandang dengan jamak dan tak terbilang.</p><p><b>Ringkasan:</b> <i>so</i> + adjektif atau kata keterangan (so nice, so quickly). <i>such</i> + kata nama (such a nice day, such good friends). <i>so much / so many</i> + kata nama (so much fun, so many people).</p><h4>3. Klausa keputusan: so … that / such … that</h4><p><i>It was so cold that we stayed home (Cuaca begitu sejuk sehingga kami tinggal di rumah). It was such an interesting book that I read it twice.</i> Perkataan <i>that</i> boleh ditinggalkan dalam pertuturan tidak formal.</p><h4>4. Kesilapan lazim</h4><p>✘ It's so a beautiful house → ✔ It's <b>such a</b> beautiful house. ✘ such tired → ✔ so tired. ✘ such beautiful house → ✔ such <b>a</b> beautiful house. ✘ The film was such boring → ✔ The film was so boring.</p>`,
q:[["She is ___ tired.",["so","such","such a","very a"],0],["It was ___ nice day.",["so","such","such a","so a"],2],["They are ___ good friends.",["so","such","such a","so a"],1],["He speaks ___ quickly.",["such","so","such a","much"],1],["It was ___ cold that we stayed home.",["such","so","such a","very"],1],["It was ___ cold weather that we stayed home.",["so","such","such a","very"],1],["Which is correct?",["It's so a beautiful house.","It's such a beautiful house.","It's such beautiful house.","It's so beautiful house."],1],["We had ___ much fun.",["such","so","such a","very"],1],["It was ___ interesting book that I read it twice.",["so","such","such an","so an"],2],["The test was ___ easy.",["so","such","such a","such an"],0],["They live in ___ big houses.",["so","such","such a","so a"],1],["Which is correct?",["The film was so boring that we left.","The film was such boring that we left.","The film was so a boring that we left.","The film was such boring film that we left."],0],["'so … that' shows:",["a result","a contrast","a purpose","a time"],0],["She was ___ surprised that she couldn't speak.",["such","so","such a","very that"],1],["It was ___ terrible food that nobody ate it.",["so","such","such a","much"],1]]},
{t:["Modals: Deductions about the Present","Modal: Kesimpulan tentang Masa Kini"],
en:`<h4>1. Meaning</h4><p>We use modals to say how <b>sure</b> we are about something in the present, based on evidence. The structure is <b>modal + base verb</b> (<i>be</i> for states, <i>be + -ing</i> for actions in progress).</p><table><tr><th>Modal</th><th>Certainty</th><th>Example</th></tr><tr><td><b>must</b></td><td>almost sure it is true (about 90–95%)</td><td>His car is outside. He must be at home. He works 12 hours a day, so he must be exhausted.</td></tr><tr><td><b>could / may / might</b></td><td>possible (about 50%)</td><td>The lights are on. They may be at home. I'm not sure, but it might rain.</td></tr><tr><td><b>can't</b></td><td>almost sure it is NOT true</td><td>She just ate a big lunch. She can't be hungry. That can't be Ali. He's in Penang.</td></tr></table><h4>2. Important rule</h4><p>For a negative deduction use <b>can't</b>, not <i>mustn't</i>. <i>Mustn't</i> means "prohibited" (✘ He mustn't be at home → ✔ He can't be at home).</p><h4>3. With continuous</h4><p><i>He must be working now. Someone must be playing the piano; I can hear it.</i></p><h4>4. Common mistakes</h4><p>✘ He must working → ✔ He must be working. ✘ He must to be tired → ✔ He must be tired. ✘ She mustn't be at school, it's Sunday → ✔ She can't be at school.</p>`,
bm:`<h4>1. Maksud</h4><p>Kita guna modal untuk menyatakan sejauh mana kita <b>pasti</b> tentang sesuatu pada masa kini berdasarkan bukti. Struktur: <b>modal + kata kerja asas</b> (<i>be</i> untuk keadaan, <i>be + -ing</i> untuk perbuatan yang sedang berlaku).</p><p><b>must</b> = hampir pasti benar (kira-kira 90–95%): <i>His car is outside. He must be at home</i> (Keretanya ada di luar. Dia pasti berada di rumah). <i>He works 12 hours a day, so he must be exhausted.</i></p><p><b>could / may / might</b> = mungkin (kira-kira 50%): <i>The lights are on. They may be at home (Mungkin mereka di rumah). I'm not sure, but it might rain.</i></p><p><b>can't</b> = hampir pasti TIDAK benar: <i>She just ate a big lunch. She can't be hungry (Dia mustahil lapar). That can't be Ali. He's in Penang.</i></p><h4>2. Peraturan penting</h4><p>Untuk kesimpulan negatif guna <b>can't</b>, bukan <i>mustn't</i>. <i>Mustn't</i> bermaksud "dilarang" (✘ He mustn't be at home → ✔ He can't be at home).</p><h4>3. Dengan bentuk berterusan</h4><p><i>He must be working now (Dia pasti sedang bekerja). Someone must be playing the piano; I can hear it.</i></p><h4>4. Kesilapan lazim</h4><p>✘ He must working → ✔ He must be working. ✘ He must to be tired → ✔ He must be tired. ✘ She mustn't be at school, it's Sunday → ✔ She can't be at school.</p>`,
q:[["His car is outside, so he ___ be at home.",["must","can't","might not","shouldn't"],0],["She has just had a big lunch, so she ___ be hungry.",["must","can't","could","will"],1],["I'm not sure, but it ___ rain later.",["must","can't","might","shall"],2],["Which is correct for a negative deduction?",["He mustn't be at home.","He can't be at home.","He don't be at home.","He not must be home."],1],["'She must be tired' means:",["I'm almost sure she is tired","I'm sure she isn't tired","She has permission to be tired","Maybe she's tired"],0],["The lights are on. They ___ be at home. (possible)",["must","may","can't","mustn't"],1],["He works 12 hours a day. He ___ be exhausted.",["must","can't","mightn't","won't"],0],["That ___ be Ali. He's in Penang this week.",["must","can't","may","should"],1],["I can hear music. Someone ___ be playing the piano.",["must","can't","shouldn't","won't"],0],["Which shows the lowest certainty?",["must","can't","might","will"],2],["Which is correct?",["He must be working now.","He must working now.","He must is working now.","He must to be working now."],0],["'It can't be true' means:",["I'm sure it's false","It's probably true","Maybe it's true","It is not allowed"],0],["She ___ be at school; it's Sunday.",["must","can't","might","shall"],1],["I'm not certain where he is. He ___ be in the library.",["must","can't","could","mustn't"],2],["They've got five cars. They ___ be rich.",["can't","must","mustn't","won't"],1]]},
{t:["Modals: Deductions about the Past","Modal: Kesimpulan tentang Masa Lampau"],
en:`<h4>1. Structure</h4><p><b>modal + have + past participle</b> shows how sure we are about something that <u>already happened</u>, based on evidence.</p><table><tr><th>Modal</th><th>Meaning</th><th>Example</th></tr><tr><td><b>must have + pp</b></td><td>almost sure it happened</td><td>The street is wet. It must have rained. He must have missed the train.</td></tr><tr><td><b>can't / couldn't have + pp</b></td><td>almost sure it did NOT happen</td><td>He can't have seen my message; he would have replied. You can't have seen Ali. He was abroad.</td></tr><tr><td><b>could / may / might have + pp</b></td><td>possible</td><td>She isn't here. She might have forgotten. They may have got lost.</td></tr></table><h4>2. Rules</h4><p>After <i>have</i> always use the <b>past participle</b> (seen, gone, taken). Do not write <i>must had</i> or <i>can't had</i>. For a negative deduction use <b>can't have</b>, not <i>mustn't have</i>.</p><h4>3. Comparing with the present</h4><p>Present: <i>He must be at home</i> (now). Past: <i>He must have left</i> (earlier).</p><h4>4. Common mistakes</h4><p>✘ He must had left → ✔ He must <b>have</b> left. ✘ She can't knew → ✔ She can't <b>have known</b>. ✘ They mustn't have left → ✔ They can't have left.</p>`,
bm:`<h4>1. Struktur</h4><p><b>modal + have + past participle</b> menunjukkan sejauh mana kita pasti tentang sesuatu yang <u>sudah berlaku</u>, berdasarkan bukti.</p><p><b>must have + pp</b> = hampir pasti sudah berlaku: <i>The street is wet. It must have rained (Jalan basah. Tentu hujan telah turun). He must have missed the train.</i></p><p><b>can't / couldn't have + pp</b> = hampir pasti TIDAK berlaku: <i>He can't have seen my message; he would have replied (Dia mustahil sudah melihat mesej saya). You can't have seen Ali. He was abroad.</i></p><p><b>could / may / might have + pp</b> = mungkin: <i>She isn't here. She might have forgotten (Mungkin dia terlupa). They may have got lost.</i></p><h4>2. Peraturan</h4><p>Selepas <i>have</i> sentiasa guna <b>past participle</b> (seen, gone, taken). Jangan tulis <i>must had</i> atau <i>can't had</i>. Untuk kesimpulan negatif guna <b>can't have</b>, bukan <i>mustn't have</i>.</p><h4>3. Bandingkan dengan masa kini</h4><p>Kini: <i>He must be at home</i> (sekarang). Lampau: <i>He must have left</i> (tadi).</p><h4>4. Kesilapan lazim</h4><p>✘ He must had left → ✔ He must <b>have</b> left. ✘ She can't knew → ✔ She can't <b>have known</b>. ✘ They mustn't have left → ✔ They can't have left.</p>`,
q:[["The street is wet. It ___ rained.",["must have","can't have","might","must has"],0],["He ___ seen my message; he would have replied.",["must have","can't have","might","will have"],1],["She isn't here. She ___ forgotten. (possible)",["might have","can't have","must","shall have"],0],["The structure for a past deduction is:",["modal + have + past participle","modal + had + base verb","modal + be + -ing only","modal + to + verb"],0],["Which is correct?",["He must had left.","He must have left.","He must has left.","He musts have left."],1],["They ___ left early; their bags are gone.",["must have","can't have","mustn't have","will have"],0],["I'm not sure, but she ___ taken the wrong bus.",["could have","can't have","mustn't have","must has"],0],["You ___ seen Ali. He was abroad.",["must have","can't have","might","shall have"],1],["'He must have missed the train' means:",["I'm almost sure he missed it","I'm sure he didn't","maybe","it is forbidden"],0],["Which is correct?",["She can't have known.","She can't had known.","She can't knew.","She not can have known."],0],["The window's broken. Someone ___ thrown a ball.",["must have","can't have","mustn't have","has"],0],["'They may have got lost' expresses:",["possibility","certainty","obligation","permission"],0],["The cake has disappeared! The children ___ eaten it.",["must have","can't have","could","mustn't"],0],["She ___ been at home. The lights were off and her car was gone.",["must have","can't have","should","will have"],1],["Which means 'It's impossible that he lied'?",["He can't have lied.","He must have lied.","He might have lied.","He should lie."],0]]},
{t:["Modals: Permission & Obligation","Modal: Kebenaran & Kewajipan"],
en:`<h4>1. Permission</h4><p><b>can / could / may</b> ask for or give permission: <i>May I use your phone? Can I sit here?</i> (<i>may</i> is more formal). <b>be allowed to</b> is also used: <i>Are we allowed to use dictionaries? Children aren't allowed to enter without an adult.</i></p><h4>2. Obligation</h4><table><tr><th>Form</th><th>Meaning</th><th>Example</th></tr><tr><td><b>must</b></td><td>strong obligation, often from the speaker's own feeling</td><td>I must finish this today.</td></tr><tr><td><b>have to</b></td><td>obligation from rules or outside authority</td><td>You have to wear a seat belt. It's the law. I have to wear a uniform.</td></tr><tr><td><b>mustn't</b></td><td>prohibition (not allowed)</td><td>You mustn't smoke in the hospital.</td></tr><tr><td><b>don't have to / needn't</b></td><td>not necessary</td><td>You don't have to bring food. We have plenty.</td></tr><tr><td><b>should / ought to</b></td><td>advice</td><td>You should see a doctor.</td></tr></table><h4>3. Past forms</h4><p><b>must</b> has no past form. Use <b>had to</b> for past obligation (<i>Yesterday I had to work late</i>), and <b>was / were allowed to</b> or <b>could</b> for past permission (<i>When I was young, I was allowed to stay up late</i>).</p><h4>4. Important difference</h4><p><b>mustn't</b> = forbidden. <b>don't have to</b> = not necessary. Modals are followed by the base verb (✘ I must to go → ✔ I must go).</p>`,
bm:`<h4>1. Kebenaran</h4><p><b>can / could / may</b> digunakan untuk meminta atau memberi kebenaran: <i>May I use your phone? (Bolehkah saya menggunakan telefon anda?) Can I sit here?</i> (<i>may</i> lebih formal). <b>be allowed to</b> (dibenarkan) juga digunakan: <i>Are we allowed to use dictionaries? Children aren't allowed to enter without an adult.</i></p><h4>2. Kewajipan</h4><p><b>must</b> = kewajipan kuat, sering dari perasaan penutur sendiri: <i>I must finish this today</i> (Saya mesti siapkan ini hari ini). <b>have to</b> = kewajipan daripada peraturan atau pihak berkuasa: <i>You have to wear a seat belt. It's the law. I have to wear a uniform.</i> <b>mustn't</b> = dilarang: <i>You mustn't smoke in the hospital.</i> <b>don't have to / needn't</b> = tidak perlu: <i>You don't have to bring food. We have plenty.</i> <b>should / ought to</b> = nasihat: <i>You should see a doctor.</i></p><h4>3. Bentuk lampau</h4><p><b>must</b> tiada bentuk lampau. Guna <b>had to</b> untuk kewajipan lampau (<i>Yesterday I had to work late</i> = Semalam saya terpaksa bekerja lewat), dan <b>was / were allowed to</b> atau <b>could</b> untuk kebenaran lampau (<i>When I was young, I was allowed to stay up late</i>).</p><h4>4. Perbezaan penting</h4><p><b>mustn't</b> = dilarang. <b>don't have to</b> = tidak perlu. Modal diikuti kata kerja asas (✘ I must to go → ✔ I must go).</p>`,
q:[["You ___ wear a seat belt. It's the law.",["have to","don't have to","might","could"],0],["You ___ park here. It's forbidden.",["mustn't","don't have to","needn't","might"],0],["You ___ bring food. We have plenty. (not necessary)",["mustn't","don't have to","can't","shouldn't"],1],["___ I use your phone? (permission)",["May","Must","Will","Ought"],0],["Children ___ enter without an adult. (not allowed)",["aren't allowed to","don't have to","needn't","ought to"],0],["The past of 'must' (obligation) is:",["must","musted","had to","have to"],2],["When I was young, I ___ stay up late. (permission)",["am allowed to","was allowed to","must","had allowed"],1],["You ___ see a doctor. (advice)",["should","mustn't","needn't","aren't allowed"],0],["'I must finish this today' is often:",["a personal obligation","an external rule","no obligation","a past habit"],0],["'I have to wear a uniform' is often:",["a rule from outside","a personal feeling","no obligation","permission"],0],["Which is correct?",["I must to go.","I must go.","I musts go.","I must going."],1],["Which means 'not necessary'?",["needn't","mustn't","can't","shouldn't"],0],["You ___ smoke in the hospital.",["mustn't","don't have to","needn't","may"],0],["Yesterday I ___ work late. (obligation)",["must","had to","have to","musted"],1],["Which is correct?",["Are we allowed to use dictionaries?","Are we allowed use dictionaries?","Do we allowed to use dictionaries?","Are we allowing to use dictionaries?"],0]]},
{t:["Modifying Comparatives","Mengubah Suai Perbandingan"],
en:`<h4>1. Why modify?</h4><p>A comparative (taller, more expensive) tells us there is a difference. We can add a word before it to show <b>how big</b> that difference is.</p><table><tr><th>Difference</th><th>Modifiers</th><th>Example</th></tr><tr><td>Big</td><td>much, a lot, far, significantly, a great deal</td><td>This car is much more expensive than that one. Tokyo is far bigger than KL.</td></tr><tr><td>Small</td><td>a bit, a little, slightly, a little bit, rather</td><td>My bag is a bit heavier than yours. She runs slightly faster than I do.</td></tr></table><p><b>Do not use very</b> before a comparative: ✘ very taller → ✔ much taller.</p><h4>2. Modifying as … as</h4><table><tr><th>Expression</th><th>Meaning</th></tr><tr><td>just as good as</td><td>exactly equal</td></tr><tr><td>nearly / almost as good as</td><td>a little less</td></tr><tr><td>not quite as tall as</td><td>slightly less</td></tr><tr><td>not nearly as / nowhere near as</td><td>much less</td></tr><tr><td>twice as expensive as, half as much as</td><td>multiples and fractions</td></tr></table><p><i>This phone is twice as expensive as that one.</i></p><h4>3. Superlatives</h4><p><b>by far, easily, quite, nearly</b> modify superlatives: <i>This is by far the best film of the year. She is easily the tallest in the class.</i></p><h4>4. Common mistakes</h4><p>✘ She is so taller than me → ✔ She is much taller than me. ✘ a bit most expensive → ✔ a bit more expensive.</p>`,
bm:`<h4>1. Mengapa diubah suai?</h4><p>Bentuk perbandingan (taller, more expensive) menunjukkan ada perbezaan. Kita boleh letak perkataan sebelumnya untuk menunjukkan <b>betapa besar</b> perbezaan itu.</p><p><b>Perbezaan besar:</b> much, a lot, far, significantly (jauh lebih): <i>This car is much more expensive than that one (Kereta ini jauh lebih mahal). Tokyo is far bigger than KL.</i> <b>Perbezaan kecil:</b> a bit, a little, slightly, rather (sedikit lebih): <i>My bag is a bit heavier than yours (Beg saya sedikit lebih berat). She runs slightly faster than I do.</i></p><p><b>Jangan guna very</b> sebelum bentuk perbandingan: ✘ very taller → ✔ much taller.</p><h4>2. Mengubah suai as … as</h4><p><b>just as good as</b> = betul-betul sama. <b>nearly / almost as good as</b> = hampir sama. <b>not quite as tall as</b> = sedikit kurang. <b>not nearly as / nowhere near as</b> = jauh kurang. <b>twice as expensive as</b> = dua kali ganda; <b>half as much as</b> = separuh: <i>This phone is twice as expensive as that one.</i></p><h4>3. Superlatif</h4><p><b>by far, easily, quite, nearly</b> mengubah suai superlatif: <i>This is by far the best film of the year (Ini jauh sekali filem terbaik tahun ini). She is easily the tallest in the class.</i></p><h4>4. Kesilapan lazim</h4><p>✘ She is so taller than me → ✔ She is much taller than me. ✘ a bit most expensive → ✔ a bit more expensive.</p>`,
q:[["This car is ___ more expensive than that one. (big difference)",["very","much","so","too"],1],["My bag is ___ heavier than yours. (small difference)",["a bit","much","far","a lot"],0],["Which is correct?",["She is very taller than me.","She is much taller than me.","She is so taller than me.","She is too taller than me."],1],["'Slightly' shows:",["a big difference","a small difference","no difference","equality"],1],["Tokyo is ___ bigger than KL.",["far","very","so","most"],0],["This phone is twice ___ expensive as that one.",["more","as","than","so"],1],["He is not quite ___ tall as his brother.",["than","as","more","most"],1],["'Just as good as' means:",["equally good","much better","much worse","slightly better"],0],["The exam was ___ easier than I expected.",["a lot","very","most","such"],0],["Which is correct?",["It's a little bit cheaper.","It's a little bit cheapest.","It's very cheaper.","It's a little bit most cheap."],0],["She runs ___ faster than I do. (small difference)",["slightly","far","much","a lot"],0],["'Half as much as' means:",["double","50% of","the same","slightly less"],1],["Which is NOT used before a comparative?",["much","a bit","very","far"],2],["This is ___ the best film of the year.",["by far","much","a bit","slightly"],0],["'Not as … as' shows:",["equality","a difference","a question","a request"],1]]},
{t:["Passives","Ayat Pasif"],
en:`<h4>1. Form</h4><p><b>be + past participle.</b> The object of the active sentence becomes the subject of the passive sentence: <i>Someone cleans the room. → The room is cleaned.</i> Add <b>by + agent</b> only when it is important or new.</p><table><tr><th>Tense</th><th>Passive</th></tr><tr><td>Present simple</td><td>English is spoken all over the world.</td></tr><tr><td>Past simple</td><td>The window was broken by a boy.</td></tr><tr><td>Present continuous</td><td>The food is being prepared.</td></tr><tr><td>Present perfect</td><td>The letters have been sent.</td></tr><tr><td>Future (will)</td><td>The report will be finished by Friday.</td></tr><tr><td>Modal</td><td>The rules must be followed.</td></tr></table><h4>2. When to use the passive</h4><p>When the action is more important than the doer, when we do not know who did it, or when it is obvious: <i>My car was stolen last week. These shoes are made in Italy.</i></p><h4>3. Only transitive verbs</h4><p>Only verbs that take an object can become passive (make, give, build, steal). Intransitive verbs (happen, arrive, die, sleep) have no passive: ✘ The accident was happened → ✔ The accident happened.</p><h4>4. Questions and negatives</h4><p><i>Was the window broken? The car wasn't stolen. When was the bridge built?</i></p><h4>5. Common mistakes</h4><p>✘ The bridge built in 1990 → ✔ was built. ✘ The food is preparing → ✔ is being prepared.</p>`,
bm:`<h4>1. Bentuk</h4><p><b>be + past participle.</b> Objek dalam ayat aktif menjadi subjek dalam ayat pasif: <i>Someone cleans the room. → The room is cleaned</i> (Bilik itu dibersihkan). Tambah <b>by + pelaku</b> hanya apabila penting atau baharu.</p><p><b>Kala kini mudah:</b> English is spoken all over the world (Bahasa Inggeris dituturkan di seluruh dunia). <b>Lampau mudah:</b> The window was broken by a boy (Tingkap itu dipecahkan oleh seorang budak lelaki). <b>Kini berterusan:</b> The food is being prepared (Makanan sedang disediakan). <b>Kini sempurna:</b> The letters have been sent (Surat-surat itu telah dihantar). <b>Masa depan:</b> The report will be finished by Friday. <b>Modal:</b> The rules must be followed.</p><h4>2. Bila guna pasif</h4><p>Apabila perbuatan lebih penting daripada pelaku, apabila kita tidak tahu siapa pelaku, atau apabila pelaku sudah jelas: <i>My car was stolen last week (Kereta saya dicuri minggu lepas). These shoes are made in Italy.</i></p><h4>3. Hanya kata kerja transitif</h4><p>Hanya kata kerja yang mempunyai objek boleh menjadi pasif (make, give, build, steal). Kata kerja tak transitif (happen, arrive, die, sleep) tiada bentuk pasif: ✘ The accident was happened → ✔ The accident happened.</p><h4>4. Soalan dan negatif</h4><p><i>Was the window broken? The car wasn't stolen. When was the bridge built?</i></p><h4>5. Kesilapan lazim</h4><p>✘ The bridge built in 1990 → ✔ was built. ✘ The food is preparing → ✔ is being prepared. Ingat: dalam Bahasa Melayu "di-" (dimakan, dibina) sepadan dengan <i>be + past participle</i>.</p>`,
q:[["English ___ all over the world.",["speaks","is spoken","speak","is speaking"],1],["The window ___ by a boy yesterday.",["broke","was broken","is broken","has broken"],1],["The cake ___ now.",["is baking","is being baked","baked","was baked"],1],["The report ___ by Friday.",["will finish","will be finished","is finishing","finished"],1],["Which is correct?",["The accident was happened.","The accident happened.","The accident was happen.","The accident is happened."],1],["My car ___ stolen last week.",["is","was","has","were"],1],["'Someone cleans the room every day.' → The room ___ every day.",["cleans","is cleaned","cleaned","is cleaning"],1],["The letters have already ___.",["been sent","sent","being sent","send"],0],["The passive structure is:",["be + past participle","have + -ing","do + base verb","will + -ing"],0],["Which verb cannot be used in the passive?",["make","give","arrive","build"],2],["These shoes ___ in Italy.",["make","are made","made","is made"],1],["The bridge ___ in 1990.",["built","was built","is built","has built"],1],["The rules ___ by everyone.",["must follow","must be followed","must followed","must following"],1],["'by + agent' is used when:",["we want to say who did it","the agent is unknown","always","never"],0],["Which is correct?",["The food is being prepared.","The food is preparing.","The food being prepared.","The food is be prepared."],0]]},
{t:["Past Ability","Keupayaan Masa Lampau"],
en:`<h4>1. could: general ability</h4><p>Use <b>could</b> for a general ability in the past (something you were able to do any time): <i>When I was five, I could swim. She could run very fast when she was young.</i></p><h4>2. was / were able to and managed to: one specific success</h4><p>For something you did successfully on <u>one occasion</u>, use <b>was / were able to</b> or <b>managed to</b> (suggests it was difficult): <i>She was able to pass the exam last week. I managed to find the keys in the end. The fire was big, but everyone was able to escape.</i> ✘ I could pass the exam yesterday → ✔ I was able to / managed to pass.</p><h4>3. succeeded in + -ing</h4><p><i>She succeeded in winning the race.</i> (✘ succeeded to win)</p><h4>4. Negatives</h4><p><b>couldn't</b> and <b>wasn't / weren't able to</b> both work for general and specific failure: <i>They couldn't open the door. I wasn't able to finish the report.</i></p><h4>5. Verbs of perception</h4><p>With <i>see, hear, smell, feel, taste, understand, remember</i> use <b>could</b> even for one occasion: <i>I could hear the music from my room.</i></p><table><tr><th>Situation</th><th>Form</th></tr><tr><td>General ability</td><td>could</td></tr><tr><td>One specific success</td><td>was able to / managed to / succeeded in</td></tr><tr><td>Failure (any)</td><td>couldn't / wasn't able to</td></tr></table>`,
bm:`<h4>1. could: keupayaan umum</h4><p>Guna <b>could</b> untuk keupayaan umum pada masa lampau (sesuatu yang anda mampu lakukan pada bila-bila masa): <i>When I was five, I could swim (Semasa berumur lima tahun, saya boleh berenang). She could run very fast when she was young.</i></p><h4>2. was / were able to dan managed to: satu kejayaan tertentu</h4><p>Untuk sesuatu yang berjaya dilakukan pada <u>satu peristiwa</u>, guna <b>was / were able to</b> atau <b>managed to</b> (menunjukkan ia sukar): <i>She was able to pass the exam last week. I managed to find the keys in the end (Akhirnya saya berjaya menjumpai kunci itu). The fire was big, but everyone was able to escape.</i> ✘ I could pass the exam yesterday → ✔ I was able to / managed to pass.</p><h4>3. succeeded in + -ing</h4><p><i>She succeeded in winning the race (Dia berjaya memenangi perlumbaan itu).</i> (✘ succeeded to win)</p><h4>4. Negatif</h4><p><b>couldn't</b> dan <b>wasn't / weren't able to</b> kedua-duanya boleh untuk kegagalan umum dan tertentu: <i>They couldn't open the door. I wasn't able to finish the report.</i></p><h4>5. Kata kerja deria</h4><p>Dengan <i>see, hear, smell, feel, taste, understand, remember</i> guna <b>could</b> walaupun untuk satu peristiwa: <i>I could hear the music from my room.</i></p><p><b>Ringkasan:</b> keupayaan umum = <i>could</i>. Satu kejayaan tertentu = <i>was able to / managed to / succeeded in</i>. Kegagalan = <i>couldn't / wasn't able to</i>.</p>`,
q:[["When I was five, I ___ swim.",["can","could","am able to","managed"],1],["She ___ pass the exam last week after studying hard. (specific success)",["could","was able to","can","is able to"],1],["I ___ find the keys in the end. (specific)",["could","managed to","can","am able"],1],["Which is correct?",["I could pass the exam yesterday.","I was able to pass the exam yesterday.","I can pass the exam yesterday.","I able to pass the exam yesterday."],1],["He ___ speak three languages when he was ten.",["could","managed to","succeeded","is able"],0],["They ___ open the door. (negative, specific)",["couldn't","can't","didn't could","weren't could"],0],["'Managed to' means:",["succeeded in doing something difficult","was forbidden","had permission","was going to"],0],["'Succeeded in' is followed by:",["base verb","-ing","to + verb","past participle"],1],["I ___ hear the music from my room. (perception)",["could","was able","managed","succeed"],0],["Which is correct?",["She succeeded in to win.","She succeeded in winning.","She succeeded winning.","She succeeded win."],1],["'Could' is NOT normally used for:",["general past ability","one specific successful event","negative sentences","perception verbs"],1],["The fire was big, but everyone ___ escape.",["could","was able to","can","is able to"],1],["When she was young, she ___ run very fast.",["could","managed to","succeeded in","can"],0],["Which is correct?",["I wasn't able to finish the report.","I wasn't could finish the report.","I didn't could finish the report.","I not able finish the report."],0],["The past form of 'can' for ability is:",["could","cans","canned","can't"],0]]},
{t:["Past Habits: used to, would, past simple","Tabiat Lampau: used to, would, past simple"],
en:`<h4>1. Three ways to talk about past habits</h4><table><tr><th>Form</th><th>Use</th><th>Example</th></tr><tr><td><b>used to + base verb</b></td><td>past habits <u>and states</u> that are no longer true</td><td>I used to live in Penang. She used to have long hair. I used to be shy.</td></tr><tr><td><b>would + base verb</b></td><td>repeated <u>actions</u> only (NOT states)</td><td>When I was a child, we would visit my grandmother every Sunday.</td></tr><tr><td><b>past simple</b></td><td>habits with a stated period or number of times; single events</td><td>I lived in Kuching for ten years. We went to Melaka three times last year.</td></tr></table><h4>2. Key rule: states vs actions</h4><p>State verbs (be, have, live, own, like, know) cannot use <i>would</i> for the past: ✘ I would be shy → ✔ I used to be shy. ✘ We would own a car → ✔ We used to own a car. Action verbs (visit, go, play, tell) can use either <i>used to</i> or <i>would</i>.</p><h4>3. Time reference first</h4><p>Begin with a past time reference before using <i>would</i>: <i>Every summer we would go to the beach.</i></p><h4>4. Negatives and questions</h4><p>Use <b>use to</b> after <i>did / didn't</i>: <i>Did you use to go by bus? She didn't use to eat fish.</i> Avoid <i>would</i> in negatives and questions for habits.</p><h4>5. When you cannot use used to</h4><p>With an exact number or period, use the past simple: ✘ I used to go there three times → ✔ I went there three times.</p>`,
bm:`<h4>1. Tiga cara menyatakan tabiat lampau</h4><p><b>used to + kata kerja asas:</b> tabiat <u>dan keadaan</u> lampau yang tidak lagi benar: <i>I used to live in Penang (Dahulu saya tinggal di Pulau Pinang). She used to have long hair. I used to be shy.</i></p><p><b>would + kata kerja asas:</b> hanya untuk <u>perbuatan</u> yang berulang (BUKAN keadaan): <i>When I was a child, we would visit my grandmother every Sunday (Semasa kecil, kami selalu melawat nenek setiap Ahad).</i></p><p><b>past simple:</b> tabiat dengan tempoh atau bilangan kali yang dinyatakan; peristiwa tunggal: <i>I lived in Kuching for ten years. We went to Melaka three times last year.</i></p><h4>2. Peraturan utama: keadaan berbanding perbuatan</h4><p>Kata kerja keadaan (be, have, live, own, like, know) tidak boleh guna <i>would</i> untuk masa lampau: ✘ I would be shy → ✔ I used to be shy. ✘ We would own a car → ✔ We used to own a car. Kata kerja perbuatan (visit, go, play, tell) boleh guna <i>used to</i> atau <i>would</i>.</p><h4>3. Rujukan masa dahulu</h4><p>Mulakan dengan rujukan masa lampau sebelum menggunakan <i>would</i>: <i>Every summer we would go to the beach.</i></p><h4>4. Negatif dan soalan</h4><p>Guna <b>use to</b> selepas <i>did / didn't</i>: <i>Did you use to go by bus? She didn't use to eat fish.</i> Elakkan <i>would</i> dalam negatif dan soalan untuk tabiat.</p><h4>5. Bila tidak boleh guna used to</h4><p>Dengan bilangan atau tempoh yang tepat, guna past simple: ✘ I used to go there three times → ✔ I went there three times.</p>`,
q:[["When I was a child, we ___ visit my grandmother every Sunday.",["would","were","are","had"],0],["I ___ live in Penang when I was young. (state)",["would","used to","am used to","will"],1],["In which sentence is 'would' NOT possible? (state verb)",["We would play football every day.","We would have a small house.","They would sing every morning.","He would walk to school."],1],["'We went to Melaka three times last year.' Why not 'used to'?",["a specific number of times","a state","a rule","a question"],0],["She ___ have long hair, but now it's short.",["would","used to","is used to","will"],1],["Which is correct?",["I would be shy as a child.","I used to be shy as a child.","I would to be shy as a child.","I use to be shy as a child."],1],["A past habit with 'would' needs:",["a repeated action","a state verb","a single event","a future plan"],0],["'I lived in Kuching for ten years' uses the past simple because:",["an exact period is given","it is a habit only","it is a state only","it is about the future"],0],["My father ___ tell us stories every night.",["would","is","was used","has"],0],["Did you ___ to school by bus?",["used to go","use to go","would go","are used go"],1],["Which is correct?",["We would own a car.","We used to own a car.","We would to own a car.","We used own a car."],1],["'She didn't use to eat fish' means:",["In the past she did not eat fish","She will not eat fish","She can't eat fish","She must not eat fish"],0],["Which is NOT used for past habits?",["past simple","used to","would","present perfect"],3],["Every summer we ___ to the beach.",["would go","would went","used go","are going"],0],["'I used to be afraid of dogs'. 'Be afraid' is:",["a state","a single event","a future plan","an order"],0]]},
{t:["Past Perfect","Kala Lampau Sempurna"],
en:`<h4>1. Form</h4><p><b>had + past participle</b> (for all subjects). Negative: <i>hadn't + pp</i>. Question: <i>Had + subject + pp?</i> Short form: <i>'d</i> (she'd left).</p><h4>2. Use: the "earlier past"</h4><p>The past perfect shows an action that was completed <b>before another action or time in the past</b>. It is the "past in the past".</p><div class="eg">When I arrived, the film <b>had</b> already <b>started</b>. (first: the film started; then: I arrived)</div><div class="eg">She <b>had left</b> when I called. · I didn't know the answer because I <b>hadn't studied</b>.</div><h4>3. Common signal words</h4><p><b>already, just, before, by the time, after, until, when, never … before.</b> <i>By the time we got to the station, the train had left.</i></p><h4>4. Past simple or past perfect?</h4><p>If events are told in the order they happened, use the past simple: <i>I got up, had breakfast and left.</i> When the order is reversed or we stress that one action was finished first, use the past perfect. After <i>before / after</i> the past simple is often enough: <i>After she finished, she watched TV.</i></p><h4>5. In reported speech and stories</h4><p><i>She said she had seen the film before.</i> Also used to explain reasons: <i>I was tired because I had worked all day.</i></p><h4>6. Common mistakes</h4><p>✘ I had went home → ✔ I had gone home. ✘ Did she had finished? → ✔ Had she finished?</p>`,
bm:`<h4>1. Bentuk</h4><p><b>had + past participle</b> (untuk semua subjek). Negatif: <i>hadn't + pp</i>. Soalan: <i>Had + subjek + pp?</i> Singkatan: <i>'d</i> (she'd left).</p><h4>2. Kegunaan: "lampau yang lebih awal"</h4><p>Past perfect menunjukkan perbuatan yang telah selesai <b>sebelum perbuatan atau masa lain dalam masa lampau</b>. Ia ialah "lampau dalam lampau".</p><div class="eg">When I arrived, the film <b>had</b> already <b>started</b>. (Apabila saya tiba, filem itu sudah bermula. Pertama: filem bermula; kemudian: saya tiba.)</div><div class="eg">She <b>had left</b> when I called (Dia sudah pergi apabila saya menelefon). · I didn't know the answer because I <b>hadn't studied</b>.</div><h4>3. Kata petunjuk lazim</h4><p><b>already (sudah), just, before (sebelum), by the time (apabila), after (selepas), until, when, never … before.</b> <i>By the time we got to the station, the train had left.</i></p><h4>4. Past simple atau past perfect?</h4><p>Jika peristiwa diceritakan mengikut urutan berlaku, guna past simple: <i>I got up, had breakfast and left.</i> Apabila urutan diterbalikkan atau kita menekankan satu perbuatan selesai dahulu, guna past perfect. Selepas <i>before / after</i> past simple selalunya sudah cukup: <i>After she finished, she watched TV.</i></p><h4>5. Dalam ucapan dilaporkan dan cerita</h4><p><i>She said she had seen the film before (Dia berkata dia pernah menonton filem itu).</i> Juga untuk menerangkan sebab: <i>I was tired because I had worked all day.</i></p><h4>6. Kesilapan lazim</h4><p>✘ I had went home → ✔ I had gone home. ✘ Did she had finished? → ✔ Had she finished?</p>`,
q:[["When I arrived, the film ___.",["started","had started","has started","was starting"],1],["She ___ already left when I called.",["has","had","was","did"],1],["The past perfect form is:",["had + past participle","have + past participle","was + -ing","would + base verb"],0],["By the time we got to the station, the train ___.",["left","had left","has left","leaves"],1],["I was tired because I ___ all day.",["worked","had worked","work","have worked"],1],["Which is correct?",["I had went home.","I had gone home.","I have gone home before he came.","I had go home."],1],["___ you ever been to Japan before 2020?",["Have","Had","Were","Do"],1],["She watched TV after she ___ her homework.",["had finished","has finished","finishes","finishing"],0],["They hadn't ___ dinner when we arrived.",["eat","ate","eaten","eating"],2],["'When he got home, she had cooked dinner.' Which happened first?",["she cooked","he got home","same time","unknown"],0],["'I didn't know the answer because I ___ the lesson.'",["didn't study","hadn't studied","haven't studied","don't study"],1],["The short form of 'had' in 'She had left' is:",["she'd left","she's left","she'll left","she left"],0],["Which signal word often goes with the past perfect?",["already","tomorrow","now","next week"],0],["She said she ___ the film before.",["saw","had seen","has seen","sees"],1],["Which is correct?",["Had she finished when you arrived?","Did she finished when you arrived?","Has she finished when you arrived?","Had she finish when you arrived?"],0]]},
{t:["Phrasal Verbs","Kata Kerja Frasa (Phrasal Verbs)"],
en:`<h4>1. What is a phrasal verb?</h4><p>A phrasal verb is a <b>verb + particle</b> (a preposition or adverb) whose meaning is often different from the separate words: <i>give up</i> = stop trying, <i>look after</i> = take care of.</p><h4>2. Four types</h4><table><tr><th>Type</th><th>Rule</th><th>Example</th></tr><tr><td>No object</td><td>intransitive</td><td>get up, sit down, wake up, break down, come back</td></tr><tr><td>Separable</td><td>object can go <u>between</u> verb and particle; a <b>pronoun must</b> go between</td><td>turn off the light / turn the light off / turn <b>it</b> off (✘ turn off it)</td></tr><tr><td>Inseparable</td><td>object always after the particle</td><td>look after the children / look after them (✘ look the children after)</td></tr><tr><td>Three-word</td><td>verb + two particles; inseparable</td><td>look forward to, run out of, get on with, put up with</td></tr></table><h4>3. Common phrasal verbs</h4><table><tr><th>Phrasal verb</th><th>Meaning</th></tr><tr><td>get up / wake up</td><td>leave bed / stop sleeping</td></tr><tr><td>look for / look after</td><td>search / take care of</td></tr><tr><td>give up</td><td>stop trying</td></tr><tr><td>turn on / turn off</td><td>start a device / stop it</td></tr><tr><td>put on / take off</td><td>wear / remove clothes (take off also: plane leaves)</td></tr><tr><td>find out</td><td>discover information</td></tr><tr><td>pick up</td><td>collect someone or something</td></tr><tr><td>run out of</td><td>have none left</td></tr><tr><td>break down</td><td>stop working</td></tr></table><h4>4. Common mistakes</h4><p>✘ Turn off it → ✔ Turn it off. ✘ I look forward to meet you → ✔ I look forward to meeting you (<i>to</i> is a preposition). Learn each phrasal verb as one whole item.</p>`,
bm:`<h4>1. Apakah phrasal verb?</h4><p>Phrasal verb ialah <b>kata kerja + zarah</b> (kata sendi atau kata keterangan) yang maknanya selalunya berbeza daripada perkataan asalnya: <i>give up</i> = berhenti mencuba, <i>look after</i> = menjaga.</p><h4>2. Empat jenis</h4><p><b>(a) Tiada objek:</b> get up (bangun), sit down (duduk), wake up (terjaga), break down (rosak), come back (kembali). <b>(b) Boleh dipisah:</b> objek boleh berada <u>di antara</u> kata kerja dan zarah, dan <b>kata ganti mesti</b> berada di antara: <i>turn off the light / turn the light off / turn <b>it</b> off</i> (✘ turn off it). <b>(c) Tidak boleh dipisah:</b> objek sentiasa selepas zarah: <i>look after the children / look after them</i> (✘ look the children after). <b>(d) Tiga perkataan:</b> kata kerja + dua zarah, tidak boleh dipisah: <i>look forward to (tidak sabar menanti), run out of (kehabisan), get on with (bergaul baik), put up with (bersabar dengan).</i></p><h4>3. Phrasal verb lazim</h4><p><b>look for</b> = mencari. <b>look after</b> = menjaga. <b>give up</b> = berhenti / mengalah. <b>turn on / turn off</b> = membuka / menutup (peranti). <b>put on / take off</b> = memakai / menanggalkan (take off juga: kapal terbang berlepas). <b>find out</b> = mengetahui / mendapat tahu. <b>pick up</b> = mengambil (seseorang atau sesuatu). <b>run out of</b> = kehabisan. <b>break down</b> = rosak.</p><h4>4. Kesilapan lazim</h4><p>✘ Turn off it → ✔ Turn it off. ✘ I look forward to meet you → ✔ I look forward to meeting you (<i>to</i> ialah kata sendi). Belajar setiap phrasal verb sebagai satu unit penuh.</p>`,
q:[["I get ___ at 6 every day.",["up","on","in","off"],0],["Please turn ___ the light. (stop it)",["on","off","in","up"],1],["Which is correct?",["Turn off it.","Turn it off.","Turn off it off.","Off turn it."],1],["'Look after' means:",["search","take care of","wait","stop"],1],["'Give up' means:",["start","stop trying","give a gift","wake"],1],["I'm looking ___ my keys. (searching)",["for","after","at","up"],0],["Which is correct?",["She looks after the children.","She looks the children after.","She after looks the children.","She looks children after."],0],["The car broke ___ on the highway.",["up","down","out","on"],1],["'Find out' means:",["discover information","search by eye","lose","wake up"],0],["Please put ___ your coat. (wear it)",["on","off","away","out"],0],["We've run ___ of milk.",["out","up","off","in"],0],["Which is a three-word phrasal verb?",["look forward to","get up","turn off","put on"],0],["'Take off' (a plane) means:",["leave the ground","land","stop","turn"],0],["Can you pick me ___ at 5?",["up","out","down","off"],0],["Which is correct?",["I look forward to meeting you.","I look forward meeting you.","I look forward to meet you.","I look to forward meeting you."],0]]},
{t:["Present Perfect","Kala Kini Sempurna"],
en:`<h4>1. Form</h4><p><b>have / has + past participle.</b> Negative: <i>haven't / hasn't + pp</i>. Question: <i>Have / Has + subject + pp?</i> Regular pp: verb + -ed (worked). Irregular pp: go → gone, see → seen, eat → eaten, be → been, do → done.</p><h4>2. Uses</h4><table><tr><th>Use</th><th>Example</th></tr><tr><td>Life experience (time not stated)</td><td>I have never eaten durian. Have you ever been to Japan?</td></tr><tr><td>A situation that started in the past and continues now</td><td>She has lived here since 2015. They have worked here for five years.</td></tr><tr><td>A past action with a present result</td><td>I've lost my keys (I can't find them now).</td></tr><tr><td>Recent news</td><td>The government has announced a new law.</td></tr></table><h4>3. for and since</h4><p><b>for</b> + a period (for five years, for two hours). <b>since</b> + a starting point (since 2019, since Monday). Question: <i>How long have you lived here?</i></p><h4>4. been and gone</h4><p><i>She has been to Penang</i> = she visited and has come back. <i>She has gone to Penang</i> = she is there now or on her way.</p><h4>5. Do not use with a finished time</h4><p>Words like <i>yesterday, last year, in 2019, two days ago</i> need the past simple: ✘ I have seen him yesterday → ✔ I saw him yesterday.</p><h4>6. Common mistakes</h4><p>✘ He has went → ✔ He has gone. ✘ He have gone → ✔ He has gone.</p>`,
bm:`<h4>1. Bentuk</h4><p><b>have / has + past participle.</b> Negatif: <i>haven't / hasn't + pp</i>. Soalan: <i>Have / Has + subjek + pp?</i> Pp biasa: kata kerja + -ed (worked). Pp tak sekata: go → gone, see → seen, eat → eaten, be → been, do → done.</p><h4>2. Kegunaan</h4><p><b>(a) Pengalaman hidup</b> (masa tidak dinyatakan): <i>I have never eaten durian (Saya tidak pernah makan durian). Have you ever been to Japan? (Pernahkah anda ke Jepun?)</i> <b>(b) Keadaan yang bermula pada masa lampau dan berterusan hingga kini:</b> <i>She has lived here since 2015 (Dia tinggal di sini sejak 2015). They have worked here for five years.</i> <b>(c) Perbuatan lampau dengan kesan kini:</b> <i>I've lost my keys</i> (Kunci saya hilang; sekarang tidak jumpa). <b>(d) Berita terkini:</b> <i>The government has announced a new law.</i></p><h4>3. for dan since</h4><p><b>for</b> (selama) + tempoh (for five years, for two hours). <b>since</b> (sejak) + titik mula (since 2019, since Monday). Soalan: <i>How long have you lived here?</i> (Sudah berapa lama anda tinggal di sini?)</p><h4>4. been dan gone</h4><p><i>She has been to Penang</i> = dia pernah ke sana dan sudah pulang. <i>She has gone to Penang</i> = dia berada di sana sekarang atau dalam perjalanan.</p><h4>5. Jangan guna dengan masa yang sudah tamat</h4><p>Perkataan seperti <i>yesterday, last year, in 2019, two days ago</i> memerlukan past simple: ✘ I have seen him yesterday → ✔ I saw him yesterday.</p><h4>6. Kesilapan lazim</h4><p>✘ He has went → ✔ He has gone. ✘ He have gone → ✔ He has gone.</p>`,
q:[["I ___ never eaten durian.",["have","has","am","did"],0],["She ___ lived here since 2015.",["have","has","is","had"],1],["___ you ever been to Japan?",["Did","Have","Has","Are"],1],["They have worked here ___ five years.",["since","for","from","ago"],1],["He has known her ___ 2019.",["for","since","ago","during"],1],["Which is correct?",["I have seen him yesterday.","I saw him yesterday.","I have saw him yesterday.","I seen him yesterday."],1],["The past participle of 'go' is:",["went","gone","goed","going"],1],["'She has gone to Penang' means:",["she is there now or on her way","she came back","she never goes","she will go"],0],["'She has been to Penang' means:",["she visited and came back","she is there now","she will go","she hates it"],0],["The present perfect form is:",["have/has + past participle","had + past participle","was + -ing","will have"],0],["'I've lost my keys' means:",["I can't find them now","I found them","I lost them years ago","I will lose them"],0],["Which is correct?",["He has went home.","He has gone home.","He have gone home.","He has go home."],1],["How long ___ you lived here?",["did","have","has","are"],1],["We ___ met before.",["have","has","did","were"],0],["Which word can NOT be used with the present perfect?",["ever","already","yesterday","never"],2]]},
{t:["Present Perfect Simple & Continuous","Present Perfect Mudah & Berterusan"],
en:`<h4>1. Forms</h4><p><b>Simple:</b> have / has + past participle (I have written). <b>Continuous:</b> have / has <b>been</b> + verb-ing (I have been writing).</p><h4>2. Different focus</h4><table><tr><th></th><th>Simple</th><th>Continuous</th></tr><tr><td>Focus</td><td>result, completed action, number</td><td>activity, duration, process</td></tr><tr><td>Example</td><td>She has written three emails this morning. I've cleaned the room.</td><td>I've been waiting for an hour. I've been cleaning the room.</td></tr><tr><td>Question</td><td><b>How many / How much</b> have you done?</td><td><b>How long</b> have you been doing it?</td></tr></table><h4>3. Continuous uses</h4><p><b>(a)</b> An activity that started in the past and is still going on, stressing time: <i>They have been playing football since 2 p.m.</i> <b>(b)</b> An activity that has just finished, with visible evidence: <i>Your hands are covered in paint. You have been painting. Has it been raining? The ground is wet.</i> The action may or may not be finished: <i>I've been reading that book</i> (perhaps not finished) vs <i>I've read that book</i> (finished).</p><h4>4. Stative verbs</h4><p>Verbs of state (know, like, love, want, belong, understand, own) do not use the continuous: ✘ I have been knowing her for years → ✔ I have known her for years.</p><h4>5. Common mistakes</h4><p>✘ She has been work here → ✔ She has been working here. ✘ She has being working → ✔ She has been working.</p>`,
bm:`<h4>1. Bentuk</h4><p><b>Mudah (simple):</b> have / has + past participle (I have written). <b>Berterusan (continuous):</b> have / has <b>been</b> + kata kerja-ing (I have been writing).</p><h4>2. Fokus yang berbeza</h4><p><b>Simple</b> menekankan hasil, perbuatan yang sudah selesai dan bilangan: <i>She has written three emails this morning (Dia telah menulis tiga e-mel pagi ini). I've cleaned the room.</i> Soalan: <b>How many / How much</b> have you done? <b>Continuous</b> menekankan aktiviti, tempoh dan proses: <i>I've been waiting for an hour (Saya telah menunggu selama sejam). I've been cleaning the room.</i> Soalan: <b>How long</b> have you been doing it?</p><h4>3. Kegunaan continuous</h4><p><b>(a)</b> Aktiviti yang bermula dahulu dan masih berterusan, menekankan tempoh: <i>They have been playing football since 2 p.m.</i> <b>(b)</b> Aktiviti yang baru tamat, dengan bukti yang nampak: <i>Your hands are covered in paint. You have been painting (Tangan anda penuh cat. Anda tadi mengecat). Has it been raining? The ground is wet.</i> Perbuatan itu mungkin sudah atau belum selesai: <i>I've been reading that book</i> (mungkin belum habis) berbanding <i>I've read that book</i> (sudah habis).</p><h4>4. Kata kerja keadaan</h4><p>Kata kerja keadaan (know, like, love, want, belong, understand, own) tidak menggunakan bentuk berterusan: ✘ I have been knowing her for years → ✔ I have known her for years.</p><h4>5. Kesilapan lazim</h4><p>✘ She has been work here → ✔ She has been working here. ✘ She has being working → ✔ She has been working.</p>`,
q:[["I ___ for an hour. (emphasising duration)",["have waited","have been waiting","was waiting","wait"],1],["She ___ three emails this morning. (number)",["has written","has been writing","wrote","writes"],0],["Your hands are covered in paint. You ___.",["have been painting","are painting","painted","paint"],0],["How long ___ you been learning English?",["have","has","did","are"],0],["How much money ___ you spent?",["have","has been","did","are"],0],["Which verb is NOT normally used in the continuous?",["know","work","study","play"],0],["Which is correct?",["I have been knowing her for years.","I have known her for years.","I know her for years.","I am knowing her for years."],1],["'Has it been raining?' suggests:",["an activity that is recent or ongoing","a finished number","a past date","a future plan"],0],["'I've cleaned the room' focuses on:",["the result","the duration","the future","the habit"],0],["'I've been cleaning the room' focuses on:",["the activity","the result only","a finished past","the future"],0],["They ___ football since 2 p.m.",["have played","have been playing","played","play"],1],["Which is correct?",["She has been work here.","She has been working here.","She have been working here.","She has being working here."],1],["'I have been reading that book' means:",["it is not necessarily finished","it is definitely finished","I never read it","I read it last year"],0],["How many pages ___ you read?",["have","have been","did been","are"],0],["He's tired because he ___ all day.",["has been working","worked","is work","works"],0]]},
{t:["Present Perfect: just, yet, still, already","Present Perfect: just, yet, still, already"],
en:`<h4>1. The four words</h4><table><tr><th>Word</th><th>Meaning</th><th>Position</th><th>Example</th></tr><tr><td><b>just</b></td><td>a very short time ago</td><td>between <i>have/has</i> and pp</td><td>I've just finished my homework. The bus has just arrived.</td></tr><tr><td><b>already</b></td><td>earlier than expected</td><td>between <i>have/has</i> and pp (or at the end for surprise)</td><td>She has already left. Have you already seen it?</td></tr><tr><td><b>yet</b></td><td>until now; in questions and negatives only</td><td>at the end of the sentence</td><td>I haven't eaten yet. Have you finished yet?</td></tr><tr><td><b>still</b></td><td>not finished, and we expected it would be</td><td>before <i>haven't/hasn't</i></td><td>I still haven't finished the report.</td></tr></table><h4>2. Rules</h4><p><b>yet</b> is not used in positive sentences (✘ I have finished yet). <b>still</b> in negatives goes <u>before</u> the auxiliary (✔ I still haven't called him). <b>already</b> is used in positive sentences (✘ I haven't eaten already → ✔ I haven't eaten yet).</p><h4>3. Word order in negatives</h4><p><i>I haven't finished yet. = I still haven't finished.</i> The second version sounds more impatient or annoyed.</p><h4>4. Common mistakes</h4><p>✘ I have yet finished → ✔ I haven't finished yet. ✘ He hasn't arrived already → ✔ He hasn't arrived yet. ✘ I've seen her just yesterday → ✔ I saw her yesterday.</p>`,
bm:`<h4>1. Empat perkataan</h4><p><b>just</b> = baru sahaja (sangat sebentar tadi); letak di antara <i>have/has</i> dan pp: <i>I've just finished my homework (Saya baru sahaja siap kerja rumah). The bus has just arrived.</i></p><p><b>already</b> = sudah (lebih awal daripada jangkaan); di antara <i>have/has</i> dan pp (atau di hujung ayat untuk menunjukkan terkejut): <i>She has already left (Dia sudah pergi). Have you already seen it?</i></p><p><b>yet</b> = lagi / setakat ini; hanya dalam soalan dan negatif; di hujung ayat: <i>I haven't eaten yet (Saya belum makan lagi). Have you finished yet?</i></p><p><b>still</b> = masih (belum selesai dan kita menjangka sepatutnya sudah); sebelum <i>haven't/hasn't</i>: <i>I still haven't finished the report (Saya masih belum siap laporan).</i></p><h4>2. Peraturan</h4><p><b>yet</b> tidak digunakan dalam ayat positif (✘ I have finished yet). <b>still</b> dalam ayat negatif diletakkan <u>sebelum</u> kata kerja bantu (✔ I still haven't called him). <b>already</b> digunakan dalam ayat positif (✘ I haven't eaten already → ✔ I haven't eaten yet).</p><h4>3. Susunan kata dalam negatif</h4><p><i>I haven't finished yet. = I still haven't finished.</i> Versi kedua kedengaran lebih tidak sabar atau kecewa.</p><h4>4. Kesilapan lazim</h4><p>✘ I have yet finished → ✔ I haven't finished yet. ✘ He hasn't arrived already → ✔ He hasn't arrived yet. ✘ I've seen her just yesterday → ✔ I saw her yesterday.</p>`,
q:[["I have ___ finished my homework. (a moment ago)",["just","yet","still","ever"],0],["Have you finished ___?",["yet","still","just","always"],0],["I haven't eaten ___.",["yet","just","already","ever"],0],["She has ___ left. (earlier than expected)",["already","yet","still","ever"],0],["I ___ haven't finished the report. (annoyed it is not done)",["still","yet","already","just"],0],["Where do we usually put 'yet'?",["at the end","before have","between have and pp","at the start"],0],["Which is correct?",["I have finished yet.","I haven't finished yet.","I yet have finished.","I have yet finish."],1],["'Just' means:",["a short time ago","not yet","earlier than expected","always"],0],["Where does 'already' usually go?",["between have and the past participle","only at the start","after 'the'","with 'not' only"],0],["The bus has ___ arrived. Look!",["just","yet","still","ever"],0],["Which is correct?",["He hasn't arrived already.","He hasn't arrived yet.","He has yet arrived.","He has arrived yet."],1],["'Have you ___ seen the film?' (surprised: so soon)",["already","yet","still","just"],0],["'I still haven't called him' shows:",["it is not done and I expected it","it's finished","a past date","a habit"],0],["Which is used in questions and negatives?",["yet","just","already","recently"],0],["Which is correct?",["I've just seen her.","I've seen her just yesterday.","I've yet seen her.","I've seen her already yesterday."],0]]},
{t:["Question Tags","Soalan Penegas (Question Tags)"],
en:`<h4>1. What is a question tag?</h4><p>A short question added to the end of a statement to check information or ask for agreement: <i>You are tired, aren't you? She doesn't like fish, does she?</i></p><h4>2. The main rule</h4><p><b>Positive statement → negative tag. Negative statement → positive tag.</b> The tag uses the <b>same auxiliary verb</b> as the statement and a <b>pronoun</b> for the subject.</p><table><tr><th>Statement</th><th>Tag</th></tr><tr><td>You are tired,</td><td>aren't you?</td></tr><tr><td>He can swim,</td><td>can't he?</td></tr><tr><td>She will come,</td><td>won't she?</td></tr><tr><td>They have gone,</td><td>haven't they?</td></tr><tr><td>You haven't finished,</td><td>have you?</td></tr><tr><td>It's raining,</td><td>isn't it?</td></tr></table><h4>3. No auxiliary verb</h4><p>Use <b>do / does / did</b>: <i>They went home, didn't they? She doesn't like fish, does she? He likes tea, doesn't he?</i></p><h4>4. Special cases</h4><p><b>I am</b> → <i>aren't I?</i> (I am late, aren't I?). <b>Let's</b> → <i>shall we?</i> (Let's go, shall we?). <b>Imperative</b> → <i>will you?</i> (Open the door, will you?). <b>There is</b> → <i>isn't there?</i> <b>Nobody / nothing / no one</b> → positive tag with <i>they / it</i> (Nobody called, did they?).</p><h4>5. Intonation</h4><p><b>Rising voice</b> = a real question (you are not sure). <b>Falling voice</b> = you expect the listener to agree.</p><h4>6. Common mistake</h4><p>✘ using <i>isn't it?</i> for everything (common in some speech) → ✔ match the auxiliary and subject.</p>`,
bm:`<h4>1. Apakah question tag?</h4><p>Soalan pendek yang ditambah di hujung pernyataan untuk mengesahkan maklumat atau meminta persetujuan (seperti "kan?" atau "ya tak?"): <i>You are tired, aren't you? (Anda penat, kan?) She doesn't like fish, does she?</i></p><h4>2. Peraturan utama</h4><p><b>Pernyataan positif → tag negatif. Pernyataan negatif → tag positif.</b> Tag menggunakan <b>kata kerja bantu yang sama</b> dengan pernyataan dan <b>kata ganti nama</b> sebagai subjek.</p><p><i>You are tired, aren't you? · He can swim, can't he? · She will come, won't she? · They have gone, haven't they? · You haven't finished, have you? · It's raining, isn't it?</i></p><h4>3. Tiada kata kerja bantu</h4><p>Guna <b>do / does / did</b>: <i>They went home, didn't they? She doesn't like fish, does she? He likes tea, doesn't he?</i></p><h4>4. Kes khas</h4><p><b>I am</b> → <i>aren't I?</i> (I am late, aren't I?). <b>Let's</b> → <i>shall we?</i> (Let's go, shall we?). <b>Arahan</b> → <i>will you?</i> (Open the door, will you?). <b>There is</b> → <i>isn't there?</i> <b>Nobody / nothing / no one</b> → tag positif dengan <i>they / it</i> (Nobody called, did they?).</p><h4>5. Intonasi</h4><p><b>Suara naik</b> = soalan sebenar (anda tidak pasti). <b>Suara turun</b> = anda menjangka pendengar bersetuju.</p><h4>6. Kesilapan lazim</h4><p>Dalam Bahasa Melayu "kan?" sesuai untuk semua ayat, tetapi dalam Bahasa Inggeris tag mesti sepadan: ✘ menggunakan <i>isn't it?</i> untuk semua ayat → ✔ padankan kata kerja bantu dan subjek.</p>`,
q:[["You are tired, ___?",["are you","aren't you","don't you","isn't you"],1],["She doesn't like fish, ___?",["doesn't she","does she","is she","don't she"],1],["They went home, ___?",["did they","didn't they","weren't they","don't they"],1],["I am late, ___?",["amn't I","aren't I","isn't I","don't I"],1],["Let's go, ___?",["will we","shall we","don't we","let's we"],1],["Open the door, ___?",["will you","don't you","do you","shall we"],0],["He can swim, ___?",["can he","can't he","doesn't he","isn't he"],1],["There is a bank near here, ___?",["is there","isn't there","isn't it","is it"],1],["You haven't finished, ___?",["haven't you","have you","did you","are you"],1],["'It's raining, ___?'",["isn't it","doesn't it","hasn't it","isn't there"],0],["A rising voice on the tag shows:",["a real question","certainty","a command","a joke"],0],["Nobody called, ___?",["did they","didn't they","did he","didn't he"],0],["She will come, ___?",["won't she","will she","doesn't she","isn't she"],0],["They have gone, ___?",["haven't they","hadn't they","don't they","aren't they"],0],["After a positive statement the tag is usually:",["negative","positive","absent","a wh-question"],0]]},
{t:["Reflexive Pronouns","Kata Ganti Nama Refleksif"],
en:`<h4>1. The forms</h4><table><tr><th>Subject</th><th>Reflexive</th></tr><tr><td>I</td><td>myself</td></tr><tr><td>you (singular)</td><td>yourself</td></tr><tr><td>he / she / it</td><td>himself / herself / itself</td></tr><tr><td>we</td><td>ourselves</td></tr><tr><td>you (plural)</td><td>yourselves</td></tr><tr><td>they</td><td>themselves</td></tr></table><p>Remember: <b>-self</b> is singular, <b>-selves</b> is plural. ✘ hisself, theirselves, themself → ✔ himself, themselves.</p><h4>2. Uses</h4><p><b>(a)</b> When the <u>subject and object are the same person</u>: <i>I cut myself. She looked at herself in the mirror. The cat washed itself. They blamed themselves.</i> <b>(b)</b> After <i>by</i> to mean <u>alone</u> or <u>without help</u>: <i>He lives by himself.</i> <b>(c)</b> For emphasis: <i>I made it myself. Who made the cake? I myself did.</i></p><h4>3. Phrases</h4><p><i>Enjoy yourself! Help yourself! Behave yourself! Teach yourself.</i></p><h4>4. Verbs that do not need a reflexive</h4><p>In English, verbs like <b>wash, shave, dress, relax, feel, meet, hide</b> often have no reflexive: <i>He shaved quickly. I feel tired.</i> (✘ I feel myself tired.)</p><h4>5. Reflexive or each other?</h4><p><b>each other / one another</b> = two or more people doing the same action to one another: <i>They looked at each other.</i> Not the same as <i>They looked at themselves.</i></p>`,
bm:`<h4>1. Bentuk</h4><p><b>I → myself; you → yourself; he → himself; she → herself; it → itself; we → ourselves; you (jamak) → yourselves; they → themselves.</b> Ingat: <b>-self</b> tunggal, <b>-selves</b> jamak. ✘ hisself, theirselves, themself → ✔ himself, themselves.</p><h4>2. Kegunaan</h4><p><b>(a)</b> Apabila <u>subjek dan objek ialah orang yang sama</u>: <i>I cut myself (Saya terpotong diri sendiri). She looked at herself in the mirror (Dia memandang dirinya di cermin). The cat washed itself. They blamed themselves (Mereka menyalahkan diri sendiri).</i> <b>(b)</b> Selepas <i>by</i> bermaksud <u>bersendirian</u> atau <u>tanpa bantuan</u>: <i>He lives by himself (Dia tinggal seorang diri).</i> <b>(c)</b> Untuk penekanan: <i>I made it myself (Saya sendiri yang membuatnya). Who made the cake? I myself did.</i></p><h4>3. Frasa lazim</h4><p><i>Enjoy yourself! (Berseronoklah!) Help yourself! (Jemput ambil sendiri!) Behave yourself! (Berkelakuan baik!) Teach yourself (Belajar sendiri).</i></p><h4>4. Kata kerja yang tidak memerlukan refleksif</h4><p>Dalam Bahasa Inggeris, kata kerja seperti <b>wash, shave, dress, relax, feel, meet, hide</b> selalunya tiada refleksif: <i>He shaved quickly. I feel tired.</i> (✘ I feel myself tired.) Dalam Bahasa Melayu "diri" sering ditambah, tetapi tidak dalam Bahasa Inggeris.</p><h4>5. Refleksif atau each other?</h4><p><b>each other / one another</b> = dua orang atau lebih melakukan perbuatan yang sama sesama sendiri: <i>They looked at each other (Mereka saling memandang).</i> Tidak sama dengan <i>They looked at themselves</i> (masing-masing memandang diri sendiri).</p>`,
q:[["I cut ___ with a knife.",["me","myself","my","mine"],1],["She looked at ___ in the mirror.",["her","herself","she","hers"],1],["They enjoyed ___ at the party.",["them","theirselves","themselves","themself"],2],["He lives by ___. (alone)",["him","himself","hisself","his own"],1],["Which is correct?",["hisself","himself","hiself","himselves"],1],["We taught ___ to swim.",["us","ourselves","ourself","our"],1],["'I made it myself' means:",["I did it without help","I am selfish","I hurt myself","I talked to me"],0],["The plural of 'yourself' is:",["yourselfs","yourselves","yourself","your selves"],1],["Which sentence is natural?",["He shaved himself quickly.","He shaved quickly.","He shaved him quickly.","He shaved he quickly."],1],["The cat washed ___.",["it","itself","its","itselfs"],1],["'each other' is used when:",["two people do the same action to one another","the subject is alone","emphasising","it is a reflexive pronoun"],0],["They blamed ___ for the accident.",["themselves","them","their","theirs"],0],["Who made the cake? I ___ did.",["me","myself","mine","my"],1],["Which is correct?",["Enjoy you!","Enjoy yourself!","Enjoy yourselve!","Enjoy your!"],1],["A reflexive pronoun is used when:",["subject and object are the same","subject and object are different","there is no object","the verb is passive"],0]]},
{t:["Relative Clauses: Defining","Klausa Relatif: Tentu (Defining)"],
en:`<h4>1. What is a defining relative clause?</h4><p>A clause that gives <b>essential information</b> to identify which person or thing we mean. Without it the sentence is unclear. It is <b>not</b> separated by commas: <i>The woman who lives next door is a teacher.</i> (which woman? the one next door)</p><h4>2. Relative pronouns</h4><table><tr><th>Word</th><th>Used for</th><th>Example</th></tr><tr><td><b>who / that</b></td><td>people</td><td>The man who lives here is kind.</td></tr><tr><td><b>which / that</b></td><td>things</td><td>The book which I bought is interesting.</td></tr><tr><td><b>whose</b></td><td>possession</td><td>That's the boy whose bike was stolen.</td></tr><tr><td><b>where</b></td><td>places</td><td>This is the shop where I bought my shoes.</td></tr><tr><td><b>when</b></td><td>times</td><td>I remember the day when we met.</td></tr></table><h4>3. Omitting the pronoun</h4><p>You can leave out <b>who / which / that</b> only when it is the <u>object</u> of the clause: <i>The car (that) I bought is red.</i> You cannot leave it out when it is the <u>subject</u>: <i>The man who lives here is kind</i> (✘ The man lives here is kind).</p><h4>4. Use "that" after</h4><p><i>all, everything, nothing, something</i> and superlatives: <i>Everything that he said was true.</i></p><h4>5. Common mistakes</h4><p>✘ The book which I read <b>it</b> was good → ✔ The book which I read was good (do not repeat the object). ✘ The man who he lives here → ✔ The man who lives here. ✘ which for people → ✔ who / that.</p>`,
bm:`<h4>1. Apakah klausa relatif tentu?</h4><p>Klausa yang memberi <b>maklumat penting</b> untuk mengenal pasti orang atau benda yang dimaksudkan. Tanpanya ayat tidak jelas. Ia <b>tidak</b> dipisahkan dengan koma: <i>The woman who lives next door is a teacher</i> (Wanita yang tinggal sebelah rumah itu seorang guru). Wanita yang mana? Yang tinggal sebelah rumah.</p><h4>2. Kata ganti relatif</h4><p><b>who / that</b> = untuk orang (yang): <i>The man who lives here is kind.</i> <b>which / that</b> = untuk benda: <i>The book which I bought is interesting.</i> <b>whose</b> = kepunyaan (yang … nya): <i>That's the boy whose bike was stolen (Itulah budak lelaki yang basikalnya dicuri).</i> <b>where</b> = tempat: <i>This is the shop where I bought my shoes.</i> <b>when</b> = masa: <i>I remember the day when we met.</i></p><h4>3. Menghilangkan kata ganti</h4><p>Anda boleh menghilangkan <b>who / which / that</b> hanya apabila ia ialah <u>objek</u> dalam klausa: <i>The car (that) I bought is red.</i> Anda tidak boleh menghilangkannya apabila ia ialah <u>subjek</u>: <i>The man who lives here is kind</i> (✘ The man lives here is kind).</p><h4>4. Guna "that" selepas</h4><p><i>all, everything, nothing, something</i> dan superlatif: <i>Everything that he said was true.</i></p><h4>5. Kesilapan lazim</h4><p>Dalam Bahasa Melayu "yang" mudah digunakan, tetapi dalam Bahasa Inggeris jangan ulang objek: ✘ The book which I read <b>it</b> was good → ✔ The book which I read was good. ✘ The man who he lives here → ✔ The man who lives here. ✘ which untuk orang → ✔ who / that.</p>`,
q:[["The woman ___ lives next door is a teacher.",["who","which","whose","where"],0],["The book ___ I bought is interesting.",["who","which","whose","where"],1],["That's the boy ___ bike was stolen.",["who","which","whose","that"],2],["This is the shop ___ I bought my shoes.",["where","who","whose","which"],0],["I remember the day ___ we met.",["when","where","who","whose"],0],["Which is correct?",["The man who he lives here is kind.","The man who lives here is kind.","The man which lives here is kind.","The man whose lives here is kind."],1],["In 'The car that I bought is red', 'that' can be:",["omitted","replaced by whose","replaced by where","replaced by who"],0],["In 'The man who lives here is kind', can 'who' be omitted?",["yes","no","only in writing","only in speech"],1],["Which can replace 'who' for people in defining clauses?",["that","where","whose","when"],0],["Defining relative clauses ___ commas.",["use","don't use","need two","need one"],1],["Everything ___ he said was true.",["that","who","whose","where"],0],["The teacher ___ class I like is Mr Lim.",["who","whose","which","that"],1],["Which is correct?",["The book which I read it was good.","The book which I read was good.","The book who I read was good.","The book whose I read was good."],1],["'Where' refers to:",["a place","a person","a time","a thing"],0],["A defining clause gives:",["essential information","extra information","a question","a command"],0]]},
{t:["Relative Clauses: Non-defining","Klausa Relatif: Tidak Tentu (Non-defining)"],
