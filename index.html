bm:`<h4>1. Ayat it-cleft</h4><p><b>It + be + fokus + who / that + klausa</b> meletakkan fokus utama pada satu bahagian: <i>It was John who broke the window (Johnlah yang memecahkan tingkap). It was in 2019 that we met (Pada tahun 2019 kami bertemu). It was last year that she moved.</i></p><h4>2. Ayat wh-cleft (pseudo-cleft)</h4><p><b>What / All / The thing / The reason + klausa + be + fokus:</b> <i>What I need is a holiday (Yang saya perlukan ialah cuti). All I want is some peace. The reason why I left is that I was bored.</i> <b>Wh-cleft terbalik:</b> <i>A holiday is what I need. The noise is what annoys me.</i></p><h4>3. Do / does / did untuk penekanan</h4><p>Guna <b>do / does / did + kata kerja asas</b> dalam ayat positif untuk menekankan atau menafikan: <i>I did tell you! (Saya memang sudah beritahu anda!) She does look tired today.</i></p><h4>4. Tekanan pada kata kerja bantu</h4><p>Dalam pertuturan, tekankan kata kerja bantu untuk menafikan: <i>"You haven't paid." – "I HAVE paid."</i></p><h4>5. Inversi untuk penekanan</h4><p><b>So + adjektif</b> atau <b>such</b> di permulaan: <i>So difficult was the exam that most students failed. Such was the force of the storm that trees fell.</i> <b>It was not until … that:</b> <i>It was not until midnight that the storm stopped.</i> (Inversi selepas kata keterangan negatif dibincangkan dalam topik seterusnya.)</p><h4>6. Kesilapan lazim</h4><p>✘ What I need it is a holiday → ✔ What I need is a holiday. ✘ The reason is because → ✔ The reason is that. ✘ It was John what broke it → ✔ who / that.</p>`,
q:[["___ was John who broke the window.",["It","That","There","What"],0],["___ I need is a holiday.",["What","That","It","Which"],0],["'I did tell you!' The word 'did' gives:",["emphasis","past perfect","a question","a negative"],0],["All I want ___ some peace.",["is","are","do","does"],0],["Which is a cleft sentence?",["It was in 2019 that we met.","We met in 2019.","Did we meet in 2019?","Meet in 2019."],0],["She ___ look tired today. (emphatic)",["does","do","did","is"],0],["So difficult ___ the exam that most students failed.",["was","did","had","were"],0],["Such ___ the force of the storm that trees fell.",["was","were","did","had"],0],["'What annoys me is the noise' is:",["a wh-cleft","a question","a passive","a conditional"],0],["'The noise is what annoys me' is:",["a reversed wh-cleft","a command","a tag question","a negative"],0],["Which sentence emphasises the time?",["It was last year that she moved.","She moved last year.","Last year moved she.","Did she move last year?"],0],["'I HAVE paid' (stress on 'have') shows:",["contradiction of a previous statement","a question","a future","a result"],0],["It was not until midnight ___ the storm stopped.",["that","which","what","did"],0],["Which is correct?",["What I need is a holiday.","What I need it is a holiday.","That I need is a holiday.","What I need, is it a holiday."],0],["The reason why I left is ___ I was bored.",["that","because","for","as"],0]]},
{t:["C1 · Inversion after Negative Adverbials","C1 · Inversi selepas Kata Keterangan Negatif"],
en:`<h4>1. The rule</h4><p>In formal or literary English, a <b>negative or restrictive adverbial</b> placed at the <u>start</u> of a sentence for emphasis is followed by <b>inversion</b>: <b>auxiliary + subject + main verb</b>. If there is no auxiliary, use <b>do / does / did</b>.</p><div class="eg">Never <b>have I seen</b> such a beautiful view. (= I have never seen…)</div><h4>2. Common adverbials</h4><table><tr><th>Adverbial</th><th>Example</th></tr><tr><td>Never, rarely, seldom, nowhere</td><td>Rarely do we see such honesty. Nowhere have I met such friendly people.</td></tr><tr><td>Little</td><td>Little did she know what awaited her.</td></tr><tr><td>Hardly / scarcely … <b>when</b></td><td>Hardly had I sat down when the phone rang.</td></tr><tr><td>No sooner … <b>than</b></td><td>No sooner had she left than it started to rain.</td></tr><tr><td>Not only … but (also)</td><td>Not only did he arrive late, but he was also rude.</td></tr><tr><td>Under no circumstances, on no account, at no time, in no way</td><td>Under no circumstances should you open the door. At no time was the manager informed.</td></tr><tr><td>Only after / only when / only then / only if</td><td>Only after the meeting did she realise her mistake.</td></tr><tr><td>Not until / not since</td><td>Not until midnight did the storm stop.</td></tr></table><h4>3. Points to watch</h4><p><b>(a)</b> Hardly / scarcely take <i>when</i>; no sooner takes <i>than</i> (✘ no sooner … when). <b>(b)</b> With <i>hardly, no sooner</i> the first clause uses the <b>past perfect</b> (<i>had I sat</i>). <b>(c)</b> Inversion happens only in the clause that follows the adverbial; the second clause has normal order. <b>(d)</b> In <i>not only … but also</i>, only the first clause is inverted.</p><h4>4. Common mistakes</h4><p>✘ Never I have seen → ✔ Never have I seen. ✘ Hardly had I sat down than → ✔ when. ✘ Rarely we see → ✔ Rarely do we see.</p>`,
bm:`<h4>1. Peraturan</h4><p>Dalam Bahasa Inggeris formal atau sastera, <b>kata keterangan negatif atau terhad</b> yang diletakkan di <u>permulaan</u> ayat untuk penekanan diikuti oleh <b>inversi</b>: <b>kata kerja bantu + subjek + kata kerja utama</b>. Jika tiada kata kerja bantu, guna <b>do / does / did</b>.</p><div class="eg">Never <b>have I seen</b> such a beautiful view. (= I have never seen… Tidak pernah saya melihat pemandangan seindah ini.)</div><h4>2. Kata keterangan lazim</h4><p><b>Never, rarely, seldom, nowhere</b> (tidak pernah, jarang, tiada di mana-mana): <i>Rarely do we see such honesty. Nowhere have I met such friendly people.</i> <b>Little:</b> <i>Little did she know what awaited her (Dia langsung tidak tahu apa yang menantinya).</i> <b>Hardly / scarcely … when</b> (baru sahaja … apabila): <i>Hardly had I sat down when the phone rang.</i> <b>No sooner … than:</b> <i>No sooner had she left than it started to rain.</i> <b>Not only … but (also):</b> <i>Not only did he arrive late, but he was also rude.</i> <b>Under no circumstances, on no account, at no time, in no way</b> (dalam keadaan apa pun tidak): <i>Under no circumstances should you open the door. At no time was the manager informed.</i> <b>Only after / only when / only then / only if</b> (hanya selepas…): <i>Only after the meeting did she realise her mistake.</i> <b>Not until / not since</b> (hanya apabila… barulah): <i>Not until midnight did the storm stop.</i></p><h4>3. Perkara yang perlu diperhatikan</h4><p><b>(a)</b> Hardly / scarcely mengambil <i>when</i>; no sooner mengambil <i>than</i> (✘ no sooner … when). <b>(b)</b> Dengan <i>hardly, no sooner</i> klausa pertama menggunakan <b>past perfect</b> (<i>had I sat</i>). <b>(c)</b> Inversi berlaku hanya dalam klausa yang mengikuti kata keterangan; klausa kedua mengikut susunan biasa. <b>(d)</b> Dalam <i>not only … but also</i>, hanya klausa pertama yang diinversikan.</p><h4>4. Kesilapan lazim</h4><p>✘ Never I have seen → ✔ Never have I seen. ✘ Hardly had I sat down than → ✔ when. ✘ Rarely we see → ✔ Rarely do we see.</p>`,
q:[["Never ___ such a beautiful view.",["I have seen","have I seen","I saw","did I seen"],1],["Hardly ___ sat down when the phone rang.",["I had","had I","did I","I have"],1],["No sooner had she left ___ it started to rain.",["when","than","that","then"],1],["Not only ___ late, but he was also rude.",["he was","was he","did he arrive","he arrived"],2],["Under no circumstances ___ the door.",["you should open","should you open","you open","do you opened"],1],["Little ___ she know what awaited her.",["did","does","has","is"],0],["Only after the meeting ___ she realise her mistake.",["did","does","had","was"],0],["Rarely ___ such honesty.",["we see","do we see","we do see","see we do"],1],["Not until midnight ___ the storm stop.",["did","does","had","was"],0],["Which is correct?",["Seldom have I met such a generous person.","Seldom I have met such a generous person.","Seldom I met such a generous person.","Seldom do I have met such a generous person."],0],["Hardly had he arrived ___ the meeting began.",["when","than","that","as"],0],["Which is correct?",["On no account should you tell anyone.","On no account you should tell anyone.","On no account tell you anyone should.","On no account do you should tell anyone."],0],["Inversion after negative adverbials is:",["formal and emphatic","informal only","used in questions only","used in speech only"],0],["At no time ___ the manager informed.",["was","did","had","has"],0],["Nowhere ___ such friendly people.",["have I met","I have met","I met","did I have met"],0]]},
{t:["C1 · Inversion and Conditionals","C1 · Inversi dan Ayat Bersyarat"],
en:`<h4>1. Formal conditionals without if</h4><p>In formal English the word <b>if</b> can be left out and the auxiliary moved before the subject. There are three common patterns.</p><table><tr><th>Inversion</th><th>Equivalent with if</th><th>Example</th></tr><tr><td><b>Should + subject + base verb</b></td><td>If + present (possible or polite)</td><td>Should you need help, call me. Should it rain tomorrow, the match will be cancelled.</td></tr><tr><td><b>Were + subject (+ to + base verb)</b></td><td>If + past (unreal present or future)</td><td>Were I you, I would apologise. Were the government to raise taxes, people would protest.</td></tr><tr><td><b>Had + subject + past participle</b></td><td>If + past perfect (unreal past)</td><td>Had I known, I would have helped.</td></tr></table><h4>2. Negatives</h4><p>Do not contract: put <b>not</b> after the subject. <i>Had I not been ill, I would have gone.</i> (✘ Hadn't I been ill.) <b>Were it not for / Had it not been for</b> mean <i>but for / without</i>: <i>Were it not for your help, we would fail. Had it not been for your help, we would have failed.</i></p><h4>3. Mixed conditionals</h4><p>Inversion also works with mixed forms: <i>Had I studied medicine, I would be a doctor now.</i></p><h4>4. Restrictions</h4><p><b>unless</b> cannot be inverted. Do not combine inversion with <i>if</i> (✘ If had I known). After inversion, keep the normal result clause (<i>would, will, call</i>).</p><h4>5. Style</h4><p>Inversion sounds formal: <i>Should you wish to complain, please write to the manager.</i> It is common in business letters, notices and writing.</p><h4>6. Common mistakes</h4><p>✘ Had I would known → ✔ Had I known. ✘ Should anyone to call → ✔ Should anyone call. ✘ Were he will come → ✔ Were he to come.</p>`,
bm:`<h4>1. Ayat bersyarat formal tanpa if</h4><p>Dalam Bahasa Inggeris formal perkataan <b>if</b> boleh ditinggalkan dan kata kerja bantu dipindahkan sebelum subjek. Tiga pola lazim:</p><p><b>Should + subjek + kata kerja asas</b> (= if + kala kini; mungkin atau sopan): <i>Should you need help, call me (Jika anda perlukan bantuan, hubungi saya). Should it rain tomorrow, the match will be cancelled.</i></p><p><b>Were + subjek (+ to + kata kerja asas)</b> (= if + kala lampau; keadaan tidak benar masa kini atau depan): <i>Were I you, I would apologise (Jika saya anda, saya akan memohon maaf). Were the government to raise taxes, people would protest.</i></p><p><b>Had + subjek + past participle</b> (= if + past perfect; masa lampau tidak benar): <i>Had I known, I would have helped (Jika saya tahu, saya sudah membantu).</i></p><h4>2. Negatif</h4><p>Jangan guna singkatan: letakkan <b>not</b> selepas subjek. <i>Had I not been ill, I would have gone.</i> (✘ Hadn't I been ill.) <b>Were it not for / Had it not been for</b> bermaksud <i>kalau bukan kerana</i>: <i>Were it not for your help, we would fail. Had it not been for your help, we would have failed (Kalau bukan kerana bantuan anda, kami sudah gagal).</i></p><h4>3. Conditional campuran</h4><p>Inversi juga berfungsi dengan bentuk campuran: <i>Had I studied medicine, I would be a doctor now.</i></p><h4>4. Sekatan</h4><p><b>unless</b> tidak boleh diinversikan. Jangan gabungkan inversi dengan <i>if</i> (✘ If had I known). Selepas inversi, kekalkan klausa keputusan biasa (<i>would, will, call</i>).</p><h4>5. Gaya</h4><p>Inversi kedengaran formal: <i>Should you wish to complain, please write to the manager.</i> Lazim dalam surat perniagaan, notis dan penulisan.</p><h4>6. Kesilapan lazim</h4><p>✘ Had I would known → ✔ Had I known. ✘ Should anyone to call → ✔ Should anyone call. ✘ Were he will come → ✔ Were he to come.</p>`,
q:[["___ you need help, call me.",["Should","Were","Had","Did"],0],["___ I you, I would apologise.",["Were","Had","Should","Did"],0],["___ I known, I would have helped.",["Had","Were","Should","Did"],0],["Which is the inverted form of 'If I had not been ill, I would have gone'?",["Had I not been ill, I would have gone.","Hadn't I been ill, I would have gone.","Were I not been ill, I would have gone.","Should I not been ill, I would have gone."],0],["'Should you wish to complain, write to the manager' is:",["formal","very informal","a question","about a past event"],0],["___ it not been for your help, we would have failed.",["Had","Were","Should","Did"],0],["___ the government to raise taxes, people would protest.",["Were","Had","Should","Did"],0],["Which word cannot be replaced by inversion?",["unless","if","if I had","if it were"],0],["Which is correct?",["Had I studied medicine, I would be a doctor now.","Had I would studied medicine, I would be a doctor now.","Hadn't I studied medicine, I would be a doctor now.","Did I studied medicine, I would be a doctor now."],0],["Inversion in conditionals replaces:",["if","because","although","when"],0],["Which is correct?",["Should anyone call, take a message.","Should anyone to call, take a message.","Anyone should call, take a message.","Should anyone calls, take a message."],0],["___ it rain tomorrow, the match will be cancelled.",["Should","Were","Had","Did"],0],["Which is correct?",["Had she not left early, she would have met him.","Hadn't she left early, she would have met him.","Had not left she early, she would have met him.","Not had she left early, she would have met him."],0],["'Were I to win the lottery, I would travel' refers to:",["an unlikely future","a past event","a habit","a fact"],0],["Which is correct?",["Were he here, he would help.","Was he here, he would help.","Be he here, he would help.","Is he here, he would help."],0]]},
{t:["C1 · Modals: Probability","C1 · Modal: Kebarangkalian"],
en:`<h4>1. Present and future</h4><table><tr><th>Certainty</th><th>Modal</th><th>Example</th></tr><tr><td>Almost certain</td><td>must, will, be bound to</td><td>That will be the postman. He is bound to win.</td></tr><tr><td>Expected</td><td>should, ought to, be likely to</td><td>The report should be ready by Friday.</td></tr><tr><td>Quite likely</td><td>may well, might well</td><td>She may well be right. The theory may well be correct.</td></tr><tr><td>Possible</td><td>may, might, could</td><td>It could be a mistake.</td></tr><tr><td>Possible, not certain not to happen</td><td>may not, might not</td><td>It may not rain.</td></tr><tr><td>Almost impossible</td><td>can't, couldn't, be unlikely to</td><td>You can't be joking!</td></tr></table><p><b>must</b> is used for deduction about the present or past, <u>not</u> for predicting the future (use <i>will</i> or <i>be bound to</i>). For a negative deduction use <b>can't / couldn't</b>, not <i>mustn't</i>.</p><h4>2. Continuous</h4><p><b>modal + be + -ing</b> for activities in progress: <i>They must be working late.</i> <b>modal + have been + -ing</b> for earlier activities: <i>They must have been waiting for hours. She might have been working late.</i></p><h4>3. Past: modal + have + past participle</h4><p><i>He can't have left; his coat is still here. She couldn't have seen him.</i> (= it was impossible) <i>They may / might / could have missed the train.</i> <b>could have</b> can also mean something possible that did not happen: <i>You could have been hurt.</i></p><h4>4. Choosing the strength</h4><p>The weakest is <i>might</i>, then <i>may / could</i>, then <i>should</i>, then <i>must / will</i>. Using <i>could</i> or <i>might</i> sounds more tentative and polite than <i>must</i>.</p><h4>5. Common mistakes</h4><p>✘ He mustn't be at home → ✔ He can't be at home. ✘ She might have working → ✔ might have been working.</p>`,
bm:`<h4>1. Masa kini dan masa depan</h4><p><b>Hampir pasti:</b> must, will, be bound to — <i>That will be the postman (Itu tentu posmen). He is bound to win.</i> <b>Dijangka:</b> should, ought to, be likely to — <i>The report should be ready by Friday.</i> <b>Agak berkemungkinan:</b> may well, might well — <i>She may well be right (Besar kemungkinan dia betul).</i> <b>Mungkin:</b> may, might, could — <i>It could be a mistake.</i> <b>Mungkin tidak:</b> may not, might not — <i>It may not rain.</i> <b>Hampir mustahil:</b> can't, couldn't, be unlikely to — <i>You can't be joking! (Anda pasti bergurau!)</i></p><p><b>must</b> digunakan untuk kesimpulan tentang masa kini atau lampau, <u>bukan</u> untuk meramalkan masa depan (guna <i>will</i> atau <i>be bound to</i>). Untuk kesimpulan negatif guna <b>can't / couldn't</b>, bukan <i>mustn't</i>.</p><h4>2. Berterusan</h4><p><b>modal + be + -ing</b> untuk aktiviti yang sedang berlaku: <i>They must be working late.</i> <b>modal + have been + -ing</b> untuk aktiviti terdahulu: <i>They must have been waiting for hours (Mereka tentu sudah menunggu berjam-jam). She might have been working late.</i></p><h4>3. Lampau: modal + have + past participle</h4><p><i>He can't have left; his coat is still here (Dia mustahil sudah pergi). She couldn't have seen him</i> (= mustahil). <i>They may / might / could have missed the train.</i> <b>could have</b> juga boleh bermaksud sesuatu yang mungkin tetapi tidak berlaku: <i>You could have been hurt (Anda boleh sahaja cedera).</i></p><h4>4. Memilih kekuatan</h4><p>Paling lemah ialah <i>might</i>, kemudian <i>may / could</i>, kemudian <i>should</i>, kemudian <i>must / will</i>. Menggunakan <i>could</i> atau <i>might</i> kedengaran lebih berhati-hati dan sopan daripada <i>must</i>.</p><h4>5. Kesilapan lazim</h4><p>✘ He mustn't be at home → ✔ He can't be at home. ✘ She might have working → ✔ might have been working.</p>`,
q:[["That ___ be the postman; he's usually here at nine.",["will","must","can't","shall"],0],["She ___ well be right. (quite likely)",["may","can","could not","will have"],0],["He ___ have left; his coat is still here.",["can't","mustn't","needn't","shan't"],0],["They ___ have been waiting for hours. (deduction)",["must","should","would","shall"],0],["The report ___ be ready by Friday. (expected)",["should","mustn't","can't","shan't"],0],["You ___ be joking! (impossible)",["can't","mustn't","won't","needn't"],0],["Which expresses the weakest probability?",["might","should","must","will"],0],["Which is correct?",["She might have been working late.","She might have working late.","She might had been working late.","She might be have working late."],0],["'The theory may well be correct' means:",["it is quite likely","it is impossible","it is forbidden","it was correct"],0],["'She couldn't have seen him' means:",["it was impossible","it was possible","it was necessary","it was likely"],0],["Which is the correct negative deduction?",["He can't be at home.","He mustn't be at home.","He doesn't must be at home.","He not must be at home."],0],["'He is bound to win' means:",["he will almost certainly win","he might win","he can't win","he is allowed to win"],0],["'It may not rain' means:",["it is possible it will not rain","it is impossible to rain","it must not rain","it can't rain"],0],["Which is more tentative: 'It could be a mistake' or 'It must be a mistake'?",["could","must","both are equal","neither"],0],["Which is correct?",["The meeting is likely to be postponed.","The meeting is likely postponed to be.","The meeting likely to be postponed is.","The meeting is likely being to postponed."],0]]},
{t:["C1 · Participle Clauses","C1 · Klausa Participle"],
en:`<h4>1. What are participle clauses?</h4><p>A participle clause uses an <b>-ing</b>, <b>-ed</b> or <b>having + -ed</b> form instead of a full clause. They make writing more compact and formal.</p><table><tr><th>Form</th><th>Meaning</th><th>Example</th></tr><tr><td><b>Present participle (-ing)</b></td><td>active; at the same time, or as a reason</td><td>Walking along the road, I saw an accident. Feeling ill, he went home.</td></tr><tr><td><b>Perfect participle (having + pp)</b></td><td>an earlier action</td><td>Having finished the exam, she went home.</td></tr><tr><td><b>Past participle (-ed)</b></td><td>passive or state</td><td>Built in 1850, the bridge is still used. Exhausted, he fell asleep.</td></tr><tr><td><b>Being + pp / having been + pp</b></td><td>passive</td><td>Having been warned, he took care.</td></tr><tr><td><b>Negative: not + participle</b></td><td>negative</td><td>Not knowing what to do, she called me. Not having seen the film, I can't comment.</td></tr></table><h4>2. After conjunctions and prepositions</h4><p><i>Before leaving, check the windows. While waiting, I read a book. Although tired, she carried on.</i></p><h4>3. Reduced relative clauses</h4><p><i>The man standing at the door</i> (= who is standing). <i>The book written by Orwell</i> (= which was written).</p><h4>4. Result: -ing</h4><p><i>The fire spread, destroying several houses.</i></p><h4>5. The same-subject rule</h4><p>The subject of the participle clause must be the <b>same as the subject of the main clause</b>. If not, the participle is <b>dangling</b>: ✘ Walking along the road, the rain started. → ✔ Walking along the road, I was caught in the rain.</p><h4>6. Common mistakes</h4><p>✘ Before to leave → ✔ Before leaving. ✘ Having not seeing → ✔ Not having seen.</p>`,
bm:`<h4>1. Apakah klausa participle?</h4><p>Klausa participle menggunakan bentuk <b>-ing</b>, <b>-ed</b> atau <b>having + -ed</b> sebagai ganti klausa penuh. Ia menjadikan penulisan lebih padat dan formal.</p><p><b>Present participle (-ing):</b> aktif; pada masa yang sama atau sebagai sebab: <i>Walking along the road, I saw an accident (Semasa berjalan di jalan, saya ternampak kemalangan). Feeling ill, he went home.</i> <b>Perfect participle (having + pp):</b> perbuatan lebih awal: <i>Having finished the exam, she went home (Selepas tamat peperiksaan, dia pulang).</i> <b>Past participle (-ed):</b> pasif atau keadaan: <i>Built in 1850, the bridge is still used (Dibina pada 1850, jambatan itu masih digunakan). Exhausted, he fell asleep.</i> <b>Being + pp / having been + pp:</b> pasif: <i>Having been warned, he took care.</i> <b>Negatif: not + participle:</b> <i>Not knowing what to do, she called me. Not having seen the film, I can't comment.</i></p><h4>2. Selepas kata hubung dan kata sendi</h4><p><i>Before leaving, check the windows. While waiting, I read a book. Although tired, she carried on.</i></p><h4>3. Klausa relatif yang dipendekkan</h4><p><i>The man standing at the door</i> (= who is standing). <i>The book written by Orwell</i> (= which was written).</p><h4>4. Hasil: -ing</h4><p><i>The fire spread, destroying several houses.</i></p><h4>5. Peraturan subjek yang sama</h4><p>Subjek klausa participle mesti <b>sama dengan subjek klausa utama</b>. Jika tidak, participle itu <b>tergantung (dangling)</b>: ✘ Walking along the road, the rain started. → ✔ Walking along the road, I was caught in the rain.</p><h4>6. Kesilapan lazim</h4><p>✘ Before to leave → ✔ Before leaving. ✘ Having not seeing → ✔ Not having seen.</p>`,
q:[["___ along the road, I saw an accident.",["Walking","Walked","To walk","Having walk"],0],["___ the exam, she went home.",["Having finished","Finished having","Be finishing","To finished"],0],["___ in 1850, the bridge is still used today.",["Built","Building","Having built","To build"],0],["Which sentence has a dangling participle?",["Walking along the road, the rain started.","Walking along the road, I saw a fox.","Having eaten, we left.","Tired, she slept."],0],["'The man standing at the door' = The man ___ is standing at the door.",["who","which","whose","where"],0],["___ what to do, she called me.",["Not knowing","Knowing not","Not to know","No knowing"],0],["'Having been warned, he took care.' 'Having been warned' is:",["a perfect passive participle (earlier action)","a gerund for a habit","present continuous","a modal"],0],["Which is correct?",["Before leaving, check the windows.","Before to leave, check the windows.","Before leave, check the windows.","Before left, check the windows."],0],["'Exhausted, he fell asleep.' 'Exhausted' is:",["a past participle showing state or cause","a noun","an infinitive","a present participle"],0],["The fire spread, ___ several houses.",["destroying","destroyed","to destroying","destroy"],0],["___ ill, he went home early.",["Feeling","Felt","To feel","Having feel"],0],["The subject of a participle clause must usually be:",["the same as the main clause subject","different from it","always omitted","plural"],0],["The book ___ by Orwell is a classic.",["written","writing","wrote","to write"],0],["___ the news, she burst into tears.",["Hearing","Heard","To hear","Having hearing"],0],["Which is correct?",["Not having seen the film, I can't comment.","Having not seeing the film, I can't comment.","Not seeing have the film, I can't comment.","Not to have seen the film, I can't comment."],0]]},
{t:["C1 · Patterns with Reporting Verbs","C1 · Pola Kata Kerja Pelapor"],
en:`<h4>1. Choose the verb by its pattern</h4><table><tr><th>Pattern</th><th>Verbs</th><th>Example</th></tr><tr><td>verb + <b>that</b> clause</td><td>admit, claim, suggest, insist, maintain, point out, deny, propose</td><td>He claimed that he was innocent. The manager proposed that the meeting be postponed.</td></tr><tr><td>verb + object + <b>that</b> clause</td><td>assure, convince, persuade, warn, inform, remind, tell</td><td>She assured me that everything was fine.</td></tr><tr><td>verb + <b>to-infinitive</b></td><td>agree, offer, promise, refuse, threaten, demand, claim</td><td>She refused to apologise.</td></tr><tr><td>verb + object + <b>to-infinitive</b></td><td>advise, ask, beg, encourage, invite, order, urge, warn, forbid, remind, persuade</td><td>They urged us to leave immediately. She encouraged him to apply.</td></tr><tr><td>verb + <b>-ing</b></td><td>admit, deny, suggest, recommend, mention, regret</td><td>He admitted breaking the window. He suggested going by train.</td></tr><tr><td>verb + (object +) <b>preposition + -ing</b></td><td>apologise for, accuse … of, blame … for, congratulate … on, insist on, criticise … for, confess to, object to</td><td>She apologised for being late. They accused the minister of lying. He confessed to taking the money.</td></tr></table><h4>2. suggest, insist, demand, recommend</h4><p>These can be followed by <b>that + (should) + base verb</b> (a subjunctive): <i>He suggested that she (should) apply. The doctor recommended that I take more rest.</i> <b>suggest</b> is never followed by object + to-infinitive.</p><h4>3. Say, tell, explain</h4><p><b>tell + person</b>; <b>say / explain</b> take <b>to + person</b>: <i>He explained the problem to me.</i> ✘ explained me the problem.</p><h4>4. Common mistakes</h4><p>✘ He suggested me to go → ✔ He suggested going / that I go. ✘ He admitted to do it → ✔ admitted doing it. ✘ She blamed him of the delay → ✔ for.</p>`,
bm:`<h4>1. Pilih kata kerja mengikut polanya</h4><p><b>verb + klausa that:</b> admit (mengaku), claim (mendakwa), suggest, insist (berkeras), maintain (menegaskan), point out (menunjukkan), deny, propose (mencadangkan): <i>He claimed that he was innocent. The manager proposed that the meeting be postponed.</i></p><p><b>verb + objek + klausa that:</b> assure (meyakinkan), convince, persuade, warn, inform, remind, tell: <i>She assured me that everything was fine.</i></p><p><b>verb + to-infinitif:</b> agree, offer, promise, refuse, threaten, demand (menuntut), claim: <i>She refused to apologise.</i></p><p><b>verb + objek + to-infinitif:</b> advise, ask, beg (merayu), encourage (menggalakkan), invite, order, urge (mendesak), warn, forbid (melarang), remind, persuade: <i>They urged us to leave immediately (Mereka mendesak kami pergi segera). She encouraged him to apply.</i></p><p><b>verb + -ing:</b> admit, deny, suggest, recommend, mention, regret: <i>He admitted breaking the window. He suggested going by train.</i></p><p><b>verb + (objek +) kata sendi + -ing:</b> apologise for (memohon maaf kerana), accuse … of (menuduh … melakukan), blame … for (menyalahkan … kerana), congratulate … on (mengucapkan tahniah atas), insist on (berkeras mahu), criticise … for (mengkritik … kerana), confess to (mengaku), object to (membantah): <i>She apologised for being late. They accused the minister of lying. He confessed to taking the money.</i></p><h4>2. suggest, insist, demand, recommend</h4><p>Ini boleh diikuti oleh <b>that + (should) + kata kerja asas</b> (subjunctive): <i>He suggested that she (should) apply. The doctor recommended that I take more rest.</i> <b>suggest</b> tidak pernah diikuti objek + to-infinitif.</p><h4>3. Say, tell, explain</h4><p><b>tell + orang</b>; <b>say / explain</b> mengambil <b>to + orang</b>: <i>He explained the problem to me.</i> ✘ explained me the problem.</p><h4>4. Kesilapan lazim</h4><p>✘ He suggested me to go → ✔ He suggested going / that I go. ✘ He admitted to do it → ✔ admitted doing it. ✘ She blamed him of the delay → ✔ for.</p>`,
q:[["She ___ him of stealing the money.",["accused","blamed","criticised","denied"],0],["He insisted ___ paying for the meal.",["on","to","at","about"],0],["They ___ us to leave immediately.",["urged","suggested","admitted","recommended"],0],["The doctor recommended ___ more rest.",["taking","to take","me to take","for taking"],0],["He ___ that she (should) apply for the job.",["suggested","persuaded","advised","warned"],0],["She ___ for being late.",["apologised","admitted","refused","blamed"],0],["Which is correct?",["He explained the problem to me.","He explained me the problem.","He explained me about the problem.","He explained to me about problem."],0],["They ___ the minister of lying.",["accused","blamed","criticised","suggested"],0],["He admitted ___ the window.",["breaking","to break","break","for breaking"],0],["'I'll never do it,' he said. → He ___ to do it.",["refused","suggested","denied","reminded"],0],["She ___ him to apply.",["encouraged","suggested","admitted","mentioned"],0],["The manager ___ that the meeting be postponed.",["proposed","persuaded","ordered him","warned"],0],["He confessed ___ the money.",["to taking","to take","taking to","for taking"],0],["She blamed him ___ the delay.",["for","of","on","about"],0],["Which is correct?",["He suggested going by train.","He suggested me to go by train.","He suggested to go by train.","He suggested me going by train."],0]]},
{t:["C1 · Possession and Noun Modifiers","C1 · Kepunyaan dan Pengubah Suai Kata Nama"],
en:`<h4>1. 's or of?</h4><p><b>'s / s'</b> for people, animals, organisations, places and time: <i>Ali's car, the company's profits, Malaysia's economy, yesterday's news, a week's holiday, two weeks' notice.</i> <b>of</b> for things: <i>the roof of the house, the end of the road.</i></p><h4>2. Double genitive</h4><p><b>a … of + possessive:</b> <i>a friend of mine, a friend of Ali's.</i> It means one of several friends.</p><h4>3. Group genitive</h4><p>Add 's to the last word: <i>the Queen of England's crown; Ali and Siti's house</i> (one house shared).</p><h4>4. Noun + noun</h4><p>The first noun <b>classifies</b> the second: <i>a school bus, a bus stop, a chicken sandwich.</i> The first noun is normally <b>singular</b>, even for measurements: <i>a three-hour journey, a ten-pound note</i> (✘ a three-hours journey). Compare: <i>The journey is three hours long.</i></p><h4>5. Order of adjectives</h4><p><b>opinion – size – age – shape – colour – origin – material – purpose + noun.</b> <i>a lovely old brick house; a small round black plastic box; a beautiful large Chinese silk scarf.</i></p><h4>6. Compound adjectives</h4><p>Hyphenate when they come before a noun: <i>a well-known author, a long-term plan, a two-year contract.</i> (without hyphen after the noun: <i>The author is well known.</i>)</p><h4>7. own</h4><p><i>my own car</i>, or <i>a car of my own</i>.</p><h4>8. Common mistakes</h4><p>✘ a three-hours journey → ✔ a three-hour journey. ✘ the Malaysia's economy → ✔ Malaysia's economy. ✘ a brick old house → ✔ an old brick house.</p>`,
bm:`<h4>1. 's atau of?</h4><p><b>'s / s'</b> untuk orang, haiwan, organisasi, tempat dan masa: <i>Ali's car, the company's profits, Malaysia's economy, yesterday's news, a week's holiday, two weeks' notice.</i> <b>of</b> untuk benda: <i>the roof of the house, the end of the road.</i></p><h4>2. Genitif berganda</h4><p><b>a … of + kata kepunyaan:</b> <i>a friend of mine (seorang kawan saya), a friend of Ali's.</i> Bermaksud seorang daripada beberapa orang kawan.</p><h4>3. Genitif kumpulan</h4><p>Tambah 's pada perkataan terakhir: <i>the Queen of England's crown; Ali and Siti's house</i> (satu rumah yang dikongsi).</p><h4>4. Kata nama + kata nama</h4><p>Kata nama pertama <b>mengelaskan</b> yang kedua: <i>a school bus, a bus stop, a chicken sandwich.</i> Kata nama pertama biasanya <b>tunggal</b>, walaupun untuk ukuran: <i>a three-hour journey (perjalanan tiga jam), a ten-pound note</i> (✘ a three-hours journey). Bandingkan: <i>The journey is three hours long.</i></p><h4>5. Susunan adjektif</h4><p><b>pendapat – saiz – umur – bentuk – warna – asal – bahan – tujuan + kata nama.</b> <i>a lovely old brick house (rumah batu bata lama yang cantik); a small round black plastic box; a beautiful large Chinese silk scarf.</i></p><h4>6. Adjektif majmuk</h4><p>Letak tanda sempang apabila berada sebelum kata nama: <i>a well-known author, a long-term plan, a two-year contract.</i> (tanpa sempang selepas kata nama: <i>The author is well known.</i>)</p><h4>7. own</h4><p><i>my own car</i>, atau <i>a car of my own</i>.</p><h4>8. Kesilapan lazim</h4><p>✘ a three-hours journey → ✔ a three-hour journey. ✘ the Malaysia's economy → ✔ Malaysia's economy. ✘ a brick old house → ✔ an old brick house.</p>`,
q:[["Which is correct?",["a three-hour journey","a three-hours journey","a three hour's journey","a three hours' journey"],0],["a friend ___ mine",["of","at","to","from"],0],["the roof ___ the house",["of","'s","at","by"],0],["Which order is correct?",["a lovely old brick house","a brick old lovely house","an old lovely brick house","a house lovely brick old"],0],["Which is correct?",["a ten-pound note","a ten-pounds note","a ten pound's note","a ten pounds' note"],0],["In 'a school bus', the first noun 'school':",["classifies the second noun","shows possession","is a verb","is plural"],0],["Which is correct?",["Malaysia's economy","the economy Malaysia","Malaysia economy of","the Malaysia's of economy"],0],["In 'two weeks' notice', the apostrophe comes after the s because:",["the noun of time is plural","a person owns it","it is a contraction","it is a mistake"],0],["Which is correct?",["a well-known author","a well known authors","a known-well author","an author well-known"],0],["Which is correct?",["my own car","my car own","own my car","my owned car"],0],["'Ali and Siti's house' means:",["one house they share","two separate houses","Siti's house only","Ali's house only"],0],["'A friend of Ali's' is:",["a double genitive","a passive","a compound","a question"],0],["Which is correct?",["yesterday's news","yesterday news's","news of yesterday's","yesterdays' news"],0],["Which adjective order is correct?",["a small round black plastic box","a plastic black round small box","a black small round plastic box","a round small black plastic box"],0],["Which is correct?",["a long-term plan","a long-terms plan","a long term's plan","a plan long-term"],0]]},
{t:["C1 · Unreal Time","C1 · Masa Tidak Nyata (Unreal Time)"],
en:`<h4>1. The idea</h4><p>In English we often use a <b>past tense</b> to talk about the <b>present or future</b> when the situation is <u>unreal, imagined or unlikely</u>. The past form signals distance from reality, not past time.</p><table><tr><th>Structure</th><th>Meaning</th><th>Example</th></tr><tr><td><b>It's time / high time / about time + past simple</b></td><td>something should be done now</td><td>It's high time we left. It's about time you found a job.</td></tr><tr><td><b>would rather + subject + past simple</b></td><td>preference about someone else's present or future action</td><td>I'd rather you didn't smoke in here. I'd rather you stayed.</td></tr><tr><td><b>would rather + subject + past perfect</b></td><td>regret about someone else's past action</td><td>I'd rather you hadn't told her.</td></tr><tr><td><b>suppose / supposing / imagine / what if + past simple</b></td><td>an unlikely or hypothetical situation</td><td>Suppose you won the lottery, what would you do? What if we were late?</td></tr><tr><td><b>as if / as though + past simple</b></td><td>the situation is unreal</td><td>He talks as if he knew everything. She acts as though she were the manager.</td></tr><tr><td><b>wish / if only + past simple or past perfect</b></td><td>present regret / past regret</td><td>I wish I had more time. If only I had gone.</td></tr></table><h4>2. Important points</h4><p><b>(a)</b> With <b>would rather</b> and the <u>same subject</u> use the base verb: <i>I'd rather stay at home.</i> With a <u>different subject</u> use the past tense: <i>I'd rather you stayed.</i> <b>(b)</b> <b>It's time + to-infinitive</b> is a general statement: <i>It's time to go.</i> <b>It's time + subject + past</b> shows urgency or criticism. <b>(c)</b> Use <b>were</b> for all persons in formal style. <b>(d)</b> If the situation is <u>real</u>, use the present: <i>He looks as if he is ill</i> (he probably is).</p><h4>3. Common mistakes</h4><p>✘ It's time we go → ✔ It's time we went. ✘ I'd rather you to stay → ✔ I'd rather you stayed. ✘ I wish I would have gone → ✔ I wish I had gone.</p>`,
bm:`<h4>1. Idea utama</h4><p>Dalam Bahasa Inggeris kita sering menggunakan <b>kala lampau</b> untuk bercakap tentang <b>masa kini atau masa depan</b> apabila keadaan itu <u>tidak nyata, dibayangkan atau kecil kemungkinan</u>. Bentuk lampau menunjukkan jarak daripada realiti, bukan masa lampau.</p><p><b>It's time / high time / about time + past simple</b> (sudah tiba masanya): <i>It's high time we left (Sudah sampai masanya kita pergi). It's about time you found a job.</i></p><p><b>would rather + subjek + past simple</b> (lebih suka orang lain berbuat sesuatu sekarang atau akan datang): <i>I'd rather you didn't smoke in here (Saya lebih suka anda tidak merokok di sini). I'd rather you stayed.</i></p><p><b>would rather + subjek + past perfect</b> (kekesalan tentang perbuatan lampau orang lain): <i>I'd rather you hadn't told her.</i></p><p><b>suppose / supposing / imagine / what if + past simple</b> (keadaan hipotesis): <i>Suppose you won the lottery, what would you do? (Andaikan anda menang loteri, apa yang anda akan buat?) What if we were late?</i></p><p><b>as if / as though + past simple</b> (seolah-olah; keadaan tidak nyata): <i>He talks as if he knew everything. She acts as though she were the manager.</i></p><p><b>wish / if only + past simple atau past perfect:</b> <i>I wish I had more time. If only I had gone.</i></p><h4>2. Perkara penting</h4><p><b>(a)</b> Dengan <b>would rather</b> dan <u>subjek yang sama</u> guna kata kerja asas: <i>I'd rather stay at home.</i> Dengan <u>subjek berbeza</u> guna kala lampau: <i>I'd rather you stayed.</i> <b>(b)</b> <b>It's time + to-infinitif</b> ialah pernyataan umum: <i>It's time to go.</i> <b>It's time + subjek + lampau</b> menunjukkan desakan atau kritikan. <b>(c)</b> Guna <b>were</b> untuk semua subjek dalam gaya formal. <b>(d)</b> Jika keadaan itu <u>benar</u>, guna kala kini: <i>He looks as if he is ill</i> (dia mungkin memang sakit).</p><h4>3. Kesilapan lazim</h4><p>✘ It's time we go → ✔ It's time we went. ✘ I'd rather you to stay → ✔ I'd rather you stayed. ✘ I wish I would have gone → ✔ I wish I had gone.</p>`,
q:[["It's high time we ___.",["left","leave","had left","will leave"],0],["I'd rather you ___ in here.",["didn't smoke","don't smoke","wouldn't smoke","won't smoke"],0],["Suppose you ___ the lottery, what would you do?",["won","win","will win","would win"],0],["He talks as if he ___ everything.",["knew","knows","would know","has knew"],0],["I'd rather you ___ told her. (past regret)",["hadn't","didn't","wouldn't","haven't"],0],["It's about time you ___ a job.",["found","find","will find","to find"],0],["'I'd rather stay at home.' With the same subject, would rather takes:",["the base verb","past simple","past perfect","-ing"],0],["What if we ___ late? (unreal future)",["were","are","will be","had be"],0],["She looks as if she ___ ill. (it seems true now)",["is","would be","had been","were being"],0],["Which is correct?",["It's time we went home.","It's time we go home.","It's time we will go home.","It's time we to go home."],0],["'I wish I had gone' refers to:",["a past regret","a present wish","a future plan","a habit"],0],["'I'd rather you hadn't come' refers to:",["the past","the present","the future","a habit"],0],["Which is correct?",["I'd rather you stayed.","I'd rather you to stay.","I'd rather you stay to.","I'd rather you staying."],0],["The past simple after 'it's time' has:",["present or future meaning","past meaning","perfect meaning","no meaning"],0],["Imagine you ___ a millionaire.",["were","are","will be","had be"],0]]},
{t:["C1 · Word Order in Phrasal Verbs","C1 · Susunan Perkataan dalam Phrasal Verbs"],
en:`<h4>1. Four patterns</h4><table><tr><th>Type</th><th>Rule</th><th>Example</th></tr><tr><td><b>Intransitive</b> (no object)</td><td>verb + particle</td><td>The plane took off. They gave up.</td></tr><tr><td><b>Transitive, separable</b></td><td>object can go <u>between</u> verb and particle, or after the particle</td><td>She looked the information up. She looked up the information. They called off the match.</td></tr><tr><td><b>Transitive, inseparable</b></td><td>object always <u>after</u> the particle</td><td>I'll look after the children. She came across an old photo. He got over the illness.</td></tr><tr><td><b>Three-part</b> (verb + adverb + preposition)</td><td>inseparable</td><td>I can't put up with it. Where did you come up with that idea?</td></tr></table><h4>2. Pronoun objects</h4><p>With a <b>separable</b> phrasal verb a pronoun object <u>must</u> go between: <i>Turn it off. She looked it up.</i> (✘ turn off it, looked up it). With an <b>inseparable</b> verb the pronoun goes after the particle: <i>I'll look after them. I can't put up with it.</i></p><h4>3. Long objects</h4><p>A long or complex object usually follows the particle: <i>They called off the match that had been planned for months.</i> (not <i>called the match that had been planned for months off</i>)</p><h4>4. Passive</h4><p>The particle stays with the verb: <i>The match was called off. The offer was turned down.</i></p><h4>5. Phrasal verbs and prepositional verbs</h4><p>In a phrasal verb the particle is an <b>adverb</b> and can often move (<i>turn the light off</i>). In a prepositional verb the particle is a <b>preposition</b> and stays with its object (<i>look after the children, look into the matter</i>).</p><h4>6. Common mistakes</h4><p>✘ Turn off it → ✔ Turn it off. ✘ look them after → ✔ look after them. ✘ put it up with → ✔ put up with it.</p>`,
bm:`<h4>1. Empat pola</h4><p><b>Tak transitif</b> (tiada objek): kata kerja + zarah — <i>The plane took off (Kapal terbang berlepas). They gave up (Mereka berputus asa).</i></p><p><b>Transitif, boleh dipisahkan:</b> objek boleh berada <u>di antara</u> kata kerja dan zarah, atau selepas zarah — <i>She looked the information up. She looked up the information. They called off the match (Mereka membatalkan perlawanan itu).</i></p><p><b>Transitif, tidak boleh dipisahkan:</b> objek sentiasa <u>selepas</u> zarah — <i>I'll look after the children. She came across an old photo (Dia terjumpa gambar lama). He got over the illness (Dia pulih daripada penyakit itu).</i></p><p><b>Tiga bahagian</b> (kata kerja + kata keterangan + kata sendi): tidak boleh dipisahkan — <i>I can't put up with it (Saya tidak tahan dengannya). Where did you come up with that idea? (Dari mana anda dapat idea itu?)</i></p><h4>2. Objek kata ganti</h4><p>Dengan phrasal verb yang <b>boleh dipisahkan</b>, objek kata ganti <u>mesti</u> berada di antara: <i>Turn it off. She looked it up.</i> (✘ turn off it, looked up it). Dengan kata kerja yang <b>tidak boleh dipisahkan</b>, kata ganti berada selepas zarah: <i>I'll look after them. I can't put up with it.</i></p><h4>3. Objek yang panjang</h4><p>Objek yang panjang atau kompleks biasanya mengikut zarah: <i>They called off the match that had been planned for months.</i></p><h4>4. Pasif</h4><p>Zarah kekal bersama kata kerja: <i>The match was called off. The offer was turned down.</i></p><h4>5. Phrasal verb dan prepositional verb</h4><p>Dalam phrasal verb zarah ialah <b>kata keterangan</b> dan sering boleh berpindah (<i>turn the light off</i>). Dalam prepositional verb zarah ialah <b>kata sendi</b> dan kekal bersama objeknya (<i>look after the children, look into the matter</i>).</p><h4>6. Kesilapan lazim</h4><p>✘ Turn off it → ✔ Turn it off. ✘ look them after → ✔ look after them. ✘ put it up with → ✔ put up with it.</p>`,
q:[["Which is correct?",["Turn it off.","Turn off it.","Off turn it.","Turn it of."],0],["Which is correct?",["She looked the information up.","She looked up it.","She up looked the information.","She looked up the information it."],0],["Which phrasal verb is inseparable?",["look after","turn off","pick up","put on"],0],["Which is correct?",["I'll look after them.","I'll look them after.","I'll after look them.","I'll look after they."],0],["'They called off the match' / 'They called the match off':",["Only the first is correct","Only the second is correct","Both are correct","Neither is correct"],2],["'Put up with' is:",["a three-part phrasal verb","a separable verb","an intransitive verb","a modal verb"],0],["Which is correct?",["I can't put up with it.","I can't put it up with.","I can't put up it with.","I can't up put with it."],0],["With a separable phrasal verb, a pronoun object:",["must go between the verb and the particle","must go after the particle","is never used","must be in the passive"],0],["Which is correct?",["She came across an old photo.","She came an old photo across.","She across came an old photo.","She came across it an old photo."],0],["A long object usually:",["follows the particle","goes before the particle","is omitted","is repeated"],0],["Which is correct (passive)?",["The match was called off.","The match was called.","The match called off was.","The match was off called."],0],["'He got over the illness.' 'Get over' is:",["inseparable","separable only","intransitive","a modal"],0],["'They turned down the offer' / 'They turned the offer down':",["Only the first is correct","Only the second is correct","Both are correct","Neither is correct"],2],["Which is correct?",["Where did you come up with that idea?","Where did you come that idea up with?","Where did you up come with that idea?","Where did you come with up that idea?"],0],["In 'The plane took off', 'take off' has:",["no object","a pronoun object","two objects","a passive object"],0]]}
];
const X=(i,en,bm)=>{T[i].en+=en;T[i].bm+=bm};
X(0,`<h4>More detail: spelling of the -s form</h4><table><tr><th>Rule</th><th>Example</th></tr><tr><td>Most verbs: add -s</td><td>work → works, play → plays</td></tr><tr><td>Ends in -s, -sh, -ch, -x, -o: add -es</td><td>watch → watches, go → goes, do → does</td></tr><tr><td>Consonant + y: change y to -ies</td><td>study → studies, carry → carries</td></tr><tr><td>Irregular</td><td>have → has</td></tr></table><h4>Frequency adverbs</h4><p><b>always, usually, often, sometimes, rarely, never</b> go <u>before</u> the main verb but <u>after</u> <i>be</i>: <i>She usually gets up at 6. He is always late.</i></p><h4>Time expressions</h4><p>every day, on Mondays, in the morning, twice a week, once a month.</p><h4>Common mistakes</h4><p>✘ He don't like fish → ✔ He doesn't like fish. ✘ Does she works? → ✔ Does she work? ✘ She go to school → ✔ She goes to school.</p>`,`<h4>Butiran lanjut: ejaan bentuk -s</h4><p>Kebanyakan kata kerja: tambah -s (work → works). Berakhir -s, -sh, -ch, -x, -o: tambah -es (watch → watches, go → goes, do → does). Konsonan + y: tukar y kepada -ies (study → studies). Tidak sekata: have → has.</p><h4>Kata keterangan kekerapan</h4><p><b>always (sentiasa), usually (biasanya), often (kerap), sometimes (kadang-kadang), rarely (jarang), never (tidak pernah)</b> diletakkan <u>sebelum</u> kata kerja utama tetapi <u>selepas</u> <i>be</i>: <i>She usually gets up at 6. He is always late.</i></p><h4>Ungkapan masa</h4><p>every day (setiap hari), on Mondays (pada hari Isnin), in the morning (pada waktu pagi), twice a week (dua kali seminggu), once a month (sebulan sekali).</p><h4>Kesilapan lazim</h4><p>✘ He don't like fish → ✔ He doesn't like fish. ✘ Does she works? → ✔ Does she work? ✘ She go to school → ✔ She goes to school.</p>`);
X(1,`<h4>More detail: spelling of -ed</h4><table><tr><th>Rule</th><th>Example</th></tr><tr><td>Most verbs: add -ed</td><td>work → worked, play → played</td></tr><tr><td>Ends in -e: add -d</td><td>like → liked</td></tr><tr><td>Consonant + y: y → -ied</td><td>study → studied</td></tr><tr><td>One vowel + one consonant: double it</td><td>stop → stopped, plan → planned</td></tr></table><h4>Common irregular verbs</h4><table><tr><th>Base</th><th>Past</th><th>Base</th><th>Past</th></tr><tr><td>be</td><td>was / were</td><td>know</td><td>knew</td></tr><tr><td>have</td><td>had</td><td>think</td><td>thought</td></tr><tr><td>do</td><td>did</td><td>tell</td><td>told</td></tr><tr><td>take</td><td>took</td><td>get</td><td>got</td></tr><tr><td>come</td><td>came</td><td>run</td><td>ran</td></tr><tr><td>drink</td><td>drank</td><td>sleep</td><td>slept</td></tr></table><h4>Time expressions</h4><p>yesterday, last week, two days ago, in 2019, when I was a child.</p><h4>Common mistakes</h4><p>✘ Did you went? → ✔ Did you go? ✘ I didn't saw → ✔ I didn't see. ✘ She buyed → ✔ She bought.</p>`,`<h4>Butiran lanjut: ejaan -ed</h4><p>Kebanyakan kata kerja: tambah -ed (work → worked). Berakhir -e: tambah -d (like → liked). Konsonan + y: y → -ied (study → studied). Satu vokal + satu konsonan: gandakan konsonan (stop → stopped, plan → planned).</p><h4>Kata kerja tak sekata lazim</h4><p>be → was/were · have → had · do → did · take → took (mengambil) · come → came · drink → drank (minum) · know → knew (tahu) · think → thought · tell → told · get → got · run → ran · sleep → slept (tidur).</p><h4>Ungkapan masa</h4><p>yesterday (semalam), last week (minggu lepas), two days ago (dua hari lalu), in 2019, when I was a child (semasa kecil).</p><h4>Kesilapan lazim</h4><p>✘ Did you went? → ✔ Did you go? ✘ I didn't saw → ✔ I didn't see. ✘ She buyed → ✔ She bought. Selepas <i>did / didn't</i> sentiasa guna kata kerja asas.</p>`);
X(2,`<h4>More detail: when to use each article</h4><table><tr><th>Use</th><th>Example</th></tr><tr><td><b>a/an</b> for jobs and first mention</td><td>She is a teacher. I saw a cat.</td></tr><tr><td><b>the</b> for second mention</td><td>The cat was black.</td></tr><tr><td><b>the</b> with unique things, superlatives, ordinals</td><td>the sun, the moon, the best, the first day</td></tr><tr><td><b>the</b> with rivers, seas, oceans, plural countries</td><td>the Pacific, the Nile, the United States</td></tr><tr><td><b>no article</b> for general plural/uncountable</td><td>Cats like milk. Life is beautiful.</td></tr><tr><td><b>no article</b> for languages, sports, meals, transport</td><td>speak Malay, play football, have lunch, by bus</td></tr><tr><td><b>no article</b> for institutions in their normal purpose</td><td>go to school, in hospital, at work, in bed</td></tr></table><h4>Common mistakes</h4><p>✘ She is teacher → ✔ a teacher. ✘ I play the football → ✔ I play football. ✘ an university → ✔ a university. ✘ The life is beautiful → ✔ Life is beautiful.</p>`,`<h4>Butiran lanjut: bila guna setiap kata sandang</h4><p><b>a/an</b> untuk pekerjaan dan sebutan pertama: <i>She is a teacher. I saw a cat.</i> <b>the</b> untuk sebutan kedua: <i>The cat was black.</i> <b>the</b> dengan benda unik, superlatif dan nombor tertib: <i>the sun, the moon, the best, the first day.</i> <b>the</b> dengan sungai, laut, lautan dan negara jamak: <i>the Pacific, the Nile, the United States.</i></p><p><b>Tiada kata sandang</b> untuk benda jamak/tak terbilang secara umum (<i>Cats like milk. Life is beautiful</i>), bahasa, sukan, waktu makan dan pengangkutan (<i>speak Malay, play football, have lunch, by bus</i>), serta institusi dengan tujuan biasa (<i>go to school = pergi belajar, in hospital = sebagai pesakit, at work, in bed</i>).</p><h4>Kesilapan lazim</h4><p>Bahasa Melayu tiada kata sandang, jadi ia sering tertinggal: ✘ She is teacher → ✔ She is a teacher. ✘ I play the football → ✔ I play football. ✘ an university → ✔ a university. ✘ The life is beautiful → ✔ Life is beautiful.</p>`);
X(3,`<h4>More place prepositions</h4><p><b>in front of, behind, next to, near, opposite, between, among, above, below, over, under, inside, outside.</b> <i>The bank is opposite the school. The cat is under the bed.</i></p><h4>Movement</h4><p><b>to, from, into, out of, through, across, along, up, down, towards:</b> <i>He walked across the bridge. She ran into the room.</i></p><h4>More time prepositions</h4><p><b>for</b> (duration), <b>since</b> (starting point), <b>during</b> (within a period), <b>by</b> (not later than), <b>until</b> (up to), <b>before / after</b>: <i>I waited for two hours. Finish by Friday.</i> <b>on time</b> = punctual; <b>in time</b> = early enough.</p><h4>Fixed phrases</h4><p>at home, at work, at school, in bed, on the bus, on foot, by car, in the morning / afternoon / evening, <b>at night</b>, on Monday morning.</p><h4>Common mistakes</h4><p>✘ in Monday → ✔ on Monday. ✘ at the morning → ✔ in the morning. ✘ in the night → ✔ at night.</p>`,`<h4>Kata sendi tempat tambahan</h4><p><b>in front of</b> (di hadapan), <b>behind</b> (di belakang), <b>next to</b> (bersebelahan), <b>near</b> (dekat), <b>opposite</b> (bertentangan), <b>between</b> (antara dua), <b>among</b> (antara ramai), <b>above</b> (di atas), <b>below</b> (di bawah), <b>under</b>, <b>inside</b> (di dalam), <b>outside</b> (di luar): <i>The bank is opposite the school. The cat is under the bed.</i></p><h4>Pergerakan</h4><p><b>to</b> (ke), <b>from</b> (dari), <b>into</b> (masuk ke dalam), <b>out of</b> (keluar dari), <b>through</b> (menerusi), <b>across</b> (merentasi), <b>along</b> (menyusuri), <b>up / down</b> (naik / turun), <b>towards</b> (ke arah): <i>He walked across the bridge.</i></p><h4>Kata sendi masa tambahan</h4><p><b>for</b> (selama), <b>since</b> (sejak), <b>during</b> (semasa), <b>by</b> (selewat-lewatnya), <b>until</b> (sehingga), <b>before / after</b>: <i>I waited for two hours. Finish by Friday.</i> <b>on time</b> = tepat pada masanya; <b>in time</b> = sempat.</p><h4>Frasa tetap</h4><p>at home, at work, at school, in bed, on the bus, on foot (berjalan kaki), by car, in the morning, <b>at night</b>, on Monday morning.</p><h4>Kesilapan lazim</h4><p>✘ in Monday → ✔ on Monday. ✘ at the morning → ✔ in the morning. ✘ in the night → ✔ at night.</p>`);
X(5,`<h4>More modals</h4><table><tr><th>Modal</th><th>Use</th><th>Example</th></tr><tr><td>will / won't</td><td>offers, promises, instant decisions</td><td>I'll help you. I won't tell anyone.</td></tr><tr><td>would</td><td>polite requests; past habits</td><td>Would you open the window? I would like some tea.</td></tr><tr><td>shall</td><td>offers and suggestions with I / we</td><td>Shall I carry it? Shall we go?</td></tr><tr><td>ought to</td><td>advice (like should)</td><td>You ought to rest.</td></tr><tr><td>had better</td><td>strong advice, warning</td><td>You'd better hurry or you'll be late.</td></tr></table><h4>Negative forms and short answers</h4><p>can't, couldn't, won't, wouldn't, shouldn't, mustn't, mightn't. <i>Can you swim? Yes, I can. / No, I can't.</i></p><h4>Substitutes for modals</h4><p><b>have to</b> (must), <b>be able to</b> (can), <b>be allowed to</b> (may), <b>be supposed to</b> (expected to): <i>I have to go. She was able to finish.</i></p><h4>Modal + have + past participle</h4><p><b>should have + pp</b> = criticism or regret: <i>You should have called me.</i> <b>could have + pp</b> = a possibility that did not happen: <i>I could have won.</i> <b>would have + pp</b> = an imagined past result.</p><h4>Common mistakes</h4><p>✘ He cans swim → ✔ He can swim. ✘ She musts go → ✔ She must go. ✘ You should to go → ✔ You should go.</p>`,`<h4>Modal tambahan</h4><p><b>will / won't:</b> tawaran, janji, keputusan spontan: <i>I'll help you. I won't tell anyone.</i> <b>would:</b> permintaan sopan; tabiat lampau: <i>Would you open the window? I would like some tea.</i> <b>shall:</b> tawaran dan cadangan dengan I / we: <i>Shall I carry it? (Mahu saya bawakan?) Shall we go?</i> <b>ought to:</b> nasihat (seperti should): <i>You ought to rest.</i> <b>had better:</b> nasihat kuat atau amaran: <i>You'd better hurry or you'll be late (Anda lebih baik bergegas, kalau tidak lewat).</i></p><h4>Bentuk negatif dan jawapan pendek</h4><p>can't, couldn't, won't, wouldn't, shouldn't, mustn't, mightn't. <i>Can you swim? Yes, I can. / No, I can't.</i></p><h4>Pengganti modal</h4><p><b>have to</b> (= must), <b>be able to</b> (= can), <b>be allowed to</b> (= may), <b>be supposed to</b> (dijangka/sepatutnya): <i>I have to go. She was able to finish.</i></p><h4>Modal + have + past participle</h4><p><b>should have + pp</b> = kritikan atau kekesalan: <i>You should have called me (Anda sepatutnya telefon saya).</i> <b>could have + pp</b> = kemungkinan yang tidak berlaku: <i>I could have won (Saya boleh sahaja menang).</i> <b>would have + pp</b> = keputusan lampau yang dibayangkan.</p><h4>Kesilapan lazim</h4><p>✘ He cans swim → ✔ He can swim. ✘ She musts go → ✔ She must go. ✘ You should to go → ✔ You should go. Modal tidak menerima -s, tidak diikuti <i>to</i>, dan tidak menggunakan <i>do/does</i>.</p>`);

<script type="module">
/* ===== FIREBASE (Auth + Firestore) — accounts are created ONLY by the owner =====
   Setup:
   1) Firebase console > Project settings > Your apps > Web app: copy the config into firebaseConfig below.
   2) Authentication > Sign-in method: enable Email/Password. Authentication > Settings > Authorised domains: add your Netlify domain.
   3) Firestore Database: create it, then paste the rules from firestore.rules (Rules tab > Publish).
   4) To add a student or teacher (there is NO public sign-up):
      a) Authentication > Users > Add user (e-mail + password). Copy the User UID.
      b) Firestore > users > Add document. Document ID = that UID. Fields: name (string), email (string), scores (map, empty).
         For a teacher, also add: role (string) = teacher.
   An account without a users/{uid} document is signed out automatically and cannot read or write any data.

   Until step 1 is done (apiKey starts with "ISI"), the portal runs in local mode only. */

const firebaseConfig = {
  apiKey: "AIzaSyADh-X34WZOrc3DXcaJ9aX4ZcVeuvSVBl4",
  authDomain: "portal-belajar-inggeris-27046.firebaseapp.com",
  projectId: "portal-belajar-inggeris-27046",
  storageBucket: "portal-belajar-inggeris-27046.firebasestorage.app",
  messagingSenderId: "596881937724",
  appId: "1:596881937724:web:20fa706101e6d5a7523a39"
};
const ev=(n,d)=>window.dispatchEvent(new CustomEvent(n,{detail:d}));
