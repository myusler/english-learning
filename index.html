en:`<h4>1. What is a non-defining relative clause?</h4><p>A clause that adds <b>extra information</b> about a person or thing that is already clear. If you remove it, the sentence still makes sense. It is always separated by <b>commas</b>: <i>My sister, who lives in KL, is a nurse. Penang, which is famous for food, is an island.</i></p><h4>2. Relative pronouns</h4><table><tr><th>Word</th><th>Used for</th><th>Example</th></tr><tr><td><b>who</b></td><td>people</td><td>Mr Lim, who teaches maths, is my uncle.</td></tr><tr><td><b>which</b></td><td>things</td><td>Ramadan, which is the ninth month, is holy.</td></tr><tr><td><b>whose</b></td><td>possession</td><td>Mr Lim, whose son is a doctor, teaches maths.</td></tr><tr><td><b>where</b></td><td>places</td><td>I visited Melaka, where my grandparents live.</td></tr><tr><td><b>when</b></td><td>times</td><td>We arrived in July, when the weather was hot.</td></tr></table><h4>3. Key differences from defining clauses</h4><p><b>(a)</b> Always use commas (or pauses in speech). <b>(b)</b> <b>Never use that</b>: ✘ My car, that is red, is new → ✔ My car, which is red, is new. <b>(c)</b> You cannot omit the pronoun, even when it is the object.</p><h4>4. "which" for a whole clause</h4><p><b>which</b> can refer to a whole idea: <i>He passed the exam, which surprised everyone.</i> (which = the fact that he passed)</p><h4>5. Meaning of commas</h4><p><i>My brother, who lives in Dubai, is an engineer</i> (probably one brother) ≠ <i>My brother who lives in Dubai is an engineer</i> (I have several brothers; this one lives in Dubai).</p>`,
bm:`<h4>1. Apakah klausa relatif tidak tentu?</h4><p>Klausa yang menambah <b>maklumat tambahan</b> tentang orang atau benda yang sudah jelas. Jika dibuang, ayat masih bermakna. Ia sentiasa dipisahkan dengan <b>koma</b>: <i>My sister, who lives in KL, is a nurse (Kakak saya, yang tinggal di KL, seorang jururawat). Penang, which is famous for food, is an island.</i></p><h4>2. Kata ganti relatif</h4><p><b>who</b> = orang: <i>Mr Lim, who teaches maths, is my uncle.</i> <b>which</b> = benda: <i>Ramadan, which is the ninth month, is holy.</i> <b>whose</b> = kepunyaan: <i>Mr Lim, whose son is a doctor, teaches maths.</i> <b>where</b> = tempat: <i>I visited Melaka, where my grandparents live.</i> <b>when</b> = masa: <i>We arrived in July, when the weather was hot.</i></p><h4>3. Perbezaan utama daripada klausa tentu</h4><p><b>(a)</b> Sentiasa guna koma (atau jeda dalam pertuturan). <b>(b)</b> <b>Jangan guna that</b>: ✘ My car, that is red, is new → ✔ My car, which is red, is new. <b>(c)</b> Kata ganti tidak boleh dihilangkan, walaupun ia ialah objek.</p><h4>4. "which" untuk seluruh klausa</h4><p><b>which</b> boleh merujuk kepada seluruh idea: <i>He passed the exam, which surprised everyone</i> (Dia lulus peperiksaan, dan itu mengejutkan semua orang).</p><h4>5. Makna koma</h4><p><i>My brother, who lives in Dubai, is an engineer</i> (kemungkinan hanya seorang abang/adik lelaki) berbeza daripada <i>My brother who lives in Dubai is an engineer</i> (saya ada beberapa orang; yang tinggal di Dubai ini jurutera).</p>`,
q:[["My sister, ___ lives in KL, is a nurse.",["that","who","which","whose"],1],["Penang, ___ is famous for food, is an island.",["that","which","who","where"],1],["Non-defining clauses ___ commas.",["use","don't use","can't use","may use"],0],["Which is correct?",["My car, that is red, is new.","My car, which is red, is new.","My car which, is red, is new.","My car, who is red, is new."],1],["Can we omit the pronoun in non-defining clauses?",["yes","no","only which","only who"],1],["Mr Lim, ___ son is a doctor, teaches maths.",["who","whose","which","that"],1],["I visited Melaka, ___ my grandparents live.",["which","where","who","whose"],1],["In 'He passed the exam, which surprised everyone', 'which' refers to:",["the whole clause","a person","a place","a time"],0],["The clause between commas gives:",["extra information","essential information","a question","a command"],0],["'My brother, who lives in Dubai, is an engineer' suggests:",["probably only one brother","several brothers","no brother","a brother who lives in KL"],0],["Which word can NOT be used in non-defining clauses?",["who","which","that","whose"],2],["Ramadan, ___ is the ninth month, is a holy month.",["that","which","where","who"],1],["In writing we put non-defining clauses between:",["commas","brackets only","quotation marks","nothing"],0],["She has two sons, ___ are doctors.",["who","that","which","whose"],0],["The Petronas Towers, ___ are in KL, are very tall.",["that","which","who","where"],1]]},
{t:["Reported Speech: Questions","Ucapan Dilaporkan: Soalan"],
en:`<h4>1. Two types of reported questions</h4><p><b>Yes/no questions:</b> asked + <b>if / whether</b> + statement word order. <i>"Do you like tea?" → She asked me if I liked tea.</i><br><b>Wh- questions:</b> asked + <b>wh-word</b> + statement word order. <i>"Where do you live?" → He asked me where I lived.</i></p><h4>2. Important rules</h4><p><b>(a)</b> Use <u>statement word order</u> (subject + verb). No <i>do / does / did</i> and no question mark. <b>(b)</b> Backshift the tense. <b>(c)</b> Change pronouns and time/place words.</p><table><tr><th>Direct speech</th><th>Reported speech</th></tr><tr><td>present simple (live)</td><td>past simple (lived)</td></tr><tr><td>am / is / are</td><td>was / were</td></tr><tr><td>past simple (finished)</td><td>past perfect (had finished)</td></tr><tr><td>will / can</td><td>would / could</td></tr><tr><td>now / today</td><td>then / that day</td></tr><tr><td>tomorrow / here</td><td>the next day / there</td></tr></table><h4>3. More examples</h4><p><i>"Are you tired?" → He asked if I was tired. "What time is it?" → She asked what time it was. "Can you swim?" → He asked if I could swim. "Will you come?" → He asked if I would come. "Why are you crying?" → She asked me why I was crying.</i></p><h4>4. Common mistakes</h4><p>✘ She asked where did I go → ✔ She asked where I went. ✘ He asked me do I like coffee → ✔ He asked me if I liked coffee. ✘ He asked that I liked coffee → ✔ He asked if.</p>`,
bm:`<h4>1. Dua jenis soalan dilaporkan</h4><p><b>Soalan ya/tidak:</b> asked + <b>if / whether</b> + susunan kata ayat penyata. <i>"Do you like tea?" → She asked me if I liked tea (Dia bertanya sama ada saya suka teh).</i><br><b>Soalan Wh-:</b> asked + <b>perkataan wh-</b> + susunan kata ayat penyata. <i>"Where do you live?" → He asked me where I lived (Dia bertanya di mana saya tinggal).</i></p><h4>2. Peraturan penting</h4><p><b>(a)</b> Guna <u>susunan ayat penyata</u> (subjek + kata kerja). Tiada <i>do / does / did</i> dan tiada tanda soal. <b>(b)</b> Anjak kala ke belakang (backshift). <b>(c)</b> Tukar kata ganti nama serta kata masa dan tempat.</p><p><b>Anjakan kala:</b> present simple (live) → past simple (lived). am/is/are → was/were. past simple (finished) → past perfect (had finished). will/can → would/could. <b>Penanda:</b> now/today → then/that day. tomorrow → the next day. here → there.</p><h4>3. Contoh lanjut</h4><p><i>"Are you tired?" → He asked if I was tired. "What time is it?" → She asked what time it was. "Can you swim?" → He asked if I could swim. "Will you come?" → He asked if I would come. "Why are you crying?" → She asked me why I was crying.</i></p><h4>4. Kesilapan lazim</h4><p>✘ She asked where did I go → ✔ She asked where I went. ✘ He asked me do I like coffee → ✔ He asked me if I liked coffee. ✘ He asked that I liked coffee → ✔ He asked if.</p>`,
q:[["'Do you like tea?' She asked me ___.",["if I liked tea","did I like tea","do I like tea","if did I like tea"],0],["'Where do you live?' He asked me where I ___.",["live","lived","do live","did live"],1],["'Are you tired?' He asked ___ I was tired.",["that","if","what","did"],1],["Which is correct?",["She asked where did I go.","She asked where I went.","She asked where do I go.","She asked that where I went."],1],["'What time is it?' She asked what time ___.",["it is","it was","was it","is it"],1],["Reported questions use ___ word order.",["statement","question","reversed","no"],0],["'Can you swim?' He asked if I ___ swim.",["can","could","will","do"],1],["In reported questions we ___ question marks.",["don't use","always use","use two","sometimes use"],0],["'Did you finish?' She asked if I ___.",["finished","had finished","finish","did finish"],1],["'Will you come?' He asked if I ___ come.",["will","would","can","did"],1],["'Tomorrow' becomes:",["the next day","yesterday","today","tonight"],0],["Which is correct?",["He asked me do I like coffee.","He asked me if I liked coffee.","He asked me that I liked coffee.","He asked if did I like coffee."],1],["'Now' becomes:",["then","today","here","there"],0],["'Why are you crying?' She asked me why I ___.",["was crying","am crying","cry","crying"],0],["Yes/no questions are reported with:",["if or whether","what","that","who"],0]]},
{t:["Reported Speech: Reporting Verbs","Ucapan Dilaporkan: Kata Kerja Pelapor"],
en:`<h4>1. Beyond "say" and "tell"</h4><p>Reporting verbs show the <b>purpose</b> of what someone said (advice, warning, promise…). Each verb has its own pattern.</p><table><tr><th>Pattern</th><th>Verbs</th><th>Example</th></tr><tr><td>verb + that + clause</td><td>say, explain, admit, claim, deny, suggest</td><td>He said that he was tired.</td></tr><tr><td>verb + object + to + infinitive</td><td>tell, ask, advise, warn, order, remind, invite, persuade</td><td>She told me to call her. He advised me to see a doctor.</td></tr><tr><td>verb + to + infinitive</td><td>promise, offer, refuse, agree, threaten</td><td>He offered to help us. She refused to help. He promised to call me.</td></tr><tr><td>verb + -ing</td><td>suggest, admit, deny</td><td>They suggested going to the cinema. He denied stealing it. She admitted breaking it.</td></tr><tr><td>verb + preposition + -ing</td><td>apologise for, insist on, accuse … of</td><td>He apologised for being late.</td></tr></table><h4>2. Negative instructions</h4><p><i>"Don't touch it!" → She warned me not to touch it.</i></p><h4>3. say vs tell</h4><p><b>tell</b> is always followed by a person (an object): <i>She told me the truth.</i> <b>say</b> is not followed by a person (unless <i>say to</i>): <i>She said that she was tired.</i> ✘ She said me → ✔ She told me.</p><h4>4. Common mistakes</h4><p>✘ He suggested me to go → ✔ He suggested going / He suggested that I go. ✘ She said me the truth → ✔ She told me the truth.</p>`,
bm:`<h4>1. Selain "say" dan "tell"</h4><p>Kata kerja pelapor menunjukkan <b>tujuan</b> apa yang diucapkan (nasihat, amaran, janji…). Setiap kata kerja mempunyai pola tersendiri.</p><p><b>verb + that + klausa:</b> say, explain (menerangkan), admit (mengaku), claim (mendakwa), deny (menafikan), suggest (mencadangkan): <i>He said that he was tired.</i></p><p><b>verb + objek + to + infinitif:</b> tell (menyuruh), ask (meminta), advise (menasihati), warn (memberi amaran), order (mengarah), remind (mengingatkan), invite (menjemput), persuade (memujuk): <i>She told me to call her (Dia menyuruh saya menelefonnya). He advised me to see a doctor.</i></p><p><b>verb + to + infinitif:</b> promise (berjanji), offer (menawarkan), refuse (enggan), agree (bersetuju), threaten (mengugut): <i>He offered to help us. She refused to help. He promised to call me.</i></p><p><b>verb + -ing:</b> suggest, admit, deny: <i>They suggested going to the cinema. He denied stealing it (Dia menafikan mencurinya). She admitted breaking it.</i></p><p><b>verb + kata sendi + -ing:</b> apologise for (memohon maaf kerana), insist on (berkeras), accuse … of (menuduh): <i>He apologised for being late.</i></p><h4>2. Arahan negatif</h4><p><i>"Don't touch it!" → She warned me not to touch it (Dia memberi amaran supaya saya jangan menyentuhnya).</i></p><h4>3. say berbanding tell</h4><p><b>tell</b> sentiasa diikuti orang (objek): <i>She told me the truth.</i> <b>say</b> tidak diikuti orang (kecuali <i>say to</i>): <i>She said that she was tired.</i> ✘ She said me → ✔ She told me.</p><h4>4. Kesilapan lazim</h4><p>✘ He suggested me to go → ✔ He suggested going / He suggested that I go. ✘ She said me the truth → ✔ She told me the truth.</p>`,
q:[["She ___ me to be careful.",["warned","said","suggested","admitted"],0],["He ___ that he was tired.",["told","said","asked","advised"],1],["She ___ me to call her.",["said","told","suggested","admitted"],1],["He ___ to help us.",["offered","suggested","told","said"],0],["They ___ going to the cinema.",["suggested","told","warned","ordered"],0],["Which is correct?",["He suggested me to go.","He suggested going.","He suggested to go.","He suggested go."],1],["'I'm sorry I'm late.' He ___ for being late.",["apologised","admitted","refused","explained"],0],["'I didn't steal it.' He ___ stealing it.",["denied","admitted","suggested","advised"],0],["'No, I won't help.' She ___ to help.",["refused","agreed","offered","promised"],0],["'I'll call you.' He ___ to call me.",["promised","denied","warned","suggested"],0],["'Don't touch it!' She ___ me not to touch it.",["warned","suggested","admitted","said"],0],["'tell' is followed by:",["an object (a person)","that only","-ing","nothing"],0],["Which is correct?",["She said me the truth.","She told me the truth.","She told the truth me.","She say me the truth."],1],["'You should see a doctor.' He ___ me to see a doctor.",["advised","denied","admitted","refused"],0],["'Yes, I broke it.' She ___ breaking it.",["admitted","denied","refused","suggested"],0]]},
{t:["Reported Speech: Statements","Ucapan Dilaporkan: Pernyataan"],
en:`<h4>1. Direct and reported speech</h4><p><b>Direct speech</b> gives the exact words: <i>"I am tired," she said.</i> <b>Reported speech</b> tells what was said without quotation marks: <i>She said (that) she was tired.</i></p><h4>2. Backshift: move the tense one step back</h4><table><tr><th>Direct speech</th><th>Reported speech</th></tr><tr><td>present simple: "I like pizza."</td><td>past simple: He said he liked pizza.</td></tr><tr><td>present continuous: "I'm working."</td><td>past continuous: He said he was working.</td></tr><tr><td>present perfect: "I have finished."</td><td>past perfect: She said she had finished.</td></tr><tr><td>past simple: "I went to KL."</td><td>past perfect: He said he had gone to KL.</td></tr><tr><td>will / can / may / must</td><td>would / could / might / had to</td></tr></table><h4>3. Other changes</h4><p><b>Pronouns:</b> "I" → he / she. <b>Time and place:</b> now → then, today → that day, tomorrow → the next day, yesterday → the day before, here → there, this → that.</p><h4>4. When NOT to backshift</h4><p>When the reporting verb is in the present (<i>She says she is tired</i>), or when the fact is still true (<i>He said he lives in Kedah</i>).</p><h4>5. say vs tell</h4><p><b>tell + person:</b> <i>He told me he was hungry.</i> <b>say</b> (no person): <i>He said he was hungry.</i> The word <i>that</i> is optional.</p><h4>6. Common mistakes</h4><p>✘ She said me → ✔ She told me. ✘ He told he was hungry → ✔ He told me he was hungry. ✘ She said she is tired (when past) → ✔ she was tired.</p>`,
bm:`<h4>1. Ucapan langsung dan ucapan dilaporkan</h4><p><b>Ucapan langsung</b> memberi kata-kata yang tepat: <i>"I am tired," she said.</i> <b>Ucapan dilaporkan</b> menceritakan apa yang dikatakan tanpa tanda petikan: <i>She said (that) she was tired (Dia berkata dia penat).</i></p><h4>2. Anjakan kala (backshift): mundur satu langkah</h4><p><b>present simple</b> → <b>past simple</b>: "I like pizza." → He said he liked pizza. <b>present continuous</b> → <b>past continuous</b>: "I'm working." → He said he was working. <b>present perfect</b> → <b>past perfect</b>: "I have finished." → She said she had finished. <b>past simple</b> → <b>past perfect</b>: "I went to KL." → He said he had gone to KL. <b>will / can / may / must</b> → <b>would / could / might / had to</b>.</p><h4>3. Perubahan lain</h4><p><b>Kata ganti:</b> "I" → he / she. <b>Masa dan tempat:</b> now → then (ketika itu), today → that day, tomorrow → the next day (keesokan harinya), yesterday → the day before (hari sebelumnya), here → there, this → that.</p><h4>4. Bila TIDAK perlu anjak kala</h4><p>Apabila kata kerja pelapor dalam kala kini (<i>She says she is tired</i>), atau apabila fakta masih benar (<i>He said he lives in Kedah</i>).</p><h4>5. say berbanding tell</h4><p><b>tell + orang:</b> <i>He told me he was hungry.</i> <b>say</b> (tanpa orang): <i>He said he was hungry.</i> Perkataan <i>that</i> adalah pilihan.</p><h4>6. Kesilapan lazim</h4><p>✘ She said me → ✔ She told me. ✘ He told he was hungry → ✔ He told me he was hungry. ✘ She said she is tired (apabila lampau) → ✔ she was tired.</p>`,
q:[["'I am tired.' She said she ___ tired.",["is","was","were","has been"],1],["'I like pizza.' He said he ___ pizza.",["likes","liked","had like","like"],1],["'I will help you.' She said she ___ help me.",["will","would","can","did"],1],["'I can swim.' He said he ___ swim.",["can","could","may","would"],1],["'I have finished.' She said she ___ finished.",["has","had","have","was"],1],["'I went to KL.' He said he ___ to KL.",["had gone","has gone","goes","was going"],0],["'I must go.' She said she ___ go.",["must","had to","has to","musts"],1],["'I'm working now.' He said he was working ___.",["now","then","today","here"],1],["Which is correct?",["She told that she was tired.","She said that she was tired.","She said me she was tired.","She tells me that she was tired."],1],["'She says she is tired.' Why is there no backshift?",["the reporting verb is in the present","it is always wrong","she is lying","it is past"],0],["Backshift is optional when:",["the fact is still true","always","never","with past only"],0],["'Tomorrow' becomes:",["the next day","yesterday","today","now"],0],["'Here' becomes:",["there","then","now","today"],0],["Which is correct?",["He told me he was hungry.","He told he was hungry.","He said me he was hungry.","He told to me he was hungry."],0],["'I may come.' He said he ___ come.",["may","might","must","will"],1]]},
{t:["Stative Verbs","Kata Kerja Keadaan (Stative Verbs)"],
en:`<h4>1. What are stative verbs?</h4><p>Stative verbs describe a <b>state</b> (something that stays the same), not an action. They are normally <b>not used in the continuous</b> (-ing) form: ✘ I am knowing the answer → ✔ I know the answer.</p><h4>2. Main groups</h4><table><tr><th>Group</th><th>Verbs</th></tr><tr><td>Thinking</td><td>know, understand, believe, think (opinion), remember, forget, doubt</td></tr><tr><td>Feelings</td><td>like, love, hate, want, need, prefer, wish</td></tr><tr><td>Possession</td><td>have (own), own, belong, contain, cost</td></tr><tr><td>Appearance / senses</td><td>seem, appear, look (seem), sound, smell, taste, hear, see</td></tr></table><p>Examples: <i>She owns a new car. I want a coffee. The soup tastes delicious. He seems tired.</i></p><h4>3. Verbs with two meanings</h4><table><tr><th>Verb</th><th>State (simple)</th><th>Action (continuous)</th></tr><tr><td>have</td><td>I have a car. (own)</td><td>I'm having lunch. (eat)</td></tr><tr><td>think</td><td>I think he is right. (opinion)</td><td>I'm thinking about my holiday. (process)</td></tr><tr><td>see</td><td>I see what you mean. (understand)</td><td>I'm seeing the doctor tomorrow. (meeting)</td></tr><tr><td>taste / smell</td><td>The soup tastes good.</td><td>I'm tasting the soup.</td></tr><tr><td>be</td><td>He is rude. (always)</td><td>He's being rude today. (behaving)</td></tr></table><h4>4. Common mistakes</h4><p>✘ I am wanting a coffee → ✔ I want a coffee. ✘ He is seeming tired → ✔ He seems tired. ✘ I am understanding you → ✔ I understand you.</p>`,
bm:`<h4>1. Apakah kata kerja keadaan?</h4><p>Kata kerja keadaan menerangkan <b>keadaan</b> (sesuatu yang kekal), bukan perbuatan. Ia biasanya <b>tidak digunakan dalam bentuk berterusan</b> (-ing): ✘ I am knowing the answer → ✔ I know the answer.</p><h4>2. Kumpulan utama</h4><p><b>Pemikiran:</b> know (tahu), understand (faham), believe (percaya), think (berpendapat), remember (ingat), forget (lupa), doubt (ragu). <b>Perasaan:</b> like, love, hate, want, need, prefer, wish. <b>Milikan:</b> have (memiliki), own, belong (milik), contain (mengandungi), cost (berharga). <b>Penampilan dan deria:</b> seem (nampaknya), appear, look (kelihatan), sound (bunyinya), smell, taste, hear, see.</p><p><i>She owns a new car. I want a coffee. The soup tastes delicious. He seems tired.</i></p><h4>3. Kata kerja dengan dua makna</h4><p><b>have:</b> I have a car (memiliki) / I'm having lunch (sedang makan). <b>think:</b> I think he is right (pendapat) / I'm thinking about my holiday (sedang berfikir). <b>see:</b> I see what you mean (faham) / I'm seeing the doctor tomorrow (berjumpa). <b>taste / smell:</b> The soup tastes good / I'm tasting the soup (sedang mencuba rasa). <b>be:</b> He is rude (memang begitu) / He's being rude today (berkelakuan kasar hari ini).</p><h4>4. Kesilapan lazim</h4><p>✘ I am wanting a coffee → ✔ I want a coffee. ✘ He is seeming tired → ✔ He seems tired. ✘ I am understanding you → ✔ I understand you.</p>`,
q:[["Which is a stative verb?",["run","know","play","write"],1],["I ___ the answer.",["am knowing","know","was know","knowing"],1],["She ___ a new car. (own)",["is owning","owns","owning","own"],1],["Which is correct?",["I am wanting a coffee.","I want a coffee.","I wanting a coffee.","I am want a coffee."],1],["In 'I'm having lunch', 'have' means:",["eat (action)","possess","must","be"],0],["In 'I have a car', 'have' is:",["a state","an action","a habit","a past event"],0],["In 'I think he is right', 'think' is:",["an opinion (state)","a process","a habit","a plan"],0],["In 'I'm thinking about my holiday', 'think' is:",["a mental process","an opinion","a state","a fact"],0],["The soup ___ delicious.",["is tasting","tastes","taste","is taste"],1],["'She's being rude today' means:",["she is behaving rudely now","she is always rude","she is a ruder person","she was rude"],0],["Which is NOT normally used in the continuous?",["belong","eat","talk","dance"],0],["I ___ you. (understand)",["am understanding","understand","understands","understanding"],1],["'love, like, hate, want' are:",["stative verbs","action verbs","modals","auxiliary verbs"],0],["Which is correct?",["He is seeming tired.","He seems tired.","He seem tired.","He is seem tired."],1],["'I'm seeing the doctor tomorrow' means:",["I have an appointment","I can see","I understand","I look"],0]]},
{t:["The Future: Degrees of Certainty","Masa Depan: Tahap Kepastian"],
en:`<h4>1. How sure are we about the future?</h4><p>We choose different words depending on how <b>certain</b> we are.</p><table><tr><th>Certainty</th><th>Expressions</th><th>Example</th></tr><tr><td>100% sure</td><td>will, won't, definitely will, certainly, be bound to</td><td>It will rain tomorrow. She's bound to win.</td></tr><tr><td>Very likely</td><td>should, ought to, probably, be likely to, I expect</td><td>She should pass the exam. He probably won't come.</td></tr><tr><td>Possible (50%)</td><td>may, might, could, perhaps, maybe</td><td>It might rain. Maybe she will come.</td></tr><tr><td>Unlikely</td><td>probably won't, be unlikely to, I doubt</td><td>It's unlikely that he will come. I doubt he will win.</td></tr><tr><td>100% sure it will NOT happen</td><td>won't, definitely won't, certainly won't</td><td>He definitely won't come.</td></tr></table><h4>2. Position of adverbs</h4><p>With <b>will</b>, put the adverb <u>after</u> <i>will</i> in positive sentences and <u>before</u> <i>won't</i> in negatives: <i>I will definitely go. He probably won't come.</i> (✘ He won't probably come.)</p><h4>3. Evidence now: be going to</h4><p><i>Look at those clouds! It's going to rain.</i></p><h4>4. may / might</h4><p>After <i>may / might / could</i> use the base verb (✘ She might to come). <i>It may not rain</i> = it is possible it won't rain. Avoid <i>can't</i> for future possibility.</p><h4>5. Common mistakes</h4><p>✘ She might comes → ✔ She might come. ✘ He won't probably → ✔ He probably won't.</p>`,
bm:`<h4>1. Sejauh mana kita pasti tentang masa depan?</h4><p>Kita memilih perkataan yang berbeza mengikut tahap <b>kepastian</b>.</p><p><b>Pasti 100%:</b> will, won't, definitely will, certainly (pasti), be bound to (pasti akan): <i>It will rain tomorrow. She's bound to win (Dia pasti menang).</i></p><p><b>Sangat berkemungkinan:</b> should, ought to (sepatutnya), probably (mungkin besar kemungkinan), be likely to, I expect (saya jangka): <i>She should pass the exam (Dia sepatutnya lulus). He probably won't come.</i></p><p><b>Mungkin (50%):</b> may, might, could, perhaps, maybe: <i>It might rain. Maybe she will come.</i></p><p><b>Kecil kemungkinan:</b> probably won't, be unlikely to, I doubt (saya ragu): <i>It's unlikely that he will come (Kecil kemungkinan dia datang). I doubt he will win.</i></p><p><b>Pasti 100% TIDAK akan berlaku:</b> won't, definitely won't: <i>He definitely won't come.</i></p><h4>2. Kedudukan kata keterangan</h4><p>Dengan <b>will</b>, letak kata keterangan <u>selepas</u> <i>will</i> dalam ayat positif dan <u>sebelum</u> <i>won't</i> dalam negatif: <i>I will definitely go. He probably won't come.</i> (✘ He won't probably come.)</p><h4>3. Bukti sekarang: be going to</h4><p><i>Look at those clouds! It's going to rain.</i></p><h4>4. may / might</h4><p>Selepas <i>may / might / could</i> guna kata kerja asas (✘ She might to come). <i>It may not rain</i> = mungkin tidak hujan. Elakkan <i>can't</i> untuk kemungkinan masa depan.</p><h4>5. Kesilapan lazim</h4><p>✘ She might comes → ✔ She might come. ✘ He won't probably → ✔ He probably won't.</p>`,
q:[["I'm 100% sure: It ___ rain tomorrow.",["will","might","may","could"],0],["It ___ rain tomorrow, but I'm not sure.",["will","might","must","shall"],1],["She ___ pass the exam. (expected, probable)",["should","can't","mustn't","won't"],0],["'Definitely' shows:",["100% certainty","possibility","doubt","a negative"],0],["Which is correct?",["He probably won't come.","He won't probably come.","He probably don't come.","He is probably not come."],0],["'I doubt he will win' means:",["I think he won't win","I'm sure he will win","he might win for sure","he must win"],0],["Which is the least certain?",["will","should","might","definitely will"],2],["'Perhaps' is:",["an adverb of possibility","a modal","a verb","a preposition"],0],["Which is correct?",["I will definitely go.","I definitely will to go.","I will go definitely to.","I definitely go will."],0],["'It may not rain' means:",["it is possible it won't rain","it will surely rain","it is forbidden to rain","it must rain"],0],["'She's bound to win' means:",["she will almost certainly win","she might win","she can't win","she must win"],0],["'Look at those clouds! It ___ rain.'",["is going to","might","will be","could"],0],["'I expect he will arrive soon' shows:",["a belief about the future","an order","a past action","a rule"],0],["'It's unlikely that he will come' means:",["probably he won't come","he will surely come","he is coming","he came"],0],["Which is correct?",["She might to come.","She might come.","She might comes.","She might coming."],1]]},
{t:["Using 'as' and 'like'","Penggunaan 'as' dan 'like'"],
en:`<h4>1. like = similar to</h4><p><b>like</b> is a preposition meaning <i>similar to</i>. It is followed by a noun, pronoun or -ing: <i>She looks like her mother. He drives like a racing driver. She sings like an angel. It sounds like a good idea.</i></p><h4>2. as = role or function</h4><p><b>as</b> (+ noun) shows the job, role or purpose of someone or something: <i>He works as a driver (his job). As a teacher, I must be fair. I bought it as a present for you. She used the box as a chair.</i></p><table><tr><th>like (similar)</th><th>as (role)</th></tr><tr><td>He talks like a teacher. (but he isn't one)</td><td>He works as a teacher. (he is one)</td></tr><tr><td>He was dressed like a clown. (similar)</td><td>He was dressed as a clown. (in costume)</td></tr></table><h4>3. Other uses of as</h4><p><b>as … as</b> for comparison: <i>It's as hot as yesterday.</i> <b>the same as</b>: <i>This is the same as mine.</i> <b>as + clause</b> (in the way that): <i>Do as I tell you. As usual, he was late.</i> <b>as if / as though</b>: <i>He talks as if he knows everything.</i> <b>as</b> = while / because: <i>As I was leaving, the phone rang.</i></p><h4>4. like for examples</h4><p><b>like</b> = such as: <i>I like fruit, like apples and bananas.</i></p><h4>5. Common mistakes</h4><p>✘ She works like a nurse → ✔ as a nurse. ✘ It is the same like mine → ✔ the same as mine. ✘ It sounds as a good idea → ✔ like a good idea.</p>`,
bm:`<h4>1. like = serupa dengan</h4><p><b>like</b> ialah kata sendi yang bermaksud <i>serupa dengan</i>. Ia diikuti kata nama, kata ganti atau -ing: <i>She looks like her mother (Dia seperti ibunya). He drives like a racing driver. She sings like an angel (Dia menyanyi seperti malaikat). It sounds like a good idea.</i></p><h4>2. as = peranan atau fungsi</h4><p><b>as</b> (+ kata nama) menunjukkan pekerjaan, peranan atau tujuan: <i>He works as a driver (kerjanya pemandu). As a teacher, I must be fair (Sebagai guru, saya mesti adil). I bought it as a present for you. She used the box as a chair.</i></p><p><b>Perbezaan:</b> <i>He talks like a teacher</i> = dia bercakap seperti guru (tetapi bukan guru). <i>He works as a teacher</i> = dia memang guru. <i>He was dressed like a clown</i> = berpakaian menyerupai badut. <i>He was dressed as a clown</i> = memakai kostum badut.</p><h4>3. Kegunaan lain as</h4><p><b>as … as</b> (perbandingan): <i>It's as hot as yesterday.</i> <b>the same as</b>: <i>This is the same as mine.</i> <b>as + klausa</b> (seperti yang): <i>Do as I tell you (Buat seperti yang saya suruh). As usual, he was late.</i> <b>as if / as though</b> (seolah-olah): <i>He talks as if he knows everything.</i> <b>as</b> = semasa / kerana: <i>As I was leaving, the phone rang.</i></p><h4>4. like untuk contoh</h4><p><b>like</b> = seperti (contohnya): <i>I like fruit, like apples and bananas.</i></p><h4>5. Kesilapan lazim</h4><p>✘ She works like a nurse → ✔ as a nurse. ✘ It is the same like mine → ✔ the same as mine. ✘ It sounds as a good idea → ✔ like a good idea.</p>`,
q:[["She looks ___ her mother.",["as","like","that","than"],1],["He works ___ a driver. (his job)",["like","as","that","such"],1],["He drives ___ a racing driver. (similar)",["as","like","than","so"],1],["Do ___ I tell you.",["like","as","than","so"],1],["'I use my phone as a camera' and 'like a camera' mean:",["as = it is my camera; like = similar to one","the same thing","only 'as' is correct","only 'like' is correct"],0],["I've got a lot of fruit, ___ apples and bananas.",["as","like","than","that"],1],["It's ___ hot as yesterday.",["like","as","than","that"],1],["She sings ___ an angel.",["as","like","than","so"],1],["'As usual' means:",["like always","unusually","never","rarely"],0],["___ a teacher, I must be fair.",["Like","As","Than","So"],1],["He talks ___ he knows everything.",["like that","as if","as for","as of"],1],["This is the same ___ mine.",["as","like","that","than"],0],["'He was dressed as a clown' vs 'like a clown':",["as = in costume; like = similar","the same thing","only 'like' is correct","neither is correct"],0],["I bought it ___ a present for you.",["like","as","than","so"],1],["Which is correct?",["It sounds like a good idea.","It sounds as a good idea.","It sounds like as a good idea.","It sounds as like a good idea."],0]]},
{t:["Using 'enough'","Penggunaan 'enough' (cukup)"],
en:`<h4>1. Position of enough</h4><table><tr><th>Pattern</th><th>Example</th></tr><tr><td><b>adjective / adverb + enough</b></td><td>She is tall enough. He didn't run fast enough.</td></tr><tr><td><b>enough + noun</b></td><td>We have enough money. There is enough food for everyone.</td></tr><tr><td><b>verb + enough</b></td><td>That's enough! You don't sleep enough.</td></tr></table><p>Remember: <b>enough comes AFTER an adjective or adverb</b> but <b>BEFORE a noun</b>: ✘ enough tall → ✔ tall enough. ✘ money enough → ✔ enough money.</p><h4>2. enough + to-infinitive / for</h4><p><i>She is old enough to drive. I'm not tall enough to reach the shelf. He speaks English well enough to be a guide. There is enough food for everyone.</i> (✘ enough for to reach)</p><h4>3. Negative meaning</h4><p><b>not + adjective + enough</b> means the opposite of the adjective: <i>The room isn't big enough</i> = it is too small. <i>The water isn't hot enough</i> = it is too cold.</p><h4>4. too vs enough</h4><p><b>too</b> = more than necessary (a problem): <i>too hot, too expensive.</i> <b>enough</b> = the amount needed: <i>hot enough, cheap enough.</i> Compare: <i>It's too cold to swim</i> = <i>It isn't warm enough to swim.</i></p><h4>5. Common mistakes</h4><p>✘ He is enough tall → ✔ He is tall enough. ✘ enough of food → ✔ enough food. ✘ enough for to reach → ✔ enough to reach.</p>`,
bm:`<h4>1. Kedudukan enough</h4><p><b>adjektif / kata keterangan + enough:</b> <i>She is tall enough (Dia cukup tinggi). He didn't run fast enough.</i> <b>enough + kata nama:</b> <i>We have enough money (Kami ada wang yang cukup). There is enough food for everyone.</i> <b>kata kerja + enough:</b> <i>That's enough! (Cukuplah!) You don't sleep enough.</i></p><p>Ingat: <b>enough diletakkan SELEPAS adjektif atau kata keterangan</b> tetapi <b>SEBELUM kata nama</b>: ✘ enough tall → ✔ tall enough. ✘ money enough → ✔ enough money.</p><h4>2. enough + to-infinitif / for</h4><p><i>She is old enough to drive (Dia cukup umur untuk memandu). I'm not tall enough to reach the shelf (Saya tidak cukup tinggi untuk mencapai rak itu). He speaks English well enough to be a guide. There is enough food for everyone.</i> (✘ enough for to reach)</p><h4>3. Maksud negatif</h4><p><b>not + adjektif + enough</b> bermaksud bertentangan dengan adjektif itu: <i>The room isn't big enough</i> = bilik itu terlalu kecil. <i>The water isn't hot enough</i> = air itu terlalu sejuk.</p><h4>4. too berbanding enough</h4><p><b>too</b> (terlalu) = lebih daripada perlu (masalah): <i>too hot, too expensive.</i> <b>enough</b> (cukup) = jumlah yang diperlukan: <i>hot enough, cheap enough.</i> Bandingkan: <i>It's too cold to swim</i> = <i>It isn't warm enough to swim.</i></p><h4>5. Kesilapan lazim</h4><p>✘ He is enough tall → ✔ He is tall enough. ✘ enough of food → ✔ enough food. ✘ enough for to reach → ✔ enough to reach.</p>`,
q:[["She is old ___ to drive.",["enough","too","very","so"],0],["We have ___ money.",["enough","enoughly","too much of","so"],0],["Which is correct?",["He is enough tall.","He is tall enough.","He is enough tall to play.","He tall is enough."],1],["I haven't got ___ time.",["enough","too","very","so"],0],["The water is not hot ___.",["enough","too","very","so"],0],["'Not big enough' means:",["too small","too big","very big","big enough"],0],["He didn't run fast ___ to win.",["enough","too","very","so"],0],["Which is correct?",["There is enough food for everyone.","There is food enough everyone.","There is enough of food for everyone.","There enough is food for everyone."],0],["'That's ___!' (stop it)",["enough","enoughly","enoughed","enoughs"],0],["'Too hot' means:",["more than needed, a problem","not enough","just right","cold"],0],["She speaks English well ___ to be a guide.",["enough","too","very","so"],0],["'Enough' goes ___ an adjective.",["after","before","instead of","never with"],0],["'Enough' goes ___ a noun.",["before","after","instead of","never with"],0],["Which is correct?",["I'm not tall enough to reach the shelf.","I'm not enough tall to reach the shelf.","I'm not tall enough for reach the shelf.","I'm not enough tall for reach."],0],["The room isn't big ___ for all of us.",["enough","too","very","so"],0]]},
{t:["Verbs and Prepositions","Kata Kerja dan Kata Sendi"],
en:`<h4>1. Why learn them?</h4><p>Many English verbs are always followed by a specific preposition. The preposition is usually different from the equivalent Malay word, so learn them together.</p><h4>2. Common verb + preposition</h4><table><tr><th>Verb</th><th>Preposition</th><th>Example</th></tr><tr><td>depend / rely</td><td><b>on</b></td><td>It depends on the weather.</td></tr><tr><td>listen</td><td><b>to</b></td><td>I'm listening to music.</td></tr><tr><td>wait / ask / look</td><td><b>for</b></td><td>We're waiting for the bus.</td></tr><tr><td>belong</td><td><b>to</b></td><td>She belongs to the tennis club.</td></tr><tr><td>apologise / pay</td><td><b>for</b></td><td>He apologised for being late.</td></tr><tr><td>arrive</td><td><b>at</b> (place) / <b>in</b> (city, country)</td><td>They arrived at the airport. We arrived in Japan.</td></tr><tr><td>agree</td><td><b>with</b> (person)</td><td>I agree with you.</td></tr><tr><td>believe</td><td><b>in</b></td><td>I believe in hard work.</td></tr><tr><td>complain / worry</td><td><b>about</b></td><td>She complained about the noise.</td></tr><tr><td>suffer</td><td><b>from</b></td><td>He suffers from headaches.</td></tr><tr><td>think</td><td><b>about / of</b></td><td>I'm thinking about buying a car.</td></tr><tr><td>laugh / look</td><td><b>at</b></td><td>Don't laugh at him.</td></tr></table><h4>3. After a preposition use -ing</h4><p><i>He apologised for being late. I'm thinking about buying a car.</i></p><h4>4. Verbs with NO preposition</h4><p><b>discuss, marry, enter, reach, attend, answer, mention</b>: ✘ discuss about → ✔ discuss the plan. ✘ marry with → ✔ marry a doctor. ✘ enter into the room → ✔ enter the room.</p>`,
bm:`<h4>1. Mengapa perlu dipelajari?</h4><p>Banyak kata kerja Bahasa Inggeris sentiasa diikuti kata sendi tertentu. Kata sendi itu selalunya berbeza daripada perkataan Melayu yang setara, jadi pelajari bersama.</p><h4>2. Kata kerja + kata sendi lazim</h4><p><b>depend / rely on</b> (bergantung pada): <i>It depends on the weather.</i> <b>listen to</b> (mendengar): <i>I'm listening to music.</i> <b>wait / ask / look for</b> (menunggu / meminta / mencari): <i>We're waiting for the bus.</i> <b>belong to</b> (milik): <i>She belongs to the tennis club.</i> <b>apologise / pay for</b> (memohon maaf kerana / membayar): <i>He apologised for being late.</i> <b>arrive at</b> (tempat) / <b>in</b> (bandar, negara): <i>They arrived at the airport. We arrived in Japan.</i> <b>agree with</b> (bersetuju dengan seseorang): <i>I agree with you.</i> <b>believe in</b> (percaya pada): <i>I believe in hard work.</i> <b>complain / worry about</b> (mengadu / risau tentang): <i>She complained about the noise.</i> <b>suffer from</b> (menderita): <i>He suffers from headaches.</i> <b>think about / of</b> (memikirkan): <i>I'm thinking about buying a car.</i> <b>laugh / look at</b> (mentertawakan / melihat): <i>Don't laugh at him.</i></p><h4>3. Selepas kata sendi guna -ing</h4><p><i>He apologised for being late. I'm thinking about buying a car.</i></p><h4>4. Kata kerja TANPA kata sendi</h4><p><b>discuss</b> (membincangkan), <b>marry</b> (berkahwin dengan), <b>enter</b> (memasuki), <b>reach</b> (sampai ke), <b>attend</b> (menghadiri), <b>answer</b> (menjawab), <b>mention</b> (menyebut): ✘ discuss about → ✔ discuss the plan. ✘ marry with → ✔ marry a doctor. ✘ enter into the room → ✔ enter the room. Dalam Bahasa Melayu "membincangkan tentang" atau "berkahwin dengan" lazim, tetapi tidak dalam Bahasa Inggeris.</p>`,
q:[["It depends ___ the weather.",["of","on","in","at"],1],["I'm listening ___ music.",["to","at","for","on"],0],["We're waiting ___ the bus.",["for","to","at","on"],0],["She belongs ___ the tennis club.",["to","at","in","of"],0],["He apologised ___ being late.",["for","of","about","at"],0],["They arrived ___ the airport.",["at","in","to","on"],0],["I agree ___ you.",["with","to","on","at"],0],["Which is correct?",["We discussed about the plan.","We discussed the plan.","We discussed on the plan.","We discussed of the plan."],1],["She complained ___ the noise.",["about","for","at","with"],0],["I believe ___ hard work.",["in","on","at","to"],0],["Which is correct?",["She married with a doctor.","She married a doctor.","She married at a doctor.","She married for a doctor."],1],["He suffers ___ headaches.",["from","of","with","for"],0],["I'm thinking ___ buying a car.",["about","on","at","for"],0],["Don't laugh ___ him.",["at","to","on","for"],0],["I pay ___ my lunch.",["for","to","at","of"],0]]},
{t:["Verbs + -ing or Infinitive (Change of Meaning)","Kata Kerja + -ing atau Infinitif (Makna Berubah)"],
en:`<h4>1. Same verb, different meaning</h4><p>Some verbs can be followed by <b>-ing</b> or by <b>to + infinitive</b>, but the <u>meaning changes</u>. In general, <b>-ing</b> refers to something that happened or an activity itself; <b>to + infinitive</b> refers to a purpose, intention or something still to be done.</p><table><tr><th>Verb</th><th>+ -ing</th><th>+ to infinitive</th></tr><tr><td><b>remember</b></td><td>recall a past event: I remember locking the door. (I'm sure I did it)</td><td>not forget a task: Remember to lock the door before you leave.</td></tr><tr><td><b>forget</b></td><td>not recall a past event: I'll never forget seeing the sea.</td><td>fail to do something: I forgot to bring my wallet.</td></tr><tr><td><b>stop</b></td><td>end an activity: He stopped running. (he quit)</td><td>pause in order to do something: He stopped to buy water.</td></tr><tr><td><b>try</b></td><td>experiment: Try drinking some water. (see if it helps)</td><td>make an effort: I tried to open the window, but it was stuck.</td></tr><tr><td><b>regret</b></td><td>feel sorry about the past: I regret shouting at him.</td><td>formal, sorry to announce: We regret to inform you…</td></tr><tr><td><b>go on</b></td><td>continue the same thing: She went on talking after the break.</td><td>move to the next thing: He went on to become a doctor.</td></tr><tr><td><b>mean</b></td><td>involve: This job means getting up early.</td><td>intend: I didn't mean to hurt you.</td></tr></table><h4>2. need + -ing</h4><p><b>need + -ing</b> has a passive meaning: <i>The car needs washing</i> (= needs to be washed). <b>need + to</b>: <i>I need to wash the car.</i></p><h4>3. Common mistakes</h4><p>✘ I stopped to smoke (when you mean quit) → ✔ I stopped smoking. ✘ Remember locking the door (as a reminder) → ✔ Remember to lock the door.</p>`,
bm:`<h4>1. Kata kerja sama, makna berbeza</h4><p>Sesetengah kata kerja boleh diikuti <b>-ing</b> atau <b>to + infinitif</b>, tetapi <u>maknanya berubah</u>. Secara umum, <b>-ing</b> merujuk kepada perkara yang telah berlaku atau aktiviti itu sendiri; <b>to + infinitif</b> merujuk kepada tujuan, niat atau sesuatu yang masih perlu dilakukan.</p><p><b>remember</b> + -ing = teringat peristiwa lampau: <i>I remember locking the door</i> (Saya ingat saya sudah mengunci pintu). + to = tidak lupa melakukan tugas: <i>Remember to lock the door before you leave</i> (Ingat kunci pintu sebelum pergi).</p><p><b>forget</b> + -ing = tidak ingat peristiwa lampau: <i>I'll never forget seeing the sea.</i> + to = terlupa melakukan: <i>I forgot to bring my wallet</i> (Saya terlupa membawa dompet).</p><p><b>stop</b> + -ing = berhenti melakukan: <i>He stopped running</i> (Dia berhenti berlari). + to = berhenti seketika untuk melakukan sesuatu: <i>He stopped to buy water</i> (Dia berhenti untuk membeli air).</p><p><b>try</b> + -ing = mencuba (eksperimen): <i>Try drinking some water</i> (Cuba minum air, mungkin membantu). + to = berusaha: <i>I tried to open the window, but it was stuck.</i></p><p><b>regret</b> + -ing = menyesal tentang masa lampau: <i>I regret shouting at him.</i> + to = (formal) dukacita memaklumkan: <i>We regret to inform you…</i></p><p><b>go on</b> + -ing = terus melakukan perkara yang sama: <i>She went on talking after the break.</i> + to = beralih kepada perkara seterusnya: <i>He went on to become a doctor</i> (Dia kemudian menjadi doktor).</p><p><b>mean</b> + -ing = melibatkan: <i>This job means getting up early.</i> + to = berniat: <i>I didn't mean to hurt you</i> (Saya tidak berniat menyakiti anda).</p><h4>2. need + -ing</h4><p><b>need + -ing</b> bermakna pasif: <i>The car needs washing</i> (= perlu dibasuh). <b>need + to</b>: <i>I need to wash the car.</i></p><h4>3. Kesilapan lazim</h4><p>✘ I stopped to smoke (maksudnya berhenti merokok) → ✔ I stopped smoking. ✘ Remember locking the door (sebagai peringatan) → ✔ Remember to lock the door.</p>`,
q:[["I remember ___ the door. I'm sure I locked it.",["to lock","locking","lock","locked"],1],["Remember ___ the door before you leave.",["to lock","locking","lock","locks"],0],["He stopped ___ because he was tired. (quit the activity)",["to run","running","run","ran"],1],["He stopped ___ some water. (paused in order to)",["to buy","buying","buy","bought"],0],["I tried ___ the window, but it was stuck.",["to open","opening","open","opened"],0],["If you have a headache, try ___ some water. (experiment)",["to drink","drinking","drink","drank"],1],["I forgot ___ my wallet, so I couldn't pay.",["bringing","to bring","bring","brought"],1],["I'll never forget ___ the sea for the first time.",["seeing","to see","see","saw"],0],["I regret ___ at him. I shouldn't have shouted.",["to shout","shouting","shout","shouted"],1],["She went on ___ after the break. (continued)",["talk","talking","to talk","talked"],1],["After school he went on ___ a doctor. (next step)",["becoming","to become","become","became"],1],["I didn't mean ___ you. (intend)",["hurting","to hurt","hurt","hurts"],1],["This job means ___ early. (involves)",["getting up","to get up","get up","gets up"],0],["The car needs ___. (it must be washed)",["washing","to wash","wash","washes"],0],["'Stop to smoke' and 'stop smoking' are:",["different: pause to smoke vs quit","the same","only the first is correct","only the second is correct"],0]]},
{t:["Wishes: 'wish' and 'if only'","Harapan: 'wish' dan 'if only'"],
en:`<h4>1. Meaning</h4><p><b>wish</b> and <b>if only</b> express that we want a situation to be different from reality. The tense moves one step back, like in the second and third conditionals. <b>If only</b> is stronger and more emotional.</p><table><tr><th>Situation</th><th>Structure</th><th>Example</th></tr><tr><td>Present (unreal or unwanted)</td><td>wish + <b>past simple</b></td><td>I wish I had a car. (I don't have one) I wish I were taller. If only I had more time!</td></tr><tr><td>Ability now</td><td>wish + <b>could</b></td><td>I wish I could speak French.</td></tr><tr><td>Past regret</td><td>wish + <b>past perfect</b></td><td>I wish I had studied harder. I wish I hadn't been so rude.</td></tr><tr><td>Complaint / annoyance / change in future</td><td>wish + <b>would</b></td><td>I wish it would stop raining. I wish you wouldn't shout. If only he would listen!</td></tr></table><h4>2. Important rules</h4><p><b>(a)</b> Use <b>were</b> for all persons in formal English (I wish I were taller), though <i>was</i> is common in speech. <b>(b)</b> Do <u>not</u> use <i>would</i> for yourself or for things you control: ✘ I wish I would have more money → ✔ I wish I had more money. <b>(c)</b> Do not use <i>would have</i> after wish: ✘ I wish I would have studied → ✔ I wish I had studied.</p><h4>3. wish vs hope</h4><p><b>hope</b> is for real possibilities (I hope you feel better). <b>wish</b> is for unreal situations (I wish I felt better).</p><h4>4. Common mistakes</h4><p>✘ I wish I have a car → ✔ I wish I had a car. ✘ I wish I will pass → ✔ I hope I will pass. ✘ I wish I studied (regret about past) → ✔ I wish I had studied.</p>`,
bm:`<h4>1. Maksud</h4><p><b>wish</b> dan <b>if only</b> menyatakan bahawa kita mahu sesuatu keadaan berbeza daripada hakikat. Kala berundur satu langkah, seperti dalam conditional kedua dan ketiga. <b>If only</b> (kalaulah) lebih kuat dan lebih beremosi.</p><p><b>Masa kini (tidak benar atau tidak diingini):</b> wish + <b>past simple</b>: <i>I wish I had a car (Alangkah baiknya jika saya ada kereta). I wish I were taller (Andai saya lebih tinggi). If only I had more time!</i></p><p><b>Keupayaan kini:</b> wish + <b>could</b>: <i>I wish I could speak French.</i></p><p><b>Kekesalan lampau:</b> wish + <b>past perfect</b>: <i>I wish I had studied harder (Kalaulah dahulu saya belajar lebih gigih). I wish I hadn't been so rude.</i></p><p><b>Rungutan / kerengsaan / perubahan masa depan:</b> wish + <b>would</b>: <i>I wish it would stop raining (Kalaulah hujan berhenti). I wish you wouldn't shout (Janganlah menjerit). If only he would listen!</i></p><h4>2. Peraturan penting</h4><p><b>(a)</b> Guna <b>were</b> untuk semua subjek dalam Bahasa Inggeris formal (I wish I were taller), walaupun <i>was</i> lazim dalam pertuturan. <b>(b)</b> <u>Jangan</u> guna <i>would</i> untuk diri sendiri atau perkara yang anda kawal: ✘ I wish I would have more money → ✔ I wish I had more money. <b>(c)</b> Jangan guna <i>would have</i> selepas wish: ✘ I wish I would have studied → ✔ I wish I had studied.</p><h4>3. wish berbanding hope</h4><p><b>hope</b> (harap) untuk kemungkinan sebenar (I hope you feel better). <b>wish</b> untuk keadaan yang tidak benar (I wish I felt better).</p><h4>4. Kesilapan lazim</h4><p>✘ I wish I have a car → ✔ I wish I had a car. ✘ I wish I will pass → ✔ I hope I will pass. ✘ I wish I studied (kekesalan lampau) → ✔ I wish I had studied.</p>`,
q:[["I don't have a car. I wish I ___ a car.",["have","had","would have","have had"],1],["I wish I ___ taller.",["am","were","would be","will be"],1],["I failed the exam. I wish I ___ harder.",["studied","had studied","would study","study"],1],["It's raining again. I wish it ___ stop.",["will","would","had","is"],1],["If only I ___ more time!",["have","had","would have","am having"],1],["I wish I ___ speak French. (ability now)",["can","could","would","will"],1],["Which is correct?",["I wish I would have more money.","I wish I had more money.","I wish I have more money.","I wish I will have more money."],1],["'I wish I had gone' expresses:",["regret about the past","a present wish","a future plan","a fact"],0],["'If only he would listen' expresses:",["annoyance","a fact","a past regret","a rule"],0],["'If only' compared with 'wish' is:",["stronger and more emotional","weaker","unrelated","negative"],0],["I wish I ___ so rude to her yesterday.",["wasn't","hadn't been","wouldn't be","am not"],1],["She lives far away. She wishes she ___ closer.",["lived","lives","will live","live"],0],["I wish you ___ so loudly. (complaint)",["wouldn't shout","didn't shouting","won't shout","haven't shouted"],0],["Which is correct for a regret about the past?",["I wish I would have studied.","I wish I had studied.","I wish I have studied.","I wish I study."],1],["'Wish' + past simple refers to:",["an unreal present or future situation","a real past","a real future","a habit"],0]]},
{t:["C1 · Advanced Passives Review","C1 · Ulasan Pasif Lanjutan"],
en:`<h4>1. Passive forms beyond the basics</h4><table><tr><th>Form</th><th>Example</th></tr><tr><td>Modal passive: modal + be + pp</td><td>The report must be finished by Friday.</td></tr><tr><td>Future perfect passive</td><td>The bridge will have been completed by next year.</td></tr><tr><td>Passive infinitive: to be + pp / to have been + pp</td><td>The passengers expected to be informed. The film is thought to have been seen by millions.</td></tr><tr><td>Passive gerund: being + pp / having been + pp</td><td>She dislikes being criticised in public. He denied having been warned.</td></tr><tr><td>Prepositional passive</td><td>The matter is being looked into.</td></tr></table><h4>2. Reporting passives</h4><p>Used in formal and academic writing to report general opinion: <i>It is believed that the thief has escaped abroad. He is said to have earned over £1 million. The company is reported to be losing money.</i> Use <b>to + infinitive</b> for the same time as the reporting verb, and <b>to have + pp</b> for an earlier time.</p><h4>3. have / get something done</h4><p><b>have + object + pp</b> for services: <i>We had the roof repaired last week.</i> <b>get</b> is more informal and often shows an unplanned or unlucky event: <i>He got arrested. She got her bag stolen.</i></p><h4>4. Two objects</h4><p><i>She was given a prize.</i> or <i>A prize was given to her.</i> The person-subject version is more usual.</p><h4>5. Verbs not used in the passive</h4><p>State verbs such as <b>have (possess), fit, suit, resemble, lack, cost</b> do not normally have a passive: ✘ She is resembled by her mother.</p><h4>6. Style</h4><p>Choose the passive to focus on the action or result, when the agent is unknown or obvious, or for an impersonal academic tone. Use <b>by</b> + agent only for new or important information.</p>`,
bm:`<h4>1. Bentuk pasif selain yang asas</h4><p><b>Pasif modal (modal + be + pp):</b> The report must be finished by Friday. <b>Future perfect pasif:</b> The bridge will have been completed by next year (Jambatan itu sudah siap menjelang tahun depan). <b>Infinitif pasif (to be + pp / to have been + pp):</b> The passengers expected to be informed. The film is thought to have been seen by millions. <b>Gerund pasif (being + pp / having been + pp):</b> She dislikes being criticised in public (Dia tidak suka dikritik di khalayak ramai). He denied having been warned. <b>Pasif dengan kata sendi:</b> The matter is being looked into (Perkara itu sedang disiasat).</p><h4>2. Pasif pelaporan</h4><p>Digunakan dalam penulisan formal dan akademik untuk melaporkan pendapat umum: <i>It is believed that the thief has escaped abroad (Dipercayai pencuri itu telah melarikan diri ke luar negara). He is said to have earned over £1 million (Dikatakan dia memperoleh lebih £1 juta). The company is reported to be losing money.</i> Guna <b>to + infinitif</b> untuk masa yang sama dengan kata kerja pelapor, dan <b>to have + pp</b> untuk masa yang lebih awal.</p><h4>3. have / get something done</h4><p><b>have + objek + pp</b> untuk perkhidmatan: <i>We had the roof repaired last week (Kami membaiki bumbung minggu lepas, dibuat oleh orang lain).</i> <b>get</b> lebih tidak formal dan sering menunjukkan kejadian yang tidak dirancang atau malang: <i>He got arrested. She got her bag stolen.</i></p><h4>4. Dua objek</h4><p><i>She was given a prize.</i> atau <i>A prize was given to her.</i> Versi dengan orang sebagai subjek lebih lazim.</p><h4>5. Kata kerja yang tidak digunakan dalam pasif</h4><p>Kata kerja keadaan seperti <b>have (memiliki), fit, suit, resemble, lack, cost</b> biasanya tiada pasif: ✘ She is resembled by her mother.</p><h4>6. Gaya</h4><p>Pilih pasif untuk menumpukan pada perbuatan atau hasil, apabila pelaku tidak diketahui atau sudah jelas, atau untuk nada akademik yang tidak peribadi. Guna <b>by</b> + pelaku hanya untuk maklumat baharu atau penting.</p>`,
q:[["The bridge ___ by the time we return next year.",["will complete","will be completing","will have been completed","is completed"],2],["He is said ___ over £1 million last year.",["to earn","to have earned","to be earning","that he earned"],1],["I hate ___ like a child.",["treating","to treat","being treated","be treated"],2],["We had the roof ___ last week.",["repair","repairing","repaired","to repair"],2],["'She was given a prize.' Which is another correct passive?",["A prize was given to her.","A prize gave her.","A prize was given her to.","A prize has given to her."],0],["The proposal ___ at the moment.",["is considering","is being considered","has considered","considers"],1],["The matter is being ___.",["looked into","looked","look into","looking into"],0],["Which sentence is correct?",["It is believed that the thief has escaped abroad.","It believes that the thief has escaped abroad.","It is believed the thief to has escaped.","It is believed that the thief escaped to have abroad."],0],["Which verb is NOT normally used in the passive?",["resemble","build","steal","write"],0],["'He got arrested last night.' The 'get' passive is:",["informal and often for unplanned events","formal legal language","never used","future only"],0],["The passengers expected ___ at 6 p.m.",["to be informed","to inform","informing","to informing"],0],["She dislikes ___ in public.",["criticising","being criticised","to criticise","be criticised"],1],["The film is thought ___ by millions. (already seen)",["to be seen","to have been seen","seeing","to see"],1],["Why choose the passive in academic writing?",["to focus on the action or result","to sound informal","to always show who is guilty","to avoid verbs"],0],["Which is correct?",["The report must be finished by Friday.","The report must finished by Friday.","The report must be finish by Friday.","The report must been finished by Friday."],0]]},
{t:["C1 · Advanced Present Simple & Continuous","C1 · Kala Kini Mudah & Berterusan Lanjutan"],
en:`<h4>1. Present simple: beyond habits and facts</h4><table><tr><th>Use</th><th>Example</th></tr><tr><td>Narrative: jokes, plot summaries, commentary, headlines</td><td>In the novel, a young woman inherits a farm. Hamilton overtakes on the final lap.</td></tr><tr><td>Timetables and schedules</td><td>The train leaves at 7.05 tomorrow.</td></tr><tr><td>Performative verbs (the words do the action)</td><td>I promise I'll be on time. I apologise. I declare the meeting open.</td></tr><tr><td>Soft reporting (hear, gather, understand, see)</td><td>I hear you've passed your exams. I gather she has resigned.</td></tr><tr><td>Future in time and conditional clauses</td><td>I'll call you when I arrive. If it rains, we'll stay in.</td></tr></table><h4>2. Present continuous: beyond "now"</h4><table><tr><th>Use</th><th>Example</th></tr><tr><td>Annoying repeated habit, with <b>always / constantly / forever / continually</b></td><td>He's always borrowing my pen without asking. She is constantly complaining about the noise.</td></tr><tr><td>Temporary situation</td><td>I'm living with my aunt until I find a flat.</td></tr><tr><td>Changing or developing situation</td><td>Prices are rising rapidly. The climate is getting warmer.</td></tr><tr><td>Arrangement in the future</td><td>We're meeting the solicitor on Monday.</td></tr><tr><td>Temporary behaviour: <b>be being</b></td><td>You're being silly. (not your usual character)</td></tr></table><h4>3. Simple or continuous: a change of meaning</h4><p><i>I live in London</i> (permanent) vs <i>I'm living in London</i> (temporary). <i>What do you do?</i> asks about your job; <i>What are you doing?</i> asks about now.</p><h4>4. State verbs with two meanings</h4><p><b>think</b> (opinion, simple) vs <i>I'm thinking of moving house</i> (mental process). <b>have, see, taste, smell, be</b> follow the same pattern. Verbs such as <b>belong, know, resemble, consist of</b> are not used in the continuous.</p>`,
bm:`<h4>1. Kala kini mudah: lebih daripada tabiat dan fakta</h4><p><b>Penceritaan:</b> jenaka, ringkasan plot, ulasan langsung, tajuk berita: <i>In the novel, a young woman inherits a farm (Dalam novel itu, seorang wanita muda mewarisi sebuah ladang). Hamilton overtakes on the final lap.</i> <b>Jadual:</b> <i>The train leaves at 7.05 tomorrow.</i> <b>Kata kerja performatif</b> (kata-kata itu sendiri menjadi perbuatan): <i>I promise I'll be on time. I apologise. I declare the meeting open.</i> <b>Pelaporan lembut</b> (hear, gather, understand, see): <i>I hear you've passed your exams (Saya dengar anda lulus peperiksaan). I gather she has resigned.</i> <b>Masa depan dalam klausa masa dan syarat:</b> <i>I'll call you when I arrive. If it rains, we'll stay in.</i></p><h4>2. Kala kini berterusan: lebih daripada "sekarang"</h4><p><b>Tabiat berulang yang menjengkelkan,</b> dengan <b>always / constantly / forever / continually</b>: <i>He's always borrowing my pen without asking (Dia sentiasa meminjam pen saya tanpa bertanya). She is constantly complaining about the noise.</i> <b>Keadaan sementara:</b> <i>I'm living with my aunt until I find a flat.</i> <b>Keadaan yang berubah:</b> <i>Prices are rising rapidly. The climate is getting warmer.</i> <b>Urusan masa depan:</b> <i>We're meeting the solicitor on Monday.</i> <b>Kelakuan sementara (be being):</b> <i>You're being silly</i> (Anda sedang berkelakuan bodoh; bukan sifat biasa anda).</p><h4>3. Mudah atau berterusan: makna berubah</h4><p><i>I live in London</i> (tetap) berbanding <i>I'm living in London</i> (sementara). <i>What do you do?</i> bertanya pekerjaan; <i>What are you doing?</i> bertanya apa yang sedang dilakukan sekarang.</p><h4>4. Kata kerja keadaan dengan dua makna</h4><p><b>think</b> (pendapat, mudah) berbanding <i>I'm thinking of moving house</i> (proses berfikir). <b>have, see, taste, smell, be</b> mengikut corak yang sama. Kata kerja seperti <b>belong, know, resemble, consist of</b> tidak digunakan dalam bentuk berterusan.</p>`,
q:[["'He's always borrowing my pen without asking' expresses:",["annoyance at a repeated habit","a permanent habit","a future plan","a fact"],0],["'I'm living with my aunt until I find a flat' suggests the situation is:",["temporary","permanent","finished","hypothetical"],0],["'Prices are rising rapidly' shows:",["a changing situation","a timetable","a habit","a command"],0],["The present simple is typical in:",["plot summaries and commentary","only the future","only questions","never in narratives"],0],["'I promise I'll be on time.' 'I promise' is:",["a performative present simple","a habit","a temporary action","a plan"],0],["'You're being silly' means:",["you are behaving silly now","you are always silly","you will be silly","you were silly"],0],["'I hear you've passed your exams.' The present simple is used to:",["report news softly","show a habit","show a timetable","give an order"],0],["The train ___ at 7.05 tomorrow.",["leaves","left","has left","had left"],0],["I'll call you when I ___.",["arrive","will arrive","would arrive","arrived"],0],["Which is correct?",["She is constantly complaining about the noise.","She is constantly complain about the noise.","She constantly is complaining the noise.","She has constantly complaining about the noise."],0],["Which verb is a state verb and rarely used in the continuous?",["belong","run","dance","shout"],0],["In 'I'm thinking of moving house', 'think' is:",["a mental process","an opinion","a state","permanent"],0],["'What do you do?' asks about:",["your job","what you are doing now","your plans","your past"],0],["'What are you doing?' asks about:",["what is happening now","your job","your habit","your past"],0],["Which sentence is correct British English?",["I think she is right.","I am thinking she is right.","I thinking she is right.","I am think she is right."],0]]},
{t:["C1 · Avoiding Repetition in a Text","C1 · Mengelak Pengulangan dalam Teks"],
en:`<h4>1. Why avoid repetition?</h4><p>Good writing links ideas without repeating the same words. At C1 you are expected to use reference, substitution and ellipsis to make a text cohesive.</p><h4>2. Techniques</h4><table><tr><th>Technique</th><th>Example</th></tr><tr><td><b>Pronouns</b> (it, they, he)</td><td>The committee met on Friday. It approved the plan.</td></tr><tr><td><b>one / ones</b> (replaces a countable noun)</td><td>I need a new phone. The old one is broken. I prefer green apples to red ones.</td></tr><tr><td><b>so / not</b> after hope, think, believe, expect</td><td>Will it rain? – I hope so. / I hope not.</td></tr><tr><td><b>do so</b> (replaces a verb phrase)</td><td>They asked her to leave, and she did so.</td></tr><tr><td><b>so + auxiliary + subject; neither/nor + auxiliary + subject</b></td><td>She plays the piano, and so does her sister. He didn't pass, nor did his friend.</td></tr><tr><td><b>this / that / these / those + noun</b></td><td>The council banned cars. This decision angered residents.</td></tr><tr><td><b>the former / the latter</b></td><td>Cars and bicycles are both popular; the former are faster, the latter are cheaper.</td></tr><tr><td><b>Synonyms and general words</b> (hypernyms)</td><td>car → vehicle; problem → difficulty</td></tr><tr><td><b>Nominalisation</b></td><td>They decided to leave. → Their decision caused debate.</td></tr></table><h4>3. Cautions</h4><p>Too many pronouns cause <b>ambiguity</b> (who does <i>it</i> or <i>he</i> refer to?). <b>this / that</b> alone may be vague; <b>this + noun</b> is clearer. Do not replace words so often that the meaning becomes unclear. Keep parallel structures: <i>She likes reading, writing and painting.</i></p>`,
bm:`<h4>1. Mengapa mengelak pengulangan?</h4><p>Penulisan yang baik menghubungkan idea tanpa mengulang perkataan yang sama. Pada tahap C1 anda dijangka menggunakan rujukan, penggantian dan ellipsis untuk menjadikan teks padu (cohesive).</p><h4>2. Teknik</h4><p><b>Kata ganti nama (it, they, he):</b> <i>The committee met on Friday. It approved the plan.</i> <b>one / ones</b> (menggantikan kata nama terbilang): <i>I need a new phone. The old one is broken. I prefer green apples to red ones.</i> <b>so / not</b> selepas hope, think, believe, expect: <i>Will it rain? – I hope so. / I hope not (Saya harap begitu / Saya harap tidak).</i> <b>do so</b> (menggantikan frasa kerja): <i>They asked her to leave, and she did so.</i> <b>so + kata kerja bantu + subjek; neither/nor + kata kerja bantu + subjek:</b> <i>She plays the piano, and so does her sister. He didn't pass, nor did his friend.</i> <b>this / that / these / those + kata nama:</b> <i>The council banned cars. This decision angered residents.</i> <b>the former / the latter</b> (yang pertama / yang kemudian): <i>Cars and bicycles are both popular; the former are faster, the latter are cheaper.</i> <b>Sinonim dan perkataan umum:</b> car → vehicle; problem → difficulty. <b>Nominalisasi:</b> <i>They decided to leave. → Their decision caused debate.</i></p><h4>3. Amaran</h4><p>Terlalu banyak kata ganti menyebabkan <b>kekaburan</b> (siapa yang dirujuk oleh <i>it</i> atau <i>he</i>?). <b>this / that</b> sahaja mungkin kabur; <b>this + kata nama</b> lebih jelas. Jangan menggantikan perkataan terlalu kerap sehingga maksud tidak jelas. Kekalkan struktur selari: <i>She likes reading, writing and painting.</i></p>`,
q:[["I need a new phone. The old ___ is broken.",["one","it","ones","that"],0],["'Are you coming?' 'I hope ___.'",["so","it","that","yes"],0],["He promised to call, and he ___ so.",["did","made","had","was"],0],["Cars and bicycles are both popular; the ___ are cheaper. (bicycles)",["latter","former","last","later"],0],["The council banned cars. This ___ angered residents.",["decision","decide","deciding","decides"],0],["Which avoids repetition best?",["I like green apples more than red ones.","I like green apples more than red apples.","I like green apples more than red apple.","I like green apples more than red."],0],["'Will it rain?' 'I hope ___.' (the answer is no)",["not","no","so not","it not"],0],["Using a more general word such as 'vehicle' for 'car' is:",["using a hypernym","ellipsis only","punctuation","inversion"],0],["In 'the former … the latter', 'the latter' refers to:",["the second of two things","the first of two","the last of many","the next one"],0],["She plays the piano, and ___ does her sister.",["so","as","also","too"],0],["He didn't pass the test, nor ___ his friend.",["did","does","had","was"],0],["Too many uses of 'it' or 'he' may cause:",["ambiguity","more formality","fewer ideas","correct style"],0],["The report was late. ___ annoyed the manager.",["This","These","One","Such"],0],["They asked her to leave and she did ___.",["so","it so","that so","such"],0],["Which pair shows nominalisation?",["decided → the decision","quick → quickly","go → going","big → bigger"],0]]},
{t:["C1 · Contrasting Ideas","C1 · Menunjukkan Percanggahan (Lanjutan)"],
en:`<h4>1. Beyond although and but</h4><table><tr><th>Structure</th><th>Example</th></tr><tr><td><b>although / even though / though</b> + clause</td><td>Although he was tired, he continued.</td></tr><tr><td><b>despite / in spite of</b> + noun / -ing / the fact that</td><td>Despite the delay, we arrived on time. In spite of the fact that she was ill, she attended.</td></tr><tr><td><b>much as</b> + clause (formal)</td><td>Much as I admire her, I cannot agree with her proposal.</td></tr><tr><td><b>adjective / adverb + as + subject + verb</b> (inversion for contrast)</td><td>Tired as he was, he carried on working. Try as she might, she could not open it.</td></tr><tr><td><b>however / whatever / no matter</b> + adjective</td><td>However hard I try, I can't remember her name.</td></tr><tr><td><b>for all</b> + noun</td><td>For all his wealth, he is unhappy.</td></tr><tr><td><b>albeit</b> + adjective / phrase (formal)</td><td>a slow, albeit steady, improvement</td></tr></table><h4>2. Linking between sentences</h4><p><b>However, nevertheless, nonetheless, even so, still, that said, yet</b> start a new sentence or follow a semicolon, with commas: <i>The plan was cheap. Nonetheless, it was unreliable.</i> <b>On the one hand … on the other hand</b> balances two views. <b>In contrast, by contrast, conversely</b> introduce the opposite idea. <b>Whereas / while</b> contrast two facts: <i>Ali is tall, whereas his brother is short.</i></p><h4>3. Informal "though"</h4><p><i>It was cheap. It wasn't very good, though.</i> (<b>though</b> at the end of a sentence is informal.)</p><h4>4. Common mistakes</h4><p>✘ Despite of the delay → ✔ Despite the delay. ✘ Although he was tired, but he continued → ✔ one connector only. ✘ In spite he was tired → ✔ In spite of the fact that he was tired.</p>`,
bm:`<h4>1. Selain although dan but</h4><p><b>although / even though / though</b> + klausa: <i>Although he was tired, he continued.</i> <b>despite / in spite of</b> + kata nama / -ing / the fact that: <i>Despite the delay, we arrived on time. In spite of the fact that she was ill, she attended.</i> <b>much as</b> + klausa (formal): <i>Much as I admire her, I cannot agree with her proposal (Walaupun saya kagum dengannya, saya tidak boleh bersetuju).</i> <b>adjektif / kata keterangan + as + subjek + kata kerja</b> (inversi untuk percanggahan): <i>Tired as he was, he carried on working (Walaupun penat, dia terus bekerja). Try as she might, she could not open it.</i> <b>however / whatever / no matter</b> + adjektif: <i>However hard I try, I can't remember her name (Sekuat mana pun saya cuba…).</i> <b>for all</b> + kata nama: <i>For all his wealth, he is unhappy.</i> <b>albeit</b> + adjektif / frasa (formal): <i>a slow, albeit steady, improvement (peningkatan yang perlahan, walaupun tetap).</i></p><h4>2. Penghubung antara ayat</h4><p><b>However, nevertheless, nonetheless, even so, still, that said, yet</b> memulakan ayat baharu atau mengikuti koma bertitik, dengan koma: <i>The plan was cheap. Nonetheless, it was unreliable.</i> <b>On the one hand … on the other hand</b> (di satu pihak … di pihak lain) mengimbangi dua pandangan. <b>In contrast, by contrast, conversely</b> memperkenalkan idea yang bertentangan. <b>Whereas / while</b> membezakan dua fakta: <i>Ali is tall, whereas his brother is short.</i></p><h4>3. "though" tidak formal</h4><p><i>It was cheap. It wasn't very good, though.</i> (<b>though</b> di hujung ayat tidak formal.)</p><h4>4. Kesilapan lazim</h4><p>✘ Despite of the delay → ✔ Despite the delay. ✘ Although he was tired, but he continued → ✔ satu penghubung sahaja. ✘ In spite he was tired → ✔ In spite of the fact that he was tired.</p>`,
q:[["___ I admire her, I cannot agree with her proposal.",["Much as","Despite","However","Whereas"],0],["___ he was, he carried on working.",["Tired as","Despite tired","Although as","Even tired"],0],["She made a slow, ___ steady, improvement.",["albeit","despite","whereas","however"],0],["'For all his wealth, he is unhappy.' 'For all' means:",["despite","because of","instead of","as well as"],0],["___ hard I try, I can't remember her name.",["However","Despite","Although","Whereas"],0],["The first plan was cheap. ___, it was unreliable.",["Nonetheless","In addition","Consequently","For instance"],0],["Which is correct?",["Despite of the delay, we arrived on time.","Despite the delay, we arrived on time.","Despite the delay was long, we arrived.","In despite of the delay, we arrived."],1],["'Whereas' is used to:",["contrast two facts","add information","show a result","show a purpose"],0],["'It was cheap. It wasn't very good, though.' 'though' at the end is:",["informal contrast","a formal conclusion","a result","a condition"],0],["'On the other hand' often follows:",["on the one hand","in addition","as a result","for instance"],0],["'Conversely' introduces:",["the opposite idea","an example","a result","an addition"],0],["___ the fact that she was ill, she attended.",["In spite of","Although","However","Whereas"],0],["Which is the most formal?",["albeit","but","though","still"],0],["'Even so', 'still' and 'nonetheless' are:",["sentence adverbs showing contrast","prepositions","articles","quantifiers"],0],["Which is correct?",["Although he was tired, he continued.","Although he was tired, but he continued.","Despite he was tired, he continued.","In spite he was tired, he continued."],0]]},
{t:["C1 · Ellipsis","C1 · Ellipsis (Penggugusan Perkataan)"],
en:`<h4>1. What is ellipsis?</h4><p>Ellipsis is the <b>omission of words</b> that the reader or listener can recover from context. It avoids repetition and makes language more natural and economical.</p><h4>2. Common types</h4><table><tr><th>Type</th><th>Example (omitted words in brackets)</th></tr><tr><td>After and / but / or</td><td>She opened the door and [she] walked in. I like tea but [I do] not coffee.</td></tr><tr><td>After an auxiliary</td><td>"Have you finished?" "Yes, I have [finished]." She can swim and he can [swim] too.</td></tr><tr><td>To-infinitive without repeating the verb</td><td>I didn't want to go, but I had to [go]. I'll go if you want me to [go].</td></tr><tr><td>Subject + be in adverbial clauses</td><td>While [I was] waiting for the bus, I read a magazine. When [it is] necessary, ring the bell.</td></tr><tr><td>Comparisons</td><td>She is taller than I [am].</td></tr><tr><td>Relative pronoun as object</td><td>The book [that] I read was great.</td></tr><tr><td>Replacing a clause: so / not</td><td>If so, call me. If not, leave a message.</td></tr><tr><td>Informal speech, notes, headlines, instructions</td><td>Want some? Sounds good. Cars for sale. Tired. Going to bed.</td></tr><tr><td>Gapping (formal contrast)</td><td>She likes tea and I [like] coffee.</td></tr></table><h4>3. Rules and cautions</h4><p>The omitted words must be <b>recoverable</b> from context. Keep the auxiliary if it is needed (✘ She can swim and he too can). In adverbial clauses the omitted subject must be the same as the main subject. Ellipsis is more common in informal speech; formal writing uses it more carefully. In <b>headlines</b>, articles and auxiliaries are usually omitted.</p>`,
bm:`<h4>1. Apakah ellipsis?</h4><p>Ellipsis ialah <b>penggugusan perkataan</b> yang boleh difahami oleh pembaca atau pendengar daripada konteks. Ia mengelakkan pengulangan dan menjadikan bahasa lebih semula jadi serta ringkas.</p><h4>2. Jenis lazim (perkataan yang digugurkan dalam kurungan)</h4><p><b>Selepas and / but / or:</b> She opened the door and [she] walked in. I like tea but [I do] not coffee. <b>Selepas kata kerja bantu:</b> "Have you finished?" "Yes, I have [finished]." <b>To-infinitif tanpa mengulang kata kerja:</b> I didn't want to go, but I had to [go]. <b>Subjek + be dalam klausa keterangan:</b> While [I was] waiting for the bus, I read a magazine. When [it is] necessary, ring the bell. <b>Perbandingan:</b> She is taller than I [am]. <b>Kata ganti relatif sebagai objek:</b> The book [that] I read was great. <b>Menggantikan klausa dengan so / not:</b> If so, call me (Jika begitu, telefon saya). If not, leave a message. <b>Pertuturan tidak formal, nota, tajuk berita, arahan:</b> Want some? Sounds good. Cars for sale. Tired. Going to bed. <b>Gapping (percanggahan formal):</b> She likes tea and I [like] coffee.</p><h4>3. Peraturan dan amaran</h4><p>Perkataan yang digugurkan mesti <b>boleh dipulihkan</b> daripada konteks. Kekalkan kata kerja bantu jika diperlukan (✘ She can swim and he too can). Dalam klausa keterangan, subjek yang digugurkan mesti sama dengan subjek utama. Ellipsis lebih lazim dalam pertuturan tidak formal; penulisan formal menggunakannya dengan lebih berhati-hati. Dalam <b>tajuk berita</b>, kata sandang dan kata kerja bantu biasanya digugurkan.</p>`,
q:[["'Have you finished?' 'Yes, I ___.'",["have","have finished it","did","am"],0],["I didn't want to go, but I had ___.",["to","to go to","go","going"],0],["While ___ for the bus, I read a magazine.",["waiting","I waiting","waited","was waiting me"],0],["She is taller than I ___.",["am","be","was","do"],0],["Ellipsis means:",["omitting words that can be understood from context","adding extra words","repeating words","changing word order"],0],["'Want some?' is an ellipsis of:",["Do you want some?","You want some do?","Are you want some?","Want you some?"],0],["Which is correct?",["She can play the piano, and he can too.","She can play the piano and he can playing.","She can play piano he can.","She can play and he too can piano."],0],["In headlines, ellipsis usually omits:",["articles and auxiliaries","nouns","verbs only","punctuation only"],0],["'I'll go if you want me to.' 'to' stands for:",["go","went","going","gone"],0],["'If so, call me.' 'so' replaces:",["the previous clause","a noun","a place","a time"],0],["Which sentence has correct ellipsis?",["When necessary, ring the bell.","When necessary ring the bell it.","When necessary the ring bell.","When necessarily, ring bell."],0],["Ellipsis is especially common in:",["informal speech","only legal texts","only poems","nowhere"],0],["In 'The book I read was great', the omitted word is:",["that","what","who","where"],0],["In 'She likes tea and I coffee', the omitted word is:",["like","to","the","was"],0],["An omitted word must be:",["recoverable from context","new information","a noun only","ignored"],0]]},
{t:["C1 · Emphasis: Cleft Sentences, Inversion & Auxiliaries","C1 · Penekanan: Ayat Cleft, Inversi & Kata Kerja Bantu"],
en:`<h4>1. It-cleft sentences</h4><p><b>It + be + focus + who / that + clause</b> puts the main focus on one part: <i>It was John who broke the window. It was in 2019 that we met. It was last year that she moved.</i></p><h4>2. Wh-cleft (pseudo-cleft) sentences</h4><p><b>What / All / The thing / The reason + clause + be + focus:</b> <i>What I need is a holiday. All I want is some peace. The reason why I left is that I was bored.</i> <b>Reversed wh-cleft:</b> <i>A holiday is what I need. The noise is what annoys me.</i></p><h4>3. Emphatic do / does / did</h4><p>Use <b>do / does / did + base verb</b> in positive sentences for emphasis or contradiction: <i>I did tell you! She does look tired today.</i></p><h4>4. Stress on the auxiliary</h4><p>In speech, stress the auxiliary to contradict: <i>"You haven't paid." – "I HAVE paid."</i></p><h4>5. Inversion for emphasis</h4><p><b>So + adjective</b> or <b>such</b> at the start: <i>So difficult was the exam that most students failed. Such was the force of the storm that trees fell.</i> <b>It was not until … that:</b> <i>It was not until midnight that the storm stopped.</i> (More on inversion after negative adverbials in a later topic.)</p><h4>6. Common mistakes</h4><p>✘ What I need it is a holiday → ✔ What I need is a holiday. ✘ The reason is because → ✔ The reason is that. ✘ It was John what broke it → ✔ who / that.</p>`,
